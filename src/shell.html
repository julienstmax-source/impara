/* ───────── Tokens ───────── */
:root{
  --bg:#EEF0F3; --card:#FFFFFF; --ink:#171A21; --ink-2:#4B5160; --muted:#636A79; --line:#E1E4EA; --line-2:#CFD4DD; --field:#8D94A3;
  --brand:#8E1B3C; --brand-2:#6E1230; --brand-soft:#F6E7EC; --on-brand:#FFFFFF; --brand-ink:#8E1B3C; --ok-ink:#1F6B41; --err-ink:#B02A2A;
  --gold:#D99A1E; --gold-soft:#FBF1DB; --ok:#2E8B57; --ok-soft:#E3F3EA; --info:#2456C2; --info-soft:#E4EBFA; --err:#D23C3C; --err-soft:#FBE4E4;
  --c1:#B8325A; --c2:#2F62D6; --c3:#2E8B57; --c4:#B9800F; --tab-bg:#FFFFFF; --focus:#8E1B3C; --tile-ok:#27744A; --streak-fg:#7A5410; --tabs-h:58px;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif; --serif:'Newsreader',Georgia,"Times New Roman",serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#9BA1AF; --line:#2A2E38; --line-2:#3A3F4B; --field:#6B7282;
  --brand:#A82A50; --brand-2:#861A3A; --brand-soft:#2E1A21; --brand-ink:#E88AA8; --ok-ink:#5CC489; --err-ink:#F08A8A; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --c1:#C94F76; --c2:#5B86E8; --c3:#3FA86D; --c4:#B98120; --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --streak-fg:#F2CC7A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#9BA1AF; --line:#2A2E38; --line-2:#3A3F4B; --field:#6B7282;
  --brand:#A82A50; --brand-2:#861A3A; --brand-soft:#2E1A21; --brand-ink:#E88AA8; --ok-ink:#5CC489; --err-ink:#F08A8A; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --c1:#C94F76; --c2:#5B86E8; --c3:#3FA86D; --c4:#B98120; --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --streak-fg:#F2CC7A; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{box-sizing:border-box}
#app,#view{height:100%;position:relative;overflow:hidden}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
:is(button,input,select,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.it{font-family:var(--serif);font-weight:500}

/* ───────── Shell ───────── */
.shell{height:100%;display:flex;position:relative;overflow:hidden;container:shell / inline-size}
.side{display:none}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bar{position:sticky;top:0;z-index:20;flex:none;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;min-height:48px}
.bar .back{display:flex;align-items:center;gap:4px;color:var(--brand-ink);font-weight:700;font-size:14px;min-height:44px;padding:0 8px 0 0;margin:-4px 0}
.bar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.root h1{font-size:26px;letter-spacing:-.03em}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--streak-fg);border-radius:999px;min-height:40px;padding:0 12px 0 10px;font-size:13px;font-weight:700;text-decoration:none}
.streak svg.i{width:15px;height:15px;stroke:currentColor;fill:currentColor}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:var(--card);border:1px solid var(--line)}
.content{flex:1;padding:4px 14px calc(78px + var(--sab));max-width:760px;width:100%}

.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--tab-bg);border-top:1px solid var(--line);display:flex;min-height:calc(var(--tabs-h) + var(--sab));padding:6px 6px calc(6px + var(--sab))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 3px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none;border-radius:10px;position:relative}
.tabs a.on{color:var(--brand-ink)}
.tabs a.on::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--brand-ink)}
.tabs a svg.i{width:22px;height:22px}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brand);color:#fff;font-size:11px;line-height:1;padding:3px 5px;border-radius:999px;font-weight:800}

@container shell (min-width:900px){
  .side{display:flex;flex-direction:column;width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;gap:4px;overflow-y:auto}
  .side .logo{font-weight:800;font-size:20px;letter-spacing:-.02em;padding:4px 10px 14px;color:var(--brand-ink)}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px}
  .side a.on{background:var(--brand-soft);color:var(--brand-ink)}
  .side .grow{flex:1}
  .tabs{display:none}
  .bar{padding-left:28px;max-width:820px}
  .content{padding:8px 28px 40px;max-width:820px}
}

/* ───────── Primitives ───────── */
.h2{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:10px 0 8px}
.h3{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.h3btn{display:grid;place-items:center;width:44px;height:40px;margin:-8px -10px -8px 0;border-radius:8px;color:var(--muted);font-size:14px} .h3btn svg.i{width:16px;height:16px} .h3btn:disabled{opacity:.6}
.p{color:var(--ink-2);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-m);font-weight:700;font-size:15px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--tile-ok);border-color:var(--tile-ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}


.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:14px;margin-bottom:12px}
.banner svg.i{color:var(--brand-ink)}
.banner.warn{background:var(--gold-soft);border-color:transparent} .banner.warn svg.i{color:var(--streak-fg)}
.banner.ok{background:var(--ok-soft);border-color:transparent} .banner.ok svg.i{color:var(--ok-ink)}
.banner .t{flex:1;min-width:0;line-height:1.35} .banner .t small{display:block;color:var(--muted);font-size:12px}
.banner .act{color:var(--brand-ink);font-weight:700;font-size:13px;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;padding:0 4px;text-decoration:none}
.steps{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink-2)}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:54px;width:100%;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-ink)}
.row .ic.info{background:var(--info-soft);color:var(--info)} .row .ic.ok{background:var(--ok-soft);color:var(--ok-ink)} .row .ic.gold{background:var(--gold-soft);color:var(--gold)} .row .ic.muted{background:var(--bg);color:var(--muted)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.row .end{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .end svg.i{width:16px;height:16px;color:var(--line-2)}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.brand .fg{stroke:var(--brand)}

.item{display:flex;align-items:flex-start;border-top:1px solid var(--line);width:100%}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.item>.spk{margin:7px 6px 0 0}
.item .k{width:8px;height:8px;border-radius:50%;margin-top:9px;flex:none;background:var(--info)}
.item .k.phrase{background:var(--brand)} .item .k.conj{background:var(--ok)}
.item .tx{flex:1;min-width:0}
.item .tx .w{display:block;font-size:17px;line-height:1.3}
.item .tx .tr{display:block;font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.item .tx .tr i{color:var(--muted);font-style:italic}
.item .tx .hint{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item time{font-size:12px;color:var(--muted);font-weight:600;padding-top:3px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--ink-2);margin-top:4px}

.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--card);color:var(--brand-ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{padding:12px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.field .inl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field .inl label{margin:0;color:var(--ink);font-size:15px;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}
.hours{display:flex;align-items:center;gap:8px}
.hours span{color:var(--muted)}
.hours select{flex:1;min-height:44px;font-size:16px;border:1px solid var(--field);border-radius:10px;background:var(--card);padding:0 10px;font-weight:600;-webkit-appearance:none;appearance:none}

/* ───────── Flashcard (l'élément signature) ───────── */
.scene{perspective:1400px;margin:8px 0 10px}
.fcard{display:block;width:100%;position:relative;height:300px;border-radius:var(--r-l);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-l);padding:26px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 32px -18px rgba(23,26,33,.35)}
.face.back{background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;transform:rotateY(180deg);box-shadow:0 14px 36px -16px rgba(142,27,60,.6)}
.face .lv{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;color:var(--muted)}
.face.back .lv{color:rgba(255,255,255,.75)}
.face .word{font-family:var(--serif);font-size:clamp(28px,8vw,40px);line-height:1.12;font-weight:500;letter-spacing:-.01em}
.face.front .word{color:var(--brand-ink)}
.face .ex{margin-top:14px;font-size:15px;line-height:1.5;color:var(--ink-2);font-family:var(--serif);font-style:italic}
.face.back .ex{color:rgba(255,255,255,.88)}
.face .fr{font-size:clamp(20px,5.6vw,26px);font-weight:700;line-height:1.25}
.face .tap{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted);font-weight:600}
.face.back .tap{color:rgba(255,255,255,.7)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}}
.under{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600;padding:0 4px}

/* ───────── Quiz / exercices ───────── */
.q{font-family:var(--serif);font-size:clamp(22px,6vw,30px);line-height:1.25;margin:14px 0 14px;text-align:center}
.q.sans{font-family:var(--sans);font-weight:800;font-size:clamp(19px,5vw,24px);letter-spacing:-.01em}
.lead{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;padding:12px 14px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:16px;width:100%;display:flex;align-items:center;gap:10px}
.opt .n{width:24px;height:24px;border-radius:7px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--err-soft);border-color:var(--err)} .opt.wrong .n{background:var(--err);color:#fff}
.opt:disabled{opacity:1}
.tin{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--field);border-radius:var(--r-m);background:var(--card);font-family:var(--serif);font-size:22px;text-align:center}
.tin:focus{border-color:var(--brand)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)} .tin.wrong{border-color:var(--err);background:var(--err-soft)}
.fb{margin-top:12px;padding:10px 12px;border-radius:var(--r-m);font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line)}
.fb.good{border-color:var(--ok);background:var(--ok-soft)} .fb.bad{border-color:var(--err);background:var(--err-soft)}
.fb b{font-family:var(--serif);font-size:16px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.score{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.result{text-align:center;padding:26px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);margin-top:14px}
.result .big{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--brand-ink);line-height:1}
.result .t{font-size:18px;font-weight:800;margin-top:10px} .result .s{color:var(--muted);font-size:14px;margin-top:4px}

/* ───────── Grammatica ───────── */
.lesson p{color:var(--ink-2);font-size:15px;line-height:1.55;margin:6px 0 12px}
.gtab{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:10px 0}
.gtab th{background:var(--bg);color:var(--muted);font-weight:700;text-align:left;padding:7px 10px;font-size:12px}

.fb .spk{display:inline-grid;width:28px;height:28px;vertical-align:middle}
.scene{position:relative}
.menu .row{min-height:52px} .menu .course{width:74px;flex:none;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--brand-ink)}

svg.i.okc{color:var(--ok-ink)}
.step .num{width:22px;flex:none;text-align:center;font-size:12px;font-weight:800;color:var(--muted)} .step .num svg.i{width:16px;height:16px;color:var(--ok-ink)}

.vlab{display:flex;gap:3px;margin-top:4px} .vlab small{flex:1;max-width:24px;text-align:center;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:visible}

.hbar.c3{grid-template-columns:118px 1fr 52px}
.anim .vstack{animation:growy .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}

.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink)}

.status svg.i{width:14px;height:14px}

.kv small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:2px} .kv b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{position:absolute;z-index:60;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:230px;white-space:pre-line;box-shadow:0 8px 24px -12px rgba(0,0,0,.45);transform:translate(-50%,calc(-100% - 8px))}
.tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip b{color:inherit}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;margin-top:10px}

.card + .card{margin-top:8px}
.card .h4{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sk{color:var(--muted);font-size:14px;text-align:center;padding:22px 10px}
/* ───────── v3.2 : spiegazioni animate ───────── */
.xbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:var(--r-m);background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;text-align:left;margin:4px 0 12px}

.xt{display:inline-block;font-family:var(--serif);font-size:21px;line-height:1.2;padding:3px 6px;border-radius:8px;color:var(--ink);position:relative;white-space:nowrap}

/* ───────── v4 : compteurs, carta, actions ancrées, sauvegarde ───────── */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Menù del giorno : la carte d'une trattoria (filet intérieur, plats en italique, pointillés jusqu'à la portion) */

.course.done .c-val{color:var(--ok-ink)}
.carta-end{text-align:center;font-style:italic;font-size:18px;color:var(--ok-ink);padding:4px 0 2px}
.nline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:0 2px 8px}
.nline svg.i{width:16px;height:16px;color:var(--ok-ink)} .nline span{flex:1;min-width:0}
.news{background:var(--brand-soft);border-radius:var(--r-m);padding:12px 14px 6px;margin-bottom:12px;font-size:14px}
.news b{display:block;color:var(--brand-ink);margin-bottom:4px} .news ul{margin:0;padding-left:18px;line-height:1.5;color:var(--ink-2)}
.cols.one{display:block}
/* Écrans d'exercice : le contenu occupe la hauteur, l'action principale reste en bas, au-dessus des onglets */
.content.fill{display:flex;flex-direction:column;padding-bottom:calc(var(--tabs-h) + var(--sab))}
.fill{flex:1;display:flex;flex-direction:column;min-height:0}

.fb{animation:fbin .22s ease backwards} @keyframes fbin{from{opacity:0;transform:translateY(6px)}}
@container shell (min-width:900px){

}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
