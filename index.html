<script>window.CONTENT = {"CATEGORIES":[{"id":"essenziali","label":"Parole utili","emoji":"💬","desc":"Les petits mots qui font les vraies phrases"},{"id":"quotidiano","label":"Vita quotidiana","emoji":"🏠","desc":"Maison, courses, démarches de tous les jours"},{"id":"lavoro","label":"Al lavoro","emoji":"💼","desc":"Contrats, salaire, réunions, vie de bureau"},{"id":"ristorante","label":"Al ristorante","emoji":"🍝","desc":"Commander, partager, apprécier comme un local"},{"id":"trasporti","label":"Strada & trasporti","emoji":"🚗","desc":"Voiture, train, ville : le vocabulaire pratique"},{"id":"tempo","label":"Tempo & date","emoji":"🕐","desc":"Situer dans le temps avec précision"},{"id":"verbi","label":"Verbi che contano","emoji":"⚡","desc":"Les verbes A2-B1 qui changent tout"},{"id":"espressioni","label":"Espressioni","emoji":"🎭","desc":"Idiomes et tournures de vrai Italien"},{"id":"libro","label":"Frasi del libro","emoji":"📕","desc":"Les phrases types des 12 unités de Vivi l'italiano"}],"WORDS":[{"id":"e1","cat":"essenziali","lv":"A2","it":"comunque","fr":"de toute façon, quoi qu'il en soit","ex":"Comunque, ci vediamo domani.","exFr":"De toute façon, on se voit demain."},{"id":"e2","cat":"essenziali","lv":"B1","it":"addirittura","fr":"carrément, même (renforce)","ex":"Ha addirittura pagato per tutti!","exFr":"Il a carrément payé pour tout le monde !"},{"id":"e3","cat":"essenziali","lv":"A2","it":"appena","fr":"à peine / dès que","ex":"Ti chiamo appena arrivo.","exFr":"Je t'appelle dès que j'arrive."},{"id":"e4","cat":"essenziali","lv":"B1","it":"mica","fr":"pas du tout, quand même pas (renforce la négation)","ex":"Non è mica facile!","exFr":"C'est pas facile du tout !"},{"id":"e5","cat":"essenziali","lv":"A2","it":"ormai","fr":"désormais / maintenant (c'est trop tard)","ex":"Ormai è troppo tardi per il treno.","exFr":"Maintenant c'est trop tard pour le train."},{"id":"e6","cat":"essenziali","lv":"A2","it":"quindi","fr":"donc","ex":"Piove, quindi resto a casa.","exFr":"Il rende","dorme","finisce"],["noi","parliamo","prendiamo","dormiamo","finiamo"],["voi","parlate","prendete","dormite","finite"],["loro","parlano","prendono","dormono","finiscono"]]}],"exs":[{"it":"Capisco quasi tutto ma parlo piano.","fr":"Je comprends presque tout mais je parle lentement."}],"quiz":[{"q":"(io) ___ italiano ogni giorno. (parlare)","opts":["parlo","parli","parla"],"a":0,"why":"io → -o : parlo."},{"q":"(voi) ___ il tram delle otto? (prendere)","opts":["prendere","prendete","prendiamo"],"a":1,"why":"voi → -ete : prendete."},{"q":"Lei ___ di lavorare alle sei. (finire)","opts":["fine","finisce","finito"],"a":1,"why":"Type -isc : finisce."},{"q":"(noi) ___ poco durante la settimana. (dormire)","opts":["dormiamo","dormite","dormono"],"a":0,"why":"noi → -iamo : dormiamo."}]},{"id":"g4","track":"ripasso","title":"Presente: verbi irregolari","ref":"Vivi l'italiano · Unità 6","intro":"Les incontournables : andare, fare, venire, uscire, stare, dare, dire, bere. Avec les verbes de mouvement, retiens : andare A Torino (ville), IN Italia (pays), DA Marco (chez quelqu'un), AL cinema.","tables":[{"h":["","andare","fare","venire","uscire"],"r":[["io","vado","faccio","vengo","esco"],["tu","vai","fai","vieni","esci"],["lui / lei","va","fa","viene","esce"],["noi","andiamo","facciamo","veniamo","usciamo"],["voi","andate","fate","venite","uscite"],["loro","vanno","fanno","vengono","escono"]]}],"exs":[{"it":"Stasera esco: vado da Luca.","fr":"Ce soir je sors : je vais chez Luca."}],"quiz":[{"q":"(io) ___ al lavoro in tram. (andare)","opts":["vado","ando","vai"],"a":0,"why":"andare est irrégulier : io vado."},{"q":"(loro) ___ colazione al bar. (fare)","opts":["fano","fanno","fate"],"a":1,"why":"loro fanno (double n)."},{"q":"(tu) ___ stasera? (uscire)","opts":["usci","esci","esce"],"a":1,"why":"uscire : io esco, tu esci."},{"q":"Vado ___ Italia ogni estate.","opts":["a","in","da"],"a":1,"why":"Pays → in : in Italia (ville → a : a Torino)."}]},{"id":"g5","track":"ripasso","title":"I verbi modali","ref":"Vivi l'italiano · Unità 7","intro":"Potere (pouvoir), volere (vouloir), dovere (devoir) + sapere (savoir faire). Ils sont suivis de l'infinitif : devo lavorare, voglio imparare, posso venire.","tables":[{"h":["","potere","volere","dovere","sapere"],"r":[["io","posso","voglio","devo","so"],["tu","puoi","vuoi","devi","sai"],["lui / lei","può","vuole","deve","sa"],["noi","possiamo","vogliamo","dobbiamo","sappiamo"],["voi","potete","volete","dovete","sapete"],["loro","possono","vogliono","devono","sanno"]]}],"exs":[{"it":"Non posso venire, devo finire un preventivo.","fr":"Je ne peux pas venir, je dois finir un devis."}],"quiz":[{"q":"(io) non ___ venire alla riunione.","opts":["posso","puoi","possa"],"a":0,"why":"io posso."},{"q":"___ un caffè? (tu, volere)","opts":["Voglio","Vuoi","Vuole"],"a":1,"why":"tu vuoi."},{"q":"(noi) ___ consegnare entro venerdì. (dovere)","opts":["dovete","dobbiamo","devono"],"a":1,"why":"noi dobbiamo."},{"q":"Lei ___ guidare? (sapere)","opts":["sa","sai","sanno"],"a":0,"why":"lui/lei sa."}]},{"id":"g6","track":"ripasso","title":"I possessivi","ref":"Vivi l'italiano · Unità 5, 11","intro":"Article + possessif : il mio lavoro, la mia casa, i miei colleghi, le mie chiavi. Exception clé : pas d'article avec la famille au singulier (mia madre, mio fratello) — sauf avec « loro » (la loro madre).","tables":[{"h":["","masc. sing.","fém. sing.","masc. plur.","fém. plur."],"r":[["à moi","il mio","la mia","i miei","le mie"],["à toi","il tuo","la tua","i tuoi","le tue"],["à lui/elle","il suo","la sua","i suoi","le sue"],["à nous","il nostro","la nostra","i nostri","le nostre"],["à vous","il vostro","la vostra","i vostri","le vostre"],["à eux","il loro","la loro","i loro","le loro"]]}],"exs":[{"it":"Mia sorella vive a Parigi, i miei genitori a Bordeaux.","fr":"Ma sœur vit à Paris, mes parents à Bordeaux."}],"quiz":[{"q":"___ macchina è rossa. (à moi)","opts":["La mia","Mia","Il mio"],"a":0,"why":"Objet → article obligatoire : la mia macchina."},{"q":"___ fratello vive a Lione.","opts":["Il mio","Mio","I miei"],"a":1,"why":"Famille au singulier → pas d'article : mio fratello."},{"q":"I ___ colleghi sono in ferie.","opts":["mio","miei","mie"],"a":1,"why":"Masc. pluriel → i miei."},{"q":"___ casa è in centro. (à eux)","opts":["Loro","La loro","Le loro"],"a":1,"why":"Loro prend toujours l'article : la loro casa."}]},{"id":"g7","track":"ripasso","title":"I verbi riflessivi","ref":"Vivi l'italiano · Unità 9","intro":"Le pronom se place avant le verbe : mi sveglio, ti alzi, si veste… Au passato prossimo, toujours avec essere : mi sono svegliato / svegliata.","tables":[{"h":["","svegliarsi","alzarsi"],"r":[["io","mi sveglio","mi alzo"],["tu","ti svegli","ti alzi"],["lui / lei","si sveglia","si alza"],["noi","ci svegliamo","ci alziamo"],["voi","vi svegliate","vi alzate"],["loro","si svegliano","si alzano"]]}],"exs":[{"it":"Mi sveglio alle sette e mi preparo in fretta.","fr":"Je me réveille à sept heures et je me prépare vite."}],"quiz":[{"q":"(io) ___ alle sette. (svegliarsi)","opts":["mi sveglio","si sveglio","sveglio"],"a":0,"why":"io → mi : mi sveglio."},{"q":"A che ora ___ ? (tu, alzarsi)","opts":["si alzi","ti alzi","ti alza"],"a":1,"why":"tu → ti + -i : ti alzi."},{"q":"(noi) ___ presto la sera. (addormentarsi)","opts":["ci addormentiamo","vi addormentiamo","si addormentiamo"],"a":0,"why":"noi → ci : ci addormentiamo."},{"q":"Ieri (io, fém.) ___ tardi. (svegliarsi, passé)","opts":["ho svegliato","mi sono svegliata","mi ho svegliata"],"a":1,"why":"Réfléchi au passé → essere : mi sono svegliata."}]},{"id":"g8","track":"ripasso","title":"Il passato prossimo","ref":"Vivi l'italiano · Unità 10","intro":"Présent de AVERE ou ESSERE + participe passé (-ato, -uto, -ito). ESSERE pour : mouvement (andare, venire, arrivare, partire, uscire, tornare), permanence (stare, rimanere), changement (nascere, diventare) et les réfléchis. Avec essere, le participe s'accorde : Maria è arrivata.","tables":[{"h":["avec AVERE","avec ESSERE"],"r":[["ho parlato","sono andato/a"],["hai preso","sei venuto/a"],["ha visto","è arrivato/a"],["abbiamo mangiato","siamo usciti/e"]]},{"h":["participes irréguliers"],"r":[["fare → fatto · dire → detto · prendere → preso"],["vedere → visto · leggere → letto · scrivere → scritto"],["aprire → aperto · bere → bevuto · rimanere → rimasto"],["essere → stato · venire → venuto · mettere → messo"]]}],"exs":[{"it":"Ieri sono andato al mercato e ho comprato del pesce.","fr":"Hier je suis allé au marché et j'ai acheté du poisson."}],"quiz":[{"q":"Ieri (io) ___ al cinema. (andare)","opts":["ho andato","sono andato","sono andando"],"a":1,"why":"Mouvement → essere : sono andato/a."},{"q":"(noi) ___ una pizza buonissima. (mangiare)","opts":["abbiamo mangiato","siamo mangiati","avete mangiato"],"a":0,"why":"Verbe transitif → avere : abbiamo mangiato."},{"q":"Maria ___ in ritardo. (arrivare)","opts":["ha arrivato","è arrivato","è arrivata"],"a":2,"why":"Essere → accord au féminin : è arrivata."},{"q":"(tu) ___ quel film? (vedere)","opts":["hai visto","hai veduto","sei visto"],"a":0,"why":"Participe irrégulier : visto → hai visto."}]},{"id":"g9","track":"ripasso","title":"I pronomi diretti","ref":"Vivi l'italiano · Unità 12","intro":"Lo, la, li, le remplacent le complément direct et se placent avant le verbe : Compri il pane? Sì, lo compro. Au passato prossimo, le participe s'accorde avec le pronom : Hai visto Maria? Sì, l'ho vista.","tables":[{"h":["","singulier","pluriel"],"r":[["masculin","lo (l')","li"],["féminin","la (l')","le"]]}],"exs":[{"it":"Le chiavi? Le ho lasciate in ufficio.","fr":"Les clés ? Je les ai laissées au bureau."}],"quiz":[{"q":"Compri il pane? Sì, ___ compro.","opts":["lo","la","li"],"a":0,"why":"il pane (masc. sing.) → lo."},{"q":"Hai visto Maria? Sì, ___ ho vista.","opts":["lo","l'","le"],"a":1,"why":"la + ho → l'ho vista (accord)."},{"q":"Inviti i colleghi? Sì, ___ invito.","opts":["li","le","gli"],"a":0,"why":"i colleghi (masc. plur.) → li."},{"q":"Hai comprato le mele? Sì, ___ ho comprate.","opts":["li","le","la"],"a":1,"why":"le mele → le… comprate (accord)."}]},{"id":"g10","track":"ripasso","title":"Le preposizioni","ref":"Vivi l'italiano · Unità 6-8","intro":"Simples (a, in, da, di, su, per, con) et articulées : a + il = al, in + la = nella, su + il = sul, da + la = dalla, di + il = del… Repères : a Torino (ville), in Italia (pays), dal medico (chez), alle otto (heure).","tables":[{"h":["+","il","lo","la","i","gli","le"],"r":[["a","al","allo","alla","ai","agli","alle"],["in","nel","nello","nella","nei","negli","nelle"],["di","del","dello","della","dei","degli","delle"],["da","dal","dallo","dalla","dai","dagli","dalle"],["su","sul","sullo","sulla","sui","sugli","sulle"]]}],"exs":[{"it":"Vado dal medico alle nove, poi torno in ufficio.","fr":"Je vais chez le médecin à neuf heures, puis je retourne au bureau."}],"quiz":[{"q":"Vado ___ Francia per il weekend.","opts":["a","in","da"],"a":1,"why":"Pays → in : in Francia."},{"q":"Il documento è ___ tavolo.","opts":["sul","nel","al"],"a":0,"why":"su + il = sul (sur le)."},{"q":"Domani vado ___ dentista.","opts":["al","dal","nel"],"a":1,"why":"Chez quelqu'un → da : dal dentista."},{"q":"La riunione è ___ dieci.","opts":["alle","a","nelle"],"a":0,"why":"Heure → alle dieci."}]},{"id":"g11","track":"avanti","title":"L'imperfetto","ref":"Nouveau · A2","intro":"Le temps de la description et de l'habitude au passé : « quand j'étais petit… », « il faisait beau… ». Formation très régulière : radical + -avo / -evo / -ivo. Seul essere est vraiment irrégulier.","tables":[{"h":["","parlare","avere","essere","fare"],"r":[["io","parlavo","avevo","ero","facevo"],["tu","parlavi","avevi","eri","facevi"],["lui / lei","parlava","aveva","era","faceva"],["noi","parlavamo","avevamo","eravamo","facevamo"],["voi","parlavate","avevate","eravate","facevate"],["loro","parlavano","avevano","erano","facevano"]]}],"exs":[{"it":"Da bambino abitavo vicino a Bordeaux.","fr":"Enfant, j'habitais près de Bordeaux."}],"quiz":[{"q":"Da bambino ___ a calcio ogni giorno. (giocare)","opts":["giocavo","ho giocato","giocherò"],"a":0,"why":"Habitude passée → imperfetto : giocavo."},{"q":"Ieri ___ molto freddo. (fare)","opts":["faceva","ha fatto","farà"],"a":0,"why":"Description (météo) → faceva freddo."},{"q":"(noi) ___ al mare ogni estate. (andare)","opts":["siamo andati","andavamo","andremo"],"a":1,"why":"« ogni estate » = habitude → andavamo."},{"q":"Mentre (io) ___, ha squillato il telefono. (dormire)","opts":["ho dormito","dormivo","dormirò"],"a":1,"why":"Action en cours interrompue → dormivo."}]},{"id":"g12","track":"avanti","title":"Passato prossimo vs imperfetto","ref":"Nouveau · A2-B1","intro":"LE grand duo du récit. Passato prossimo = action ponctuelle, terminée, qui fait avancer l'histoire. Imperfetto = décor, description, habitude, action en cours. « Mentre guardavo la TV (décor), è arrivato Luca (événement). »","tables":[{"h":["Imperfetto","Passato prossimo"],"r":[["habitude : andavo sempre…","fait unique : ieri sono andato…"],["description : era stanco, pioveva","événement : ha telefonato, è uscito"],["action en cours : mentre dormivo…","action qui interrompt : …ha bussato"]]}],"exs":[{"it":"Pioveva, così ho preso l'ombrello.","fr":"Il pleuvait, alors j'ai pris le parapluie."}],"quiz":[{"q":"Mentre ___ la TV, è arrivato Luca. (guardare)","opts":["guardavo","ho guardato","guardo"],"a":0,"why":"Action en cours (décor) → imperfetto."},{"q":"Ieri (io) ___ una macchina nuova. (comprare)","opts":["compravo","ho comprato","comprerei"],"a":1,"why":"Fait unique et terminé → passato prossimo."},{"q":"Quando ero piccolo, ___ a Lione. (abitare)","opts":["ho abitato","abitavo","abito"],"a":1,"why":"Situation durable dans le passé → imperfetto."},{"q":"All'improvviso il telefono ___. (squillare)","opts":["squillava","ha squillato","squilla"],"a":1,"why":"« all'improvviso » = événement ponctuel → passato prossimo."}]},{"id":"g13","track":"avanti","tit
