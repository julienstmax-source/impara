/* ───────── Tokens ───────── */
:root{
  --bg:#EEF0F3; --card:#FFFFFF; --ink:#171A21; --ink-2:#4B5160; --muted:#7A8090; --line:#E1E4EA; --line-2:#CFD4DD;
  --brand:#8E1B3C; --brand-2:#6E1230; --brand-soft:#F6E7EC; --on-brand:#FFFFFF;
  --gold:#D99A1E; --gold-soft:#FBF1DB; --ok:#2E8B57; --ok-soft:#E3F3EA; --info:#2456C2; --info-soft:#E4EBFA; --err:#D23C3C; --err-soft:#FBE4E4;
  --tab-bg:#FFFFFF; --focus:#8E1B3C; --tile-ok:#27744A; --tile-gold:#A8730C; --sim-bg:#D9DCE3; --sim-fg:#2B2F38; --sim-fg-2:#6B7180; --sim-card:#FFFFFF; --sim-line:#C9CDD6; --streak-fg:#7A5410;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif; --serif:'Newsreader',Georgia,"Times New Roman",serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#8A909E; --line:#2A2E38; --line-2:#3A3F4B;
  --brand:#B8325A; --brand-2:#8E1B3C; --brand-soft:#2E1A21; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --tile-gold:#B9800F; --sim-bg:#15171C; --sim-fg:#C2C6D0; --sim-fg-2:#7A8090; --sim-card:#1F2229; --sim-line:#2E323B; --streak-fg:#F2CC7A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#8A909E; --line:#2A2E38; --line-2:#3A3F4B;
  --brand:#B8325A; --brand-2:#8E1B3C; --brand-soft:#2E1A21; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --tile-gold:#B9800F; --sim-bg:#15171C; --sim-fg:#C2C6D0; --sim-fg-2:#7A8090; --sim-card:#1F2229; --sim-line:#2E323B; --streak-fg:#F2CC7A; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{box-sizing:border-box}
#app,#view{height:100%;position:relative;overflow:hidden}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
:is(button,input,select,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.it{font-family:var(--serif);font-weight:500}

/* ───────── Shell ───────── */
.shell{height:100%;display:flex;position:relative;overflow:hidden;container:shell / inline-size}
.side{display:none}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;min-height:48px}
.bar .back{display:flex;align-items:center;gap:4px;color:var(--brand);font-weight:700;font-size:14px;padding:6px 2px}
.bar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--streak-fg);border-radius:999px;padding:5px 10px 5px 8px;font-size:13px;font-weight:700;text-decoration:none}
.streak svg.i{width:15px;height:15px;stroke:var(--gold);fill:var(--gold)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:var(--card);border:1px solid var(--line)}
.content{flex:1;padding:4px 14px calc(78px + var(--sab));max-width:760px;width:100%}

.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--tab-bg);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sab))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 3px;color:var(--muted);font-size:10.5px;font-weight:700;text-decoration:none;border-radius:10px;position:relative}
.tabs a.on{color:var(--brand)}
.tabs a svg.i{width:22px;height:22px}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brand);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:999px;font-weight:800}

@container shell (min-width:900px){
  .side{display:flex;flex-direction:column;width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;gap:4px;overflow-y:auto}
  .side .logo{font-weight:800;font-size:20px;letter-spacing:-.02em;padding:4px 10px 14px;color:var(--brand)}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px}
  .side a.on{background:var(--brand-soft);color:var(--brand)}
  .side .grow{flex:1}
  .tabs{display:none}
  .bar{padding-left:28px;max-width:820px}
  .content{padding:8px 28px 40px;max-width:820px}
}

/* ───────── Primitives ───────── */
.h2{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:10px 0 8px}
.h3{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.h3btn{display:grid;place-items:center;width:30px;height:28px;border-radius:8px;color:var(--muted);font-size:14px} .h3btn svg.i{width:16px;height:16px} .h3btn:disabled{opacity:.6}
.p{color:var(--ink-2);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-m);font-weight:700;font-size:15px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--tile-ok);border-color:var(--tile-ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.tile{border-radius:var(--r-s);padding:9px 10px 8px;color:#fff;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none}
.tile b{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.tile span{font-size:11px;font-weight:600;opacity:.92;line-height:1.15}
.tile.brand{background:var(--brand)} .tile.info{background:var(--info)} .tile.ok{background:var(--tile-ok)} .tile.gold{background:var(--tile-gold)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:13.5px;margin-bottom:12px}
.banner svg.i{color:var(--brand)}
.banner.warn{background:var(--gold-soft);border-color:transparent} .banner.warn svg.i{color:var(--gold)}
.banner.ok{background:var(--ok-soft);border-color:transparent} .banner.ok svg.i{color:var(--ok)}
.banner .t{flex:1;min-width:0;line-height:1.35} .banner .t small{display:block;color:var(--muted);font-size:12px}
.banner .act{color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}
.steps{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:54px;width:100%;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.row .ic.info{background:var(--info-soft);color:var(--info)} .row .ic.ok{background:var(--ok-soft);color:var(--ok)} .row .ic.gold{background:var(--gold-soft);color:var(--gold)} .row .ic.muted{background:var(--bg);color:var(--muted)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.row .end{color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .end svg.i{width:16px;height:16px;color:var(--line-2)}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.brand .fg{stroke:var(--brand)}

.item{display:flex;align-items:flex-start;border-top:1px solid var(--line);width:100%}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.item>.spk{margin:7px 6px 0 0}
.item .k{width:8px;height:8px;border-radius:50%;margin-top:9px;flex:none;background:var(--info)}
.item .k.phrase{background:var(--brand)} .item .k.conj{background:var(--ok)}
.item .tx{flex:1;min-width:0}
.item .tx .w{display:block;font-size:17px;line-height:1.3}
.item .tx .tr{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.item .tx .tr i{color:var(--muted);font-style:italic}
.item .tx .hint{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item time{font-size:12px;color:var(--muted);font-weight:600;padding-top:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--ink-2);margin-top:4px}

.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{padding:12px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.field .inl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field .inl label{margin:0;color:var(--ink);font-size:15px;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}
.hours{display:flex;align-items:center;gap:8px}
.hours select{flex:1;min-height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);padding:0 10px;font-weight:600;-webkit-appearance:none;appearance:none}

/* ───────── Flashcard (l'élément signature) ───────── */
.scene{perspective:1400px;margin:8px 0 10px}
.fcard{display:block;width:100%;position:relative;height:300px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-l);padding:26px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 32px -18px rgba(23,26,33,.35)}
.face.back{background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;transform:rotateY(180deg);box-shadow:0 14px 36px -16px rgba(142,27,60,.6)}
.face .lv{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;color:var(--muted)}
.face.back .lv{color:rgba(255,255,255,.75)}
.face .word{font-family:var(--serif);font-size:clamp(28px,8vw,40px);line-height:1.12;font-weight:500;letter-spacing:-.01em}
.face.front .word{color:var(--brand)}
.face .ex{margin-top:14px;font-size:15px;line-height:1.5;color:var(--ink-2);font-family:var(--serif);font-style:italic}
.face.back .ex{color:rgba(255,255,255,.88)}
.face .fr{font-size:clamp(20px,5.6vw,26px);font-weight:700;line-height:1.25}
.face .tap{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted);font-weight:600}
.face.back .tap{color:rgba(255,255,255,.7)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}}
.under{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}

/* ───────── Quiz / exercices ───────── */
.q{font-family:var(--serif);font-size:clamp(22px,6vw,30px);line-height:1.25;margin:14px 0 14px;text-align:center}
.q.sans{font-family:var(--sans);font-weight:800;font-size:clamp(19px,5vw,24px);letter-spacing:-.01em}
.lead{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;padding:12px 14px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:16px;width:100%;display:flex;align-items:center;gap:10px}
.opt .n{width:24px;height:24px;border-radius:7px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--err-soft);border-color:var(--err)} .opt.wrong .n{background:var(--err);color:#fff}
.opt:disabled{opacity:1}
.tin{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:var(--r-m);background:var(--card);font-family:var(--serif);font-size:22px;text-align:center}
.tin:focus{border-color:var(--brand)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)} .tin.wrong{border-color:var(--err);background:var(--err-soft)}
.fb{margin-top:12px;padding:10px 12px;border-radius:var(--r-m);font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line)}
.fb.good{border-color:var(--ok);background:var(--ok-soft)} .fb.bad{border-color:var(--err);background:var(--err-soft)}
.fb b{font-family:var(--serif);font-size:16px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.score{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.result{text-align:center;padding:26px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);margin-top:14px}
.result .big{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--brand);line-height:1}
.result .t{font-size:18px;font-weight:800;margin-top:10px} .result .s{color:var(--muted);font-size:13.5px;margin-top:4px}

/* ───────── Grammatica ───────── */
.lesson p{color:var(--ink-2);font-size:15px;line-height:1.55;margin:6px 0 12px}
.gtab{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:10px 0}
.gtab th{background:var(--bg);color:var(--muted);font-weight:700;text-align:left;padding:7px 10px;font-size:12px}
.gtab td{padding:7px 10px;border-top:1px solid var(--line)} .gtab td:first-child{color:var(--muted);font-weight:600}
.gtab td:not(:first-child){font-family:var(--serif);font-size:15px}
.gscroll{overflow-x:auto}
.gex{border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0}
.gex .it{font-size:16px} .gex small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hero{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;text-decoration:none;margin:6px 0 4px}
.hero .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.hero b{display:block;font-size:15.5px} .hero small{font-size:12.5px;opacity:.85}

/* ───────── Giochi ───────── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .gtile:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:0}
.grid2 .gtile:last-child:nth-child(odd)>span:last-child{flex:1} .grid2 .gtile:last-child:nth-child(odd) b{margin-top:0}
.gtile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit}
.gtile .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.gtile b{display:block;font-size:14.5px;margin-top:8px} .gtile small{color:var(--muted);font-size:12px;line-height:1.3}
.cwscroll{overflow-x:auto;padding:4px 0 6px}
.cw{display:grid;gap:3px;width:max-content;margin:0 auto}
.cell{position:relative;width:var(--cs);height:var(--cs)}
.cell input{width:100%;height:100%;border:1.5px solid var(--line-2);border-radius:6px;text-align:center;font:600 calc(var(--cs)*.5) var(--sans);text-transform:uppercase;background:var(--card);padding:0;caret-color:transparent}
.cell input.act{background:var(--gold-soft);border-color:var(--gold)}
.cell input:focus{outline:2px solid var(--brand);z-index:2;position:relative}
.cell input.right{background:var(--ok-soft);border-color:var(--ok)} .cell input.wrong{background:var(--err-soft);border-color:var(--err)}
.cell .n{position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.27);font-weight:800;color:var(--muted);z-index:3;pointer-events:none}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:520px){.clues{grid-template-columns:1fr}}
.clues h4{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.clue{display:block;width:100%;padding:6px 8px;border-radius:8px;font-size:13.5px;line-height:1.4}
.clue b{color:var(--brand);margin-right:4px} .clue.on{background:var(--gold-soft)}
.slots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:14px 0}
.slot{width:34px;height:44px;border-bottom:2px solid var(--line-2);font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.slot.ok{color:var(--ok);border-color:var(--ok)} .slot.ko{color:var(--err);border-color:var(--err)}
.letters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.lb{width:42px;height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);font-weight:700;font-size:18px;text-transform:uppercase;display:grid;place-items:center}
.lb:disabled{opacity:.25}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:50px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;text-align:center}
.pb.it{font-family:var(--serif);font-weight:500;font-size:16px}
.pb.sel{border-color:var(--gold);background:var(--gold-soft)} .pb.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .pb.err{background:var(--err-soft);border-color:var(--err)}
.toast{position:absolute;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px;line-height:1.5}
.empty svg.i{width:28px;height:28px;color:var(--line-2);margin-bottom:6px}
details.day summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:12px 2px 6px}
details.day summary::-webkit-details-marker{display:none}

/* ───────── Nouveautés v3 : prononciation, menù, percorsi, progressi, compte ───────── */
.spk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.spk svg.i{width:18px;height:18px} .spk:active{color:var(--brand)}
.spk.onscene{position:absolute;right:10px;top:10px;z-index:3;background:var(--card);border:1px solid var(--line)}
.spk.inline{display:inline-grid;width:28px;height:28px;vertical-align:middle;margin-left:4px}
.fb .spk{display:inline-grid;width:28px;height:28px;vertical-align:middle}
.scene{position:relative}
a.banner{text-decoration:none;color:inherit}
.menu .row{min-height:52px} .menu .course{width:74px;flex:none;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--brand)}
.row.done .tx b{color:var(--muted)} .row.done .course{color:var(--muted)}
svg.i.okc{color:var(--ok)}
.step .num{width:22px;flex:none;text-align:center;font-size:12px;font-weight:800;color:var(--muted)} .step .num svg.i{width:16px;height:16px;color:var(--ok)}
.step.cur{background:var(--brand-soft)} .step.cur .tx b{color:var(--brand)}
.hero.static{cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:84px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-track i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.bar-col small{font-size:10px;color:var(--muted);font-weight:700}
.hbar{display:grid;grid-template-columns:120px 1fr 32px;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.hbar .track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden} .hbar .track i{display:block;height:100%;background:var(--info);border-radius:4px}
.hbar b{text-align:right;font-size:12.5px}
.goal{padding:10px 12px;border-top:1px solid var(--line)} .goal:first-child{border-top:0}
.goal .inl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px} .goal .prog{margin:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.link{color:var(--brand);font-weight:700;text-decoration:underline;display:inline}
.tin.sans{font-family:var(--sans);font-size:17px;text-align:left;padding:0 12px;min-height:46px}
.result .big small{font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>window.CONTENT = {"CATEGORIES":[{"id":"essenziali","label":"Parole utili","desc":"Les petits mots et connecteurs qui font les vraies phrases"},{"id":"quotidiano","label":"Vita quotidiana","desc":"Démarches, courses, vie de tous les jours"},{"id":"casa","label":"Casa & abitare","desc":"Appartement, pannes, voisins, ménage"},{"id":"cucina","label":"Cucina & spesa","desc":"Marché, ingrédients, recettes"},{"id":"salute","label":"Salute & corpo","desc":"Médecin, pharmacie, petits bobos"},{"id":"lavoro","label":"Al lavoro","desc":"Devis, usine, réunions, mails"},{"id":"tecnologia","label":"Tecnologia & ufficio","desc":"Fichiers, écrans, visios"},{"id":"ristorante","label":"Al ristorante","desc":"Commander, partager, apprécier comme un local"},{"id":"trasporti","label":"Strada & trasporti","desc":"Voiture, garage, tram, train"},{"id":"viaggi","label":"Viaggi & vacanze","desc":"Aéroport, plage, montagne"},{"id":"sport","label":"Sport & calcio","desc":"Le match, l'équipe, l'entraînement"},{"id":"torino","label":"Torino & tempo libero","desc":"La ville, l'aperitivo, les sorties"},{"id":"emozioni","label":"Emozioni & carattere","desc":"Dire ce qu'on ressent, décrire les gens"},{"id":"tempo","label":"Tempo & date","desc":"Situer dans le temps avec précision"},{"id":"verbi","label":"Verbi che contano","desc":"Les verbes A2-B1 qui changent tout"},{"id":"espressioni","label":"Espressioni","desc":"Idiomes et tournures de vrai Italien"},{"id":"libro","label":"Frasi del libro","desc":"Les 12 unités de Vivi l'italiano"},{"id":"dialoghi","label":"Dialoghi reali","desc":"Phrases prêtes à l'emploi, par situation"}],"WORDS":[{"id":"e1","cat":"essenziali","lv":"A2","it":"comunque","fr":"de toute façon, quoi qu'il en soit","ex":"Comunque, ci vediamo domani.","exFr":"De toute façon, on se voit demain."},{"id":"e2","cat":"essenziali","lv":"B1","it":"addirittura","fr":"carrément, même (renforce)","ex":"Ha addirittura pagato per tutti!","exFr":"Il a carrément payé pour tout le monde !"},{"id":"e3","cat":"essenziali","lv":"A2","it":"appena","fr":"à peine / dès que","ex":"Ti chiamo appena arrivo.","exFr":"Je t'appelle dès que j'arrive."},{"id":"e4","cat":"essenziali","lv":"B1","it":"mica","fr":"pas du tout, quand même pas (renforce la négation)","ex":"Non è mica facile!","exFr":"C'est pas facile du tout !"},{"id":"e5","cat":"essenziali","lv":"A2","it":"ormai","fr":"désormais / maintenant (c'est trop tard)","ex":"Ormai è troppo tardi per il treno.","exFr":"Maintenant c'est trop tard pour le train."},{"id":"e6","cat":"essenziali","lv":"A2","it":"quindi","fr":"donc","ex":"Piove, quindi resto a casa.","exFr":"Il pleut, donc je reste à la maison."},{"id":"e7","cat":"essenziali","lv":"B1","it":"anzi","fr":"au contraire / même, mieux encore","ex":"Non mi disturbi, anzi!","exFr":"Tu ne me déranges pas, au contraire !"},{"id":"e8","cat":"essenziali","lv":"A2","it":"invece","fr":"par contre, en revanche","ex":"Io lavoro, lui invece è in ferie.","exFr":"Moi je travaille, lui par contre est en congés."},{"id":"e9","cat":"essenziali","lv":"A2","it":"infatti","fr":"en effet, effectivement","ex":"— Sembra stanco. — Infatti non ha dormito.","exFr":"— Il a l'air fatigué. — En effet, il n'a pas dormi."},{"id":"e10","cat":"essenziali","lv":"A2","it":"per fortuna","fr":"heureusement","ex":"Per fortuna avevo l'ombrello.","exFr":"Heureusement, j'avais le parapluie."},{"id":"e11","cat":"essenziali","lv":"A2","it":"davvero","fr":"vraiment","ex":"È davvero un bel posto.","exFr":"C'est vraiment un bel endroit."},{"id":"e12","cat":"essenziali","lv":"B1","it":"quasi quasi","fr":"je serais bien tenté de… (hésitation)","ex":"Quasi quasi prendo un altro caffè.","exFr":"Je me prendrais bien un autre café."},{"id":"e13","cat":"essenziali","lv":"B1","it":"la roba","fr":"le truc, les affaires (familier)","ex":"Di chi è questa roba sul tavolo?","exFr":"À qui sont ces affaires sur la table ?"},{"id":"e14","cat":"essenziali","lv":"B1","it":"tra l'altro","fr":"d'ailleurs, entre autres","ex":"Tra l'altro, domani è festa.","exFr":"D'ailleurs, demain c'est férié."},{"id":"e15","cat":"essenziali","lv":"A2","it":"piuttosto","fr":"plutôt, assez","ex":"Oggi fa piuttosto freddo a Torino.","exFr":"Aujourd'hui il fait plutôt froid à Turin."},{"id":"e16","cat":"essenziali","lv":"A2","it":"pure","fr":"aussi ; donc, vas-y (fai pure = fais donc)","ex":"Prendi pure il mio posto, io ho finito.","exFr":"Prends donc ma place, moi j'ai fini."},{"id":"e17","cat":"essenziali","lv":"A2","it":"magari","fr":"peut-être ; si seulement ! (souhait)","ex":"Magari domani riusciamo a chiudere il preventivo.","exFr":"Peut-être que demain on arrive à boucler le devis."},{"id":"e18","cat":"essenziali","lv":"A2","it":"mentre","fr":"pendant que ; tandis que","ex":"Mentre aspetto il tram, ripasso le parole italiane.","exFr":"Pendant que j'attends le tram, je révise les mots italiens."},{"id":"e19","cat":"essenziali","lv":"B1","it":"siccome","fr":"comme, étant donné que (en tête de phrase)","ex":"Siccome pioveva, sono andato al lavoro in macchina.","exFr":"Comme il pleuvait, je suis allé au travail en voiture."},{"id":"e20","cat":"essenziali","lv":"A2","it":"perciò","fr":"c'est pourquoi, donc","ex":"Il fornitore è in ritardo, perciò la consegna slitta.","exFr":"Le fournisseur est en retard, c'est pourquoi la livraison est décalée."},{"id":"e21","cat":"essenziali","lv":"A2","it":"oppure","fr":"ou bien, sinon","ex":"Ci vediamo alle sei, oppure preferisci dopo cena?","exFr":"On se voit à six heures, ou bien tu préfères après le dîner ?"},{"id":"e22","cat":"essenziali","lv":"A2","it":"neanche","fr":"même pas ; non plus","ex":"Non ho neanche avuto il tempo di pranzare.","exFr":"Je n'ai même pas eu le temps de déjeuner."},{"id":"e23","cat":"essenziali","lv":"A2","it":"almeno","fr":"au moins","ex":"Ci vogliono almeno venti minuti per arrivare a Mirafiori.","exFr":"Il faut au moins vingt minutes pour arriver à Mirafiori."},{"id":"e24","cat":"essenziali","lv":"A2","it":"soprattutto","fr":"surtout","ex":"Mi piace Torino, soprattutto in autunno.","exFr":"J'aime Turin, surtout en automne."},{"id":"e25","cat":"essenziali","lv":"A2","it":"proprio","fr":"vraiment, exactement, justement (aussi : propre)","ex":"È proprio quello che volevo dire in riunione.","exFr":"C'est exactement ce que je voulais dire en réunion."},{"id":"e26","cat":"essenziali","lv":"A2","it":"insomma","fr":"bref, en somme ; bof (en réponse)","ex":"Insomma, il progetto è in ritardo di un mese.","exFr":"Bref, le projet a un mois de retard."},{"id":"e27","cat":"essenziali","lv":"A2","it":"cioè","fr":"c'est-à-dire","ex":"Ci vediamo dopo pranzo, cioè verso le due.","exFr":"On se voit après le déjeuner, c'est-à-dire vers quatorze heures."},{"id":"e28","cat":"essenziali","lv":"A2","it":"purtroppo","fr":"malheureusement","ex":"Purtroppo oggi la mensa è chiusa per lavori.","exFr":"Malheureusement, aujourd'hui la cantine est fermée pour travaux."},{"id":"e29","cat":"essenziali","lv":"B1","it":"altrimenti","fr":"sinon, autrement","ex":"Sbrigati, altrimenti perdiamo il tram delle otto.","exFr":"Dépêche-toi, sinon on rate le tram de huit heures."},{"id":"e30","cat":"essenziali","lv":"B1","it":"nonostante","fr":"malgré ; bien que (+ subjonctif)","ex":"Nonostante la pioggia, sono andato a correre al Valentino.","exFr":"Malgré la pluie, je suis allé courir au Valentino."},{"id":"e31","cat":"essenziali","lv":"B1","it":"affinché","fr":"afin que, pour que (+ subjonctif)","ex":"Ho spiegato tutto affinché non ci siano malintesi.","exFr":"J'ai tout expliqué afin qu'il n'y ait pas de malentendus."},{"id":"e32","cat":"essenziali","lv":"B1","it":"finché","fr":"tant que ; jusqu'à ce que (finché non)","ex":"Resto in ufficio finché non arriva la risposta del cliente.","exFr":"Je reste au bureau jusqu'à ce que la réponse du client arrive."},{"id":"e33","cat":"essenziali","lv":"A2","it":"intanto","fr":"en attendant, pendant ce temps","ex":"Tu finisci il preventivo, intanto io chiamo il fornitore.","exFr":"Tu finis le devis, pendant ce temps j'appelle le fournisseur."},{"id":"e34","cat":"essenziali","lv":"A2","it":"a proposito","fr":"à propos, au fait","ex":"A proposito, hai mandato la fattura al cliente?","exFr":"Au fait, tu as envoyé la facture au client ?"},{"id":"e35","cat":"essenziali","lv":"A2","it":"in ogni caso","fr":"en tout cas, de toute façon","ex":"In ogni caso ti chiamo domani mattina presto.","exFr":"En tout cas je t'appelle demain matin tôt."},{"id":"e36","cat":"essenziali","lv":"B1","it":"sempre più","fr":"de plus en plus","ex":"Il traffico a Torino è sempre più intenso.","exFr":"La circulation à Turin est de plus en plus dense."},{"id":"e37","cat":"essenziali","lv":"B1","it":"al massimo","fr":"au maximum ; au pire","ex":"Ci metto al massimo dieci minuti, poi arrivo.","exFr":"J'en ai pour dix minutes au maximum, puis j'arrive."},{"id":"e38","cat":"essenziali","lv":"B1","it":"tanto vale","fr":"autant (faire…), ça revient au même","ex":"Se piove, tanto vale restare a casa.","exFr":"S'il pleut, autant rester à la maison."},{"id":"e39","cat":"essenziali","lv":"B1","it":"appunto","fr":"justement, précisément","ex":"Appunto, è quello che dicevo io ieri.","exFr":"Justement, c'est ce que je disais hier."},{"id":"e40","cat":"essenziali","lv":"B1","it":"eppure","fr":"et pourtant","ex":"Ho controllato tutto, eppure il totale non torna.","exFr":"J'ai tout vérifié, et pourtant le total ne tombe pas juste."},{"id":"q1","cat":"quotidiano","lv":"B1","it":"il trasloco","fr":"le déménagement","ex":"Il trasloco è previsto per sabato.","exFr":"Le déménagement est prévu samedi."},{"id":"q2","cat":"quotidiano","lv":"A2","it":"la bolletta","fr":"la facture (eau, gaz, électricité)","ex":"È arrivata la bolletta della luce.","exFr":"La facture d'électricité est arrivée."},{"id":"q3","cat":"quotidiano","lv":"B1","it":"il condominio","fr":"la copropriété, l'immeuble","ex":"Domani c'è la riunione di condominio.","exFr":"Demain il y a la réunion de copropriété."},{"id":"q4","cat":"quotidiano","lv":"A2","it":"sbrigarsi","fr":"se dépêcher","ex":"Sbrigati, il tram arriva!","exFr":"Dépêche-toi, le tram arrive !"},{"id":"q5","cat":"quotidiano","lv":"B1","it":"le faccende di casa","fr":"les tâches ménagères","ex":"Il sabato faccio le faccende di casa.","exFr":"Le samedi je fais les tâches ménagères."},{"id":"q6","cat":"quotidiano","lv":"A2","it":"buttare la spazzatura","fr":"sortir / jeter les poubelles","ex":"Tocca a te buttare la spazzatura.","exFr":"C'est ton tour de sortir les poubelles."},{"id":"q7","cat":"quotidiano","lv":"A2","it":"la lavatrice","fr":"la machine à laver","ex":"La lavatrice si è rotta di nuovo.","exFr":"La machine à laver est encore en panne."},{"id":"q8","cat":"quotidiano","lv":"A2","it":"fare la fila","fr":"faire la queue","ex":"Ho fatto la fila per un'ora in posta.","exFr":"J'ai fait la queue une heure à la poste."},{"id":"q9","cat":"quotidiano","lv":"A2","it":"il bancomat","fr":"le distributeur / la carte bancaire","ex":"Posso pagare con il bancomat?","exFr":"Je peux payer par carte ?"},{"id":"q10","cat":"quotidiano","lv":"A2","it":"il resto","fr":"la monnaie (rendue)","ex":"Tenga il resto.","exFr":"Gardez la monnaie."},{"id":"q11","cat":"quotidiano","lv":"A2","it":"lo scontrino","fr":"le ticket de caisse","ex":"Vuole lo scontrino?","exFr":"Vous voulez le ticket ?"},{"id":"q12","cat":"quotidiano","lv":"A2","it":"i saldi","fr":"les soldes","ex":"A gennaio iniziano i saldi.","exFr":"En janvier commencent les soldes."},{"id":"q13","cat":"quotidiano","lv":"A2","it":"il quartiere","fr":"le quartier","ex":"Abito in un quartiere tranquillo.","exFr":"J'habite dans un quartier tranquille."},{"id":"q14","cat":"quotidiano","lv":"B1","it":"aggiustare","fr":"réparer","ex":"Devo far aggiustare la bici.","exFr":"Je dois faire réparer le vélo."},{"id":"q15","cat":"quotidiano","lv":"A2","it":"la tabaccheria","fr":"le bureau de tabac (tickets, timbres, recharges, paiements)","ex":"Compro i biglietti del tram in tabaccheria.","exFr":"J'achète les tickets ima di prendere l'autostrada.","exFr":"Je m'arrête à la station-service avant de prendre l'autoroute."},{"id":"t28","cat":"trasporti","lv":"A2","it":"il gasolio","fr":"le gazole, le diesel (la benzina = l'essence)","ex":"La mia macchina va a gasolio, non a benzina.","exFr":"Ma voiture roule au gazole, pas à l'essence."},{"id":"t29","cat":"trasporti","lv":"A2","it":"il semaforo","fr":"le feu (de circulation)","ex":"Al semaforo di corso Orbassano c'è sempre coda.","exFr":"Au feu du corso Orbassano, il y a toujours un bouchon."},{"id":"t30","cat":"trasporti","lv":"A2","it":"la coda","fr":"le bouchon, la file (en voiture) ; la queue (animal)","ex":"In tangenziale c'è coda tutte le mattine alle otto.","exFr":"Sur le périphérique, il y a des bouchons tous les matins à huit heures."},{"id":"t31","cat":"trasporti","lv":"A2","it":"le strisce blu","fr":"les places de stationnement payantes (lignes bleues au sol)","ex":"Sulle strisce blu si paga dalle otto alle diciannove.","exFr":"Sur les places bleues, on paie de huit heures à dix-neuf heures."},{"id":"t32","cat":"trasporti","lv":"A2","it":"la ZTL","fr":"la zone à trafic limité (centre-ville, caméras à l'entrée)","ex":"Attento, in centro c'è la ZTL fino alle dieci e mezza.","exFr":"Attention, dans le centre il y a la ZTL jusqu'à dix heures et demie."},{"id":"t33","cat":"trasporti","lv":"A2","it":"l'autovelox","fr":"le radar (de vitesse)","ex":"C'è un autovelox fisso in corso Regina Margherita.","exFr":"Il y a un radar fixe sur le corso Regina Margherita."},{"id":"t34","cat":"trasporti","lv":"B1","it":"il pedaggio","fr":"le péage (la somme à payer ; il casello = la gare de péage)","ex":"Il pedaggio Torino-Milano costa più di quindici euro.","exFr":"Le péage Turin-Milan coûte plus de quinze euros."},{"id":"t35","cat":"trasporti","lv":"A2","it":"lo sciopero","fr":"la grève (lo sciopero dei mezzi = la grève des transports)","ex":"Venerdì c'è lo sciopero dei mezzi, vado in macchina.","exFr":"Vendredi il y a la grève des transport d":"w25","cat":"viaggi","lv":"A2","it":"la crema solare","fr":"la crème solaire","ex":"Ho dimenticato la crema solare e mi sono scottato.","exFr":"J'ai oublié la crème solaire et j'ai pris un coup de soleil."},{"id":"w26","cat":"viaggi","lv":"B1","it":"abbronzarsi","fr":"bronzer (l'abbronzatura = le bronzage)","ex":"Mi sono abbronzato in una sola giornata di mare.","exFr":"J'ai bronzé en une seule journée à la mer."},{"id":"w27","cat":"viaggi","lv":"B1","it":"la scottatura","fr":"le coup de soleil ; la brûlure (scottarsi = se brûler)","ex":"Che scottatura sulle spalle, non riesco a dormire.","exFr":"Quel coup de soleil sur les épaules, je n'arrive pas à dormir."},{"id":"w28","cat":"viaggi","lv":"A2","it":"il sentiero","fr":"le sentier (de randonnée)","ex":"Il sentiero per il rifugio parte dal parcheggio.","exFr":"Le sentier pour le refuge part du parking."},{"id":"w29","cat":"viaggi","lv":"A2","it":"l'escursione","fr":"la randonnée, l'excursion","ex":"Domenica facciamo un'escursione in Val di Susa.","exFr":"Dimanche on fait une randonnée dans le Val de Suse."},{"id":"w30","cat":"viaggi","lv":"B1","it":"il rifugio","fr":"le refuge (de montagne)","ex":"Al rifugio abbiamo mangiato polenta e salsiccia.","exFr":"Au refuge, nous avons mangé de la polenta et de la saucisse."},{"id":"w31","cat":"viaggi","lv":"A2","it":"lo zaino","fr":"le sac à dos","ex":"Nello zaino metto acqua, panini e una giacca.","exFr":"Dans le sac à dos je mets de l'eau, des sandwichs et une veste."},{"id":"w32","cat":"viaggi","lv":"A2","it":"fare le valigie","fr":"faire ses valises","ex":"Devo ancora fare le valigie, parto domani alle sei.","exFr":"Je dois encore faire mes valises, je pars demain à six heures."},{"id":"w33","cat":"viaggi","lv":"B1","it":"fare il ponte","fr":"faire le pont (long week-end)","ex":"Il primo maggio cade di giovedì, possiamo fare il ponte.","exFr":"Le premier mai tombe un jeudi, on peut faire le pont."},{"id":"w34","cat":"viaggi","lv":"A2","it":"a Ferragosto","fr":"le 15 août (fête ; toute l'Italie est en vacances, tout est fermé)","ex":"A Ferragosto Torino si svuota, sono tutti al mare.","exFr":"Le 15 août, Turin se vide, tout le monde est à la mer."},{"id":"w35","cat":"viaggi","lv":"A2","it":"la cartolina","fr":"la carte postale","ex":"Mando sempre una cartolina a mia nonna dalle vacanze.","exFr":"J'envoie toujours une carte postale à ma grand-mère pendant les vacances."},{"id":"f1","cat":"sport","lv":"A2","it":"la partita","fr":"le match (aussi : la partie)","ex":"Sabato guardiamo la partita della Juve al bar.","exFr":"Samedi on regarde le match de la Juve au bar."},{"id":"f2","cat":"sport","lv":"A2","it":"la squadra","fr":"l'équipe","ex":"La mia squadra di calcetto gioca il martedì sera.","exFr":"Mon équipe de foot à cinq joue le mardi soir."},{"id":"f3","cat":"sport","lv":"A2","it":"il calcetto","fr":"le foot à cinq (en salle ou sur petit terrain)","ex":"Il giovedì gioco a calcetto con i colleghi di EASE.","exFr":"Le jeudi je joue au foot à cinq avec les collègues d'EASE."},{"id":"f4","cat":"sport","lv":"A2","it":"allenarsi","fr":"s'entraîner (l'allenamento = l'entraînement)","ex":"Ieri mi sono allenato sotto la pioggia, che freddo.","exFr":"Hier je me suis entraîné sous la pluie, quel froid."},{"id":"f5","cat":"sport","lv":"A2","it":"l'allenatore","fr":"l'entraîneur (familier : il mister)","ex":"L'allenatore ha cambiato tre giocatori nel secondo tempo.","exFr":"L'entraîneur a changé trois joueurs en seconde mi-temps."},{"id":"f6","cat":"sport","lv":"A2","it":"la maglia","fr":"le maillot ; le pull","ex":"Ho comprato la maglia granata per il derby.","exFr":"J'ai acheté le maillot grenat pour le derby."},{"id":"f7","cat":"sport","lv":"A2","it":"il portiere","fr":"le gardien de but (aussi : le concierge, le portier)","ex":"Il portiere ha parato il rigore all'ultimo minuto.","exFr":"Le gardien a arrêté le penalty à la dernière minute."},{"id":"f8","cat":"sport","lv":"B1","it":"il terzino","fr":"l'arrière latéral (terzino destro / sinistro)","ex":"Il terzino sinistro è stato il migliore in campo.","exFr":"L'arrière gauche a été le meilleur sur le terrain."},{"id":"f9","cat":"sport","lv":"A2","it":"il centrocampista","fr":"le milieu de terrain","ex":"Il nuovo centrocampista arriva dal Barcellona.","exFr":"Le nouveau milieu de terrain arrive du Barça."},{"id":"f10","cat":"sport","lv":"B1","it":"la punta","fr":"l'avant-centre (aussi : la pointe)","ex":"Giochiamo con una punta sola e due ali.","exFr":"On joue avec un seul avant-centre et deux ailiers."},{"id":"f11","cat":"sport","lv":"A2","it":"l'ala","fr":"l'ailier (aussi : l'aile)","ex":"L'ala destra corre tantissimo ma non segna mai.","exFr":"L'ailier droit court énormément mais ne marque jamais."},{"id":"f12","cat":"sport","lv":"A2","it":"la panchina","fr":"le banc (des remplaçants ; aussi : le banc public)","ex":"Il capitano è rimasto in panchina tutta la partita.","exFr":"Le capitaine est resté sur le banc tout le match."},{"id":"f13","cat":"sport","lv":"B1","it":"il fuorigioco","fr":"le hors-jeu","ex":"Gol annullato per fuorigioco, che rabbia!","exFr":"But refusé pour hors-jeu, quelle rage !"},{"id":"f14","cat":"sport","lv":"B1","it":"il calcio d'angolo","fr":"le corner","ex":"Abbiamo segnato su calcio d'angolo al novantesimo.","exFr":"Nous avons marqué sur corner à la quatre-vingt-dixième."},{"id":"f15","cat":"sport","lv":"A2","it":"la punizione","fr":"le coup franc (aussi : la punition)","ex":"Ha segnato una punizione da venticinque metri.","exFr":"Il a marqué un coup franc de vingt-cinq mètres."},{"id":"f16","cat":"sport","lv":"A2","it":"il rigore","fr":"le penalty (aussi : la rigueur)","ex":"L'arbitro ha dato un rigore dubbio alla Juve.","exFr":"L'arbitre a accordé un penalty douteux à la Juve."},{"id":"f17","cat":"sport","lv":"B1","it":"il fallo","fr":"la faute (de jeu)","ex":"Era fallo da rigore, l'arbitro non ha fischiato.","exFr":"C'était une faute dans la surface, l'arbitre n'a pas sifflé."},{"id":"f18","cat":"sport","lv":"A2","it":"il cartellino giallo","fr":"le carton jaune (il cartellino rosso = le carton rouge)","ex":"Secondo cartellino giallo: il difensore è espulso.","exFr":"Deuxième carton jaune : le défenseur est expulsé."},{"id":"f19","cat":"sport","lv":"B1","it":"il recupero","fr":"le temps additionnel ; la récupération","ex":"Hanno pareggiato al quinto minuto di recupero.","exFr":"Ils ont égalisé à la cinquième minute du temps additionnel."},{"id":"f20","cat":"sport","lv":"A2","it":"segnare","fr":"marquer (un but) ; noter","ex":"Ha segnato due gol nel primo tempo.","exFr":"Il a marqué deux buts en première mi-temps."},{"id":"f21","cat":"sport","lv":"A2","it":"il gol","fr":"le but (invariable : due gol ; s'écrit sans « a »)","ex":"Che gol! Tutto il bar è saltato in piedi.","exFr":"Quel but ! Tout le bar a bondi."},{"id":"f22","cat":"sport","lv":"B1","it":"parare","fr":"arrêter (un tir) ; la parata = l'arrêt","ex":"Il portiere ha parato tre tiri impossibili.","exFr":"Le gardien a arrêté trois tirs impossibles."},{"id":"f23","cat":"sport","lv":"A2","it":"il passaggio","fr":"la passe ; le passage (dare un passaggio = déposer quelqu'un en voiture)","ex":"Un passaggio perfetto e la punta segna di testa.","exFr":"Une passe parfaite et l'avant-centre marque de la tête."},{"id":"f24","cat":"sport","lv":"A2","it":"il palo","fr":"le poteau","ex":"Il tiro ha preso il palo ed è uscito.","exFr":"Le tir a touché le poteau et est sorti."},{"id":"f25","cat":"sport","lv":"B1","it":"il pareggio","fr":"le match nul, l'égalisation","ex":"Un pareggio in trasferta è un buon risultato.","exFr":"Un match nul à l'extérieur est un bon résultat."},{"id":"f26","cat":"sport","lv":"A2","it":"la sconfitta","fr":"la défaite","ex":"Dopo la sconfitta nel derby i tifosi erano furiosi.","exFr":"Après la défaite dans le derby, les supporters étaient furieux."},{"id":"f27","cat":"sport","lv":"B1","it":"la rimonta","fr":"la remontée, le retournement de situation","ex":"Perdevamo due a zero e abbiamo vinto: che rimonta!","exFr":"On perdait deux à zéro et on a gagné : quelle remontée !"},{"id":"f28","cat":"sport","lv":"B1","it":"la classifica","fr":"le classement","ex":"Il Toro è decimo in classifica dopo dieci giornate.","exFr":"Le Toro est dixième au classement après dix journées."},{"id":"f29","cat":"sport","lv":"B1","it":"lo scudetto","fr":"le titre de champion d'Italie (l'écusson tricolore)","ex":"Chi vince lo scudetto quest'anno, Inter o Napoli?","exFr":"Qui gagne le titre cette année, l'Inter ou Naples ?"},{"id":"f30","cat":"sport","lv":"A2","it":"tifare per","fr":"supporter, être fan de (il tifoso = le supporter)","ex":"Tifo per il Barcellona da quando ero bambino.","exFr":"Je supporte le Barça depuis que je suis petit."},{"id":"f31","cat":"sport","lv":"B1","it":"lo spogliatoio","fr":"le vestiaire","ex":"Negli spogliatoi l'allenatore ha urlato per dieci minuti.","exFr":"Dans les vestiaires, l'entraîneur a crié pendant dix minutes."},{"id":"f32","cat":"sport","lv":"A2","it":"la palestra","fr":"la salle de sport","ex":"Vado in palestra vicino all'ufficio durante la pausa pranzo.","exFr":"Je vais à la salle de sport près du bureau pendant la pause déjeuner."},{"id":"f33","cat":"sport","lv":"A2","it":"sudare","fr":"transpirer, suer","ex":"Ho sudato tantissimo, il campo era sotto il sole.","exFr":"J'ai énormément transpiré, le terrain était en plein soleil."},{"id":"f34","cat":"sport","lv":"B1","it":"i crampi","fr":"les crampes","ex":"Dopo novanta minuti mi vengono sempre i crampi.","exFr":"Après quatre-vingt-dix minutes, j'ai toujours des crampes."},{"id":"f35","cat":"sport","lv":"B1","it":"l'infortunio","fr":"la blessure (sportive) ; pas l'infortune","ex":"L'attaccante è fuori due mesi per infortunio.","exFr":"L'attaquant est absent deux mois pour blessure."},{"id":"o1","cat":"torino","lv":"A2","it":"la Mole","fr":"la Mole Antonelliana (symbole de Turin, Musée du cinéma)","ex":"Dalla collina si vede benissimo la Mole.","exFr":"Depuis la colline on voit très bien la Mole."},{"id":"o2","cat":"torino","lv":"A2","it":"i portici","fr":"les arcades (18 km à Turin, pratiques quand il pleut)","ex":"Quando piove cammino sotto i portici di via Roma.","exFr":"Quand il pleut je marche sous les arcades de via Roma."},{"id":"o3","cat":"torino","lv":"A2","it":"il parco del Valentino","fr":"le parc du Valentino (grand parc le long du Pô)","ex":"Vado a correre al parco del Valentino dopo il lavoro.","exFr":"Je vais courir au parc du Valentino après le travail."},{"id":"o4","cat":"torino","lv":"A2","it":"il Lingotto","fr":"le Lingotto (ancienne usine Fiat avec piste sur le toit, aujourd'hui centre commercial)","ex":"Al Lingotto c'è la pista sul tetto dove provavano le Fiat.","exFr":"Au Lingotto, il y a la piste sur le toit où ils testaient les Fiat."},{"id":"o5","cat":"torino","lv":"B1","it":"la basilica di Superga","fr":"la basilique de Superga (sur la colline ; tragédie du Grande Torino en 1949)","ex":"Dalla basilica di Superga si vede tutta la città.","exFr":"Depuis la basilique de Superga, on voit toute la ville."},{"id":"o6","cat":"torino","lv":"B1","it":"la tangenziale","fr":"le périphérique, la rocade","ex":"La tangenziale di Torino è bloccata per un incidente.","exFr":"Le périphérique de Turin est bloqué à cause d'un accident."},{"id":"o7","cat":"torino","lv":"A2","it":"a San Salvario","fr":"à San Salvario (quartier des bars derrière Porta Nuova)","ex":"A San Salvario il venerdì sera è pieno di gente.","exFr":"À San Salvario, le vendredi soir, c'est plein de monde."},{"id":"o8","cat":"torino","lv":"B1","it":"in Vanchiglia","fr":"à Vanchiglia (quartier étudiant et de sorties, près du Pô)","ex":"In Vanchiglia ci sono tanti locali nuovi vicino al Po.","exFr":"À Vanchiglia, il y a beaucoup de nouveaux bars près du Pô."},{"id":"o9","cat":"torino","lv":"B1","it":"il Quadrilatero","fr":"le Quadrilatero Romano (vieux centre, ruelles, bars et restaurants)","ex":"Nel Quadrilatero si mangia bene ma si paga.","exFr":"Dans le Quadrilatero, on mange bien mais ça se paie."},{"id":"o10","cat":"torino","lv":"B1","it":"la movida","fr":"la vie nocturne, les sorties du soir","ex":"I residenti si lamentano della movida fino alle tre.","exFr":"Les habitants se plaignent de la vie nocturne jusqu'à trois heures du matin."},{"id":"o11","cat":"torino","lv":"A2","it":"l'apericena","fr":"l'apéro dînatoire (buffet compris dans le prix du verre)","ex":"Stasera apericena a San Salvario, dieci euro a testa.","exFr":"Ce soir apéro dînatoire à San Salvario, dix euros par personne."},{"id":"o12","cat":"torino","lv":"B1","it":"lo stuzzichino","fr":"l'amuse-bouche, le petit truc à grignoter","ex":"Con lo spritz arrivano sempre degli stuzzichini.","exFr":"Avec le spritz arrivent toujours des amuse-bouches."},{"id":"o13","cat":"torino","lv":"B1","it":"il dehors","fr":"la terrasse (de bar, de resto) ; mot français utilisé en italien","ex":"Ci sediamo nel dehors, fa ancora caldo.","exFr":"On s'assoit en terrasse, il fait encore chaud."},{"id":"o14","cat":"torino","lv":"A2","it":"il bar sotto casa","fr":"le bar en bas de chez soi","ex":"Al bar sotto casa mi conoscono: caffè e cornetto senza chiedere.","exFr":"Au bar en bas de chez moi, ils me connaissent : café et croissant sans demander."},{"id":"o15","cat":"torino","lv":"A2","it":"il vicino di casa","fr":"le voisin","ex":"Il mio vicino di casa è tifoso del Toro.","exFr":"Mon voisin est supporter du Toro."},{"id":"o16","cat":"torino","lv":"A2","it":"la mostra","fr":"l'exposition (pas la montre = l'orologio)","ex":"Alle OGR c'è una mostra di fotografia fino a marzo.","exFr":"Aux OGR, il y a une exposition de photographie jusqu'en mars."},{"id":"o17","cat":"torino","lv":"A2","it":"all'aperto","fr":"en plein air","ex":"D'estate ci sono i cinema all'aperto al Valentino.","exFr":"L'été, il y a des cinémas en plein air au Valentino."},{"id":"o18","cat":"torino","lv":"A2","it":"la passeggiata","fr":"la promenade (fare una passeggiata)","ex":"La domenica facciamo una passeggiata lungo il Po.","exFr":"Le dimanche on fait une promenade le long du Pô."},{"id":"o19","cat":"torino","lv":"A2","it":"fare un giro","fr":"faire un tour","ex":"Ti va di fare un giro in centro prima di cena?","exFr":"Ça te dit de faire un tour dans le centre avant le dîner ?"},{"id":"o20","cat":"torino","lv":"B1","it":"la gita fuori porta","fr":"l'excursion d'une journée hors de la ville","ex":"Domenica gita fuori porta: andiamo ad Alba per il tartufo.","exFr":"Dimanche, excursion hors de la ville : on va à Alba pour la truffe."},{"id":"o21","cat":"torino","lv":"A2","it":"le Langhe","fr":"les Langhe (collines du vin et des noisettes, au sud de Turin)","ex":"Nelle Langhe si beve il Barolo e si mangia il tartufo.","exFr":"Dans les Langhe, on boit du Barolo et on mange de la truffe."},{"id":"o22","cat":"torino","lv":"A2","it":"il mercato di Porta Palazzo","fr":"le marché de Porta Palazzo (plus grand marché en plein air d'Europe)","ex":"Al mercato di Porta Palazzo la verdura costa la metà.","exFr":"Au marché de Porta Palazzo, les légumes coûtent la moitié."},{"id":"o23","cat":"torino","lv":"B1","it":"il Balon","fr":"le Balon (marché aux puces du samedi, derrière Porta Palazzo)","ex":"Al Balon ho trovato una lampada anni Sessanta.","exFr":"Au Balon, j'ai trouvé une lampe des années soixante."},{"id":"o24","cat":"torino","lv":"A2","it":"il bicerin","fr":"le bicerin (café, chocolat et crème ; boisson turinoise)","ex":"Il bicerin si beve caldo in piazza della Consolata.","exFr":"Le bicerin se boit chaud sur la place de la Consolata."},{"id":"o25","cat":"torino","lv":"A2","it":"il gianduiotto","fr":"le gianduiotto (chocolat turinois aux noisettes)","ex":"Porto una scatola di gianduiotti ai miei genitori a Lille.","exFr":"J'apporte une boîte de gianduiotti à mes parents à Lille."},{"id":"o26","cat":"torino","lv":"B1","it":"la piola","fr":"le bistrot piémontais traditionnel (cuisine simple, vin au verre)","ex":"In piola si mangia con venti euro, vino compreso.","exFr":"Dans un bistrot piémontais, on mange pour vingt euros, vin compris."},{"id":"o27","cat":"torino","lv":"B1","it":"la merenda sinoira","fr":"le goûter-dîner piémontais (apéro copieux qui remplace le dîner)","ex":"Alle sei facciamo merenda sinoira con salumi e formaggi.","exFr":"À six heures on fait un goûter-dîner avec charcuterie et fromages."},{"id":"o28","cat":"torino","lv":"A2","it":"gli agnolotti","fr":"les agnolotti (raviolis piémontais, souvent « del plin »)","ex":"Gli agnolotti del plin si mangiano con burro e salvia.","exFr":"Les agnolotti del plin se mangent au beurre et à la sauge."},{"id":"o29","cat":"torino","lv":"A2","it":"il vitello tonnato","fr":"le veau sauce au thon (entrée piémontaise classique)","ex":"Come antipasto prendo sempre il vitello tonnato.","exFr":"En entrée je prends toujours le veau sauce au thon."},{"id":"o30","cat":"torino","lv":"B1","it":"la bagna cauda","fr":"la bagna cauda (sauce chaude à l'ail et aux anchois, plat d'hiver)","ex":"Dopo la bagna cauda l'aglio si sente per due giorni.","exFr":"Après la bagna cauda, l'ail se sent pendant deux jours."},{"id":"o31","cat":"torino","lv":"A2","it":"il tartufo","fr":"la truffe (celle d'Alba) ; la glace tartufo","ex":"A novembre c'è la fiera del tartufo ad Alba.","exFr":"En novembre, il y a la foire de la truffe à Alba."},{"id":"o32","cat":"torino","lv":"A2","it":"la nebbia","fr":"le brouillard","ex":"Stamattina c'era una nebbia tale che non si vedeva niente.","exFr":"Ce matin, il y avait un brouillard tel qu'on ne voyait rien."},{"id":"o33","cat":"torino","lv":"B1","it":"l'afa","fr":"la chaleur lourde et humide (de l'été)","ex":"A luglio a Torino l'afa è insopportabile.","exFr":"En juillet à Turin, la chaleur lourde est insupportable."},{"id":"o34","cat":"torino","lv":"A2","it":"nevicare","fr":"neiger (la neve = la neige)","ex":"In città nevica raramente, in montagna invece tanto.","exFr":"En ville, il neige rarement, en montagne par contre beaucoup."},{"id":"o35","cat":"torino","lv":"A2","it":"sciare","fr":"skier (lo sci, la sciata)","ex":"Da Torino si va a sciare a Bardonecchia in un'ora.","exFr":"De Turin, on va skier à Bardonecchia en une heure."},{"id":"m1","cat":"emozioni","lv":"A2","it":"deluso","fr":"déçu","ex":"Sono deluso dal risultato della partita di ieri.","exFr":"Je suis déçu du résultat du match d'hier."},{"id":"m2","cat":"emozioni","lv":"B1","it":"sollevato","fr":"soulagé (il sollievo = le soulagement)","ex":"Mi sento sollevato, il preventivo è stato accettato.","exFr":"Je me sens soulagé, le devis a été accepté."},{"id":"m3","cat":"emozioni","lv":"B1","it":"commosso","fr":"ému (commuoversi = s'émouvoir)","ex":"Mi sono commosso al matrimonio di mio fratello.","exFr":"J'ai été ému au mariage de mon frère."},{"id":"m4","cat":"emozioni","lv":"B1","it":"emozionato","fr":"ému, excité, qui a le trac (pas « émotionné »)","ex":"Ero emozionato il primo giorno di lavoro a Torino.","exFr":"J'avais le trac le premier jour de travail à Turin."},{"id":"m5","cat":"emozioni","lv":"A2","it":"nervoso","fr":"énervé, tendu, irritable (pas seulement nerveux)","ex":"Oggi il capo è nervoso, meglio non disturbarlo.","exFr":"Aujourd'hui le chef est à cran, mieux vaut ne pas le déranger."},{"id":"m6","cat":"emozioni","lv":"B1","it":"teso","fr":"tendu, stressé","ex":"Ero teso prima della riunione con Stellantis.","exFr":"J'étais tendu avant la réunion avec Stellantis."},{"id":"m7","cat":"emozioni","lv":"A2","it":"orgoglioso","fr":"fier (l'orgoglio = la fierté, l'orgueil)","ex":"Sono orgoglioso del mio italiano dopo un anno.","exFr":"Je suis fier de mon italien après un an."},{"id":"m8","cat":"emozioni","lv":"A2","it":"educato","fr":"poli, bien élevé (pas instruit = istruito)","ex":"Il nuovo stagista è educato e sempre puntuale.","exFr":"Le nouveau stagiaire est poli et toujours ponctuel."},{"id":"m9","cat":"emozioni","lv":"A2","it":"scortese","fr":"impoli, désagréable","ex":"Il cameriere è stato scortese con tutti.","exFr":"Le serveur a été impoli avec tout le monde."},{"id":"m10","cat":"emozioni","lv":"A2","it":"disponibile","fr":"disponible ; serviable, arrangeant","ex":"La collega dell'ufficio acquisti è sempre disponibile.","exFr":"La collègue du service achats est toujours serviable."},{"id":"m11","cat":"emozioni","lv":"A2","it":"pigro","fr":"paresseux","ex":"La domenica sono pigro, resto a letto fino a tardi.","exFr":"Le dimanche je suis paresseux, je reste au lit jusque tard."},{"id":"m12","cat":"emozioni","lv":"A2","it":"goloso","fr":"gourmand","ex":"Sono troppo goloso, ho finito i gianduiotti.","exFr":"Je suis trop gourmand, j'ai fini les gianduiotti."},{"id":"m13","cat":"emozioni","lv":"B1","it":"testardo","fr":"têtu","ex":"Mio nonno è testardo, non cambia mai idea.","exFr":"Mon grand-père est têtu, il ne change jamais d'avis."},{"id":"m14","cat":"emozioni","lv":"B1","it":"sveglio","fr":"vif, malin ; réveillé","ex":"Il bambino dei vicini è molto sveglio per la sua età.","exFr":"L'enfant des voisins est très vif pour son âge."},{"id":"m15","cat":"emozioni","lv":"A2","it":"furbo","fr":"malin, rusé (fare il furbo = jouer au plus malin)","ex":"Ha parcheggiato sulle strisce blu senza pagare, che furbo!","exFr":"Il s'est garé sur les places payantes sans payer, quel malin !"},{"id":"m16","cat":"emozioni","lv":"B1","it":"chiacchierone","fr":"bavard","ex":"Il mio collega è un chiacchierone, non finisce mai.","exFr":"Mon collègue est un bavard, il n'en finit jamais."},{"id":"m17","cat":"emozioni","lv":"B1","it":"permaloso","fr":"susceptible","ex":"Non scherzare con lui, è molto permaloso.","exFr":"Ne plaisante pas avec lui, il est très susceptible."},{"id":"m18","cat":"emozioni","lv":"B1","it":"schietto","fr":"franc, direct (qui dit ce qu'il pense)","ex":"Il mio capo è schietto: se sbagli, te lo dice.","exFr":"Mon chef est franc : si tu te trompes, il te le dit."},{"id":"m19","cat":"emozioni","lv":"A2","it":"bugiardo","fr":"menteur (la bugia = le mensonge)","ex":"Non credergli, è un bugiardo nato.","exFr":"Ne le crois pas, c'est un menteur né."},{"id":"m20","cat":"emozioni","lv":"B1","it":"fifone","fr":"froussard, trouillard (la fifa = la trouille)","ex":"Sei un fifone, è solo un ragno!","exFr":"T'es un trouillard, c'est juste une araignée !"},{"id":"m21","cat":"emozioni","lv":"A2","it":"vergognarsi","fr":"avoir honte (la vergogna = la honte)","ex":"Mi sono vergognato del mio accento all'inizio.","exFr":"J'ai eu honte de mon accent au début."},{"id":"m22","cat":"emozioni","lv":"A2","it":"arrabbiarsi","fr":"se fâcher, se mettre en colère (arrabbiato = en colère)","ex":"Il capo si è arrabbiato per il ritardo della consegna.","exFr":"Le chef s'est fâché à cause du retard de la livraison."},{"id":"m23","cat":"emozioni","lv":"A2","it":"preoccuparsi","fr":"s'inquiéter (non ti preoccupare = ne t'inquiète pas)","ex":"Non ti preoccupare, il preventivo lo finisco io.","exFr":"Ne t'inquiète pas, le devis, je le finis moi."},{"id":"m24","cat":"emozioni","lv":"A2","it":"annoiarsi","fr":"s'ennuyer (pas ennuyer quelqu'un ; la noia = l'ennui)","ex":"Mi sono annoiato a morte in quella riunione.","exFr":"Je me suis ennuyé à mort dans cette réunion."},{"id":"m25","cat":"emozioni","lv":"A2","it":"essere stufo","fr":"en avoir marre, en avoir assez","ex":"Adesso sono stufo di aspettare il tram al freddo.","exFr":"Maintenant j'en ai marre d'attendre le tram dans le froid."},{"id":"m26","cat":"emozioni","lv":"A2","it":"lamentarsi","fr":"se plaindre","ex":"Si lamenta sempre del traffico ma non prende mai il tram.","exFr":"Il se plaint toujours de la circulation mais ne prend jamais le tram."},{"id":"m27","cat":"emozioni","lv":"B1","it":"fidarsi di","fr":"faire confiance à, se fier à","ex":"Fidati di me, questo meccanico è onesto.","exFr":"Fais-moi confiance, ce garagiste est honnête."},{"id":"m28","cat":"emozioni","lv":"A2","it":"innamorarsi","fr":"tomber amoureux (innamorarsi di)","ex":"Mi sono innamorato di Torino in autunno.","exFr":"Je suis tombé amoureux de Turin en automne."},{"id":"m29","cat":"emozioni","lv":"B1","it":"pentirsi","fr":"regretter (mi pento di = je regrette de)","ex":"Mi sono pentito di non aver preso il treno.","exFr":"J'ai regretté de ne pas avoir pris le train."},{"id":"m30","cat":"emozioni","lv":"B1","it":"sopportare","fr":"supporter (quelqu'un, la douleur) ; pas encourager une équipe = tifare","ex":"Non sopporto i colleghi che urlano al telefono.","exFr":"Je ne supporte pas les collègues qui crient au téléphone."},{"id":"m31","cat":"emozioni","lv":"B1","it":"fregarsene","fr":"s'en ficher, s'en foutre (familier ; me ne frego)","ex":"A volte bisogna fregarsene dei commenti e andare avanti.","exFr":"Parfois il faut se ficher des commentaires et avancer."},{"id":"m32","cat":"emozioni","lv":"A2","it":"la pazienza","fr":"la patience ; Pazienza! = tant pis, c'est pas grave","ex":"Il treno è in ritardo? Pazienza, prendo il prossimo.","exFr":"Le train est en retard ? Tant pis, je prends le suivant."},{"id":"m33","cat":"emozioni","lv":"A2","it":"l'ansia","fr":"l'anxiété, l'angoisse (mi mette ansia = ça me stresse)","ex":"Le scadenze di fine mese mi mettono ansia.","exFr":"Les échéances de fin de mois me stressent."},{"id":"m34","cat":"emozioni","lv":"A2","it":"la rabbia","fr":"la colère (aussi : la rage)","ex":"Che rabbia, hanno annullato il gol al novantesimo!","exFr":"Quelle rage, ils ont annulé le but à la quatre-vingt-dixième !"},{"id":"m35","cat":"emozioni","lv":"A2","it":"la paura","fr":"la peur (avere paura di)","ex":"Ho paura di guidare nella nebbia.","exFr":"J'ai peur de conduire dans le brouillard."},{"id":"d1","cat":"tempo","lv":"B1","it":"entro","fr":"d'ici, avant le (délai)","ex":"Rispondimi entro venerdì.","exFr":"Réponds-moi d'ici vendredi."},{"id":"d2","cat":"tempo","lv":"A2","it":"fra poco","fr":"dans peu de temps, bientôt","ex":"Il treno parte fra poco.","exFr":"Le train part bientôt."},{"id":"d3","cat":"tempo","lv":"B1","it":"nel frattempo","fr":"pendant ce temps, entre-temps","ex":"Nel frattempo, preparo il caffè.","exFr":"Pendant ce temps, je prépare le café."},{"id":"d4","cat":"tempo","lv":"B1","it":"prima o poi","fr":"tôt ou tard","ex":"Prima o poi imparerò l'italiano perfettamente.","exFr":"Tôt ou tard je maîtriserai l'italien."},{"id":"d5","cat":"tempo","lv":"B1","it":"d'ora in poi","fr":"dorénavant, à partir de maintenant","ex":"D'ora in poi parlo solo italiano!","exFr":"Dorénavant je ne parle qu'italien !"},{"id":"d6","cat":"tempo","lv":"A2","it":"di solito","fr":"d'habitude","ex":"Di solito pranzo all'una.","exFr":"D'habitude je déjeune à treize heures."},{"id":"d7","cat":"tempo","lv":"B1","it":"di recente","fr":"récemment","ex":"Ho cambiato casa di recente.","exFr":"J'ai déménagé récemment."},{"id":"d8","cat":"tempo","lv":"A2","it":"un attimo","fr":"un instant","ex":"Aspetta un attimo, arrivo!","exFr":"Attends un instant, j'arrive !"},{"id":"d9","cat":"tempo","lv":"A2","it":"in orario","fr":"à l'heure (ponctuel)","ex":"Per una volta il treno è in orario.","exFr":"Pour une fois le train est à l'heure."},{"id":"d10","cat":"tempo","lv":"B1","it":"alla svelta","fr":"vite, rapidement","ex":"Facciamo alla svelta, è tardi.","exFr":"Faisons vite, il est tard."},{"id":"d11","cat":"tempo","lv":"B1","it":"appena possibile","fr":"dès que possible","ex":"Ti richiamo appena possibile.","exFr":"Je te rappelle dès que possible."},{"id":"d12","cat":"tempo","lv":"A2","it":"alla fine","fr":"finalement, à la fin","ex":"Alla fine abbiamo scelto la pizzeria.","exFr":"Finalement on a choisi la pizzeria."},{"id":"d13","cat":"tempo","lv":"A2","it":"ogni tanto","fr":"de temps en temps","ex":"Ogni tanto torno a Lille per vedere la famiglia.","exFr":"De temps en temps je retourne à Lille voir la famille."},{"id":"d14","cat":"tempo","lv":"A2","it":"a volte","fr":"parfois, quelquefois","ex":"A volte lavoro da casa il venerdì.","exFr":"Parfois je travaille de la maison le vendredi."},{"id":"d15","cat":"tempo","lv":"B1","it":"man mano","fr":"au fur et à mesure (man mano che)","ex":"Imparo le parole man mano che le sento.","exFr":"J'apprends les mots au fur et à mesure que je les entends."},{"id":"d16","cat":"tempo","lv":"A2","it":"in anticipo","fr":"en avance","ex":"Sono arrivato in anticipo e ho preso un caffè.","exFr":"Je suis arrivé en avance et j'ai pris un café."},{"id":"d17","cat":"tempo","lv":"A2","it":"in ritardo","fr":"en retard","ex":"Il tram quattro è in ritardo di dieci minuti.","exFr":"Le tram quatre a dix minutes de retard."},{"id":"d18","cat":"tempo","lv":"B1","it":"al più presto","fr":"au plus vite, le plus tôt possible","ex":"Rispondi al cliente al più presto, è urgente.","exFr":"Réponds au client au plus vite, c'est urgent."},{"id":"d19","cat":"tempo","lv":"A2","it":"all'improvviso","fr":"tout d'un coup, soudain","ex":"All'improvviso ha cominciato a grandinare.","exFr":"Tout d'un coup, il a commencé à grêler."},{"id":"d20","cat":"tempo","lv":"B1","it":"nel giro di","fr":"en l'espace de","ex":"Nel giro di un anno ho imparato l'italiano.","exFr":"En l'espace d'un an, j'ai appris l'italien."},{"id":"d21","cat":"tempo","lv":"B1","it":"a lungo","fr":"longtemps, longuement","ex":"Abbiamo parlato a lungo del nuovo progetto.","exFr":"Nous avons longuement parlé du nouveau projet."},{"id":"d22","cat":"tempo","lv":"B1","it":"da un pezzo","fr":"depuis un bon moment (familier)","ex":"Non vedo Marco da un pezzo, come sta?","exFr":"Je n'ai pas vu Marco depuis un bon moment, comment va-t-il ?"},{"id":"d23","cat":"tempo","lv":"A2","it":"l'altro ieri","fr":"avant-hier","ex":"L'altro ieri ho mandato il preventivo al cliente.","exFr":"Avant-hier j'ai envoyé le devis au client."},{"id":"d24","cat":"tempo","lv":"A2","it":"dopodomani","fr":"après-demain","ex":"Dopodomani ho la revisione della macchina.","exFr":"Après-demain j'ai le contrôle technique de la voiture."},{"id":"d25","cat":"tempo","lv":"A2","it":"il fine settimana","fr":"le week-end","ex":"Questo fine settimana andiamo in montagna.","exFr":"Ce week-end on va à la montagne."},{"id":"v1","cat":"verbi","lv":"B1","it":"accorgersi","fr":"se rendre compte, s'apercevoir","ex":"Mi sono accorto dell'errore troppo tardi.","exFr":"Je me suis aperçu de l'erreur trop tard."},{"id":"v2","cat":"verbi","lv":"B1","it":"abituarsi","fr":"s'habituer","ex":"Mi sto abituando alla vita a Torino.","exFr":"Je m'habitue à la vie à Turin."},{"id":"v3","cat":"verbi","lv":"B1","it":"trasferirsi","fr":"déménager, s'installer (ailleurs)","ex":"Mi sono trasferito in Italia l'anno scorso.","exFr":"Je me suis installé en Italie l'année dernière."},{"id":"v4","cat":"verbi","lv":"A2","it":"smettere di","fr":"arrêter de","ex":"Ha smesso di piovere, usciamo!","exFr":"Il a arrêté de pleuvoir, sortons !"},{"id":"v5","cat":"verbi","lv":"A2","it":"scegliere","fr":"choisir — scelgo, scegli, sceglie…","ex":"Non riesco a scegliere tra i due.","exFr":"Je n'arrive pas à choisir entre les deux."},{"id":"v6","cat":"verbi","lv":"A2","it":"sbagliare","fr":"se tromper","ex":"Ho sbagliato strada, scusami.","exFr":"Je me suis trompé de route, excuse-moi."},{"id":"v7","cat":"verbi","lv":"B1","it":"aggiungere","fr":"ajouter","ex":"Aggiungi un po' di sale.","exFr":"Ajoute un peu de sel."},{"id":"v8","cat":"verbi","lv":"B1","it":"togliere","fr":"enlever, retirer","ex":"Togli le scarpe, per favore.","exFr":"Enlève tes chaussures, s'il te plaît."},{"id":"v9","cat":"verbi","lv":"A2","it":"succedere","fr":"arriver, se passer","ex":"Cosa è successo ieri sera?","exFr":"Que s'est-il passé hier soir ?"},{"id":"v10","cat":"verbi","lv":"B1","it":"mancare","fr":"manquer (mi manchi = tu me manques)","ex":"Mi manca la cucina francese.","exFr":"La cuisine française me manque."},{"id":"v11","cat":"verbi","lv":"B1","it":"farcela","fr":"y arriver, réussir","ex":"Non ce la faccio più, sono stanco!","exFr":"Je n'en peux plus, je suis fatigué !"},{"id":"v12","cat":"verbi","lv":"B1","it":"cavarsela","fr":"s'en sortir, se débrouiller","ex":"Me la cavo bene con l'italiano ormai.","exFr":"Je me débrouille bien en italien maintenant."},{"id":"v13","cat":"verbi","lv":"A2","it":"provare a","fr":"essayer de","ex":"Provo a chiamarlo più tardi.","exFr":"J'essaie de l'appeler plus tard."},{"id":"v14","cat":"verbi","lv":"B1","it":"metterci","fr":"mettre (du temps) — ci metto un'ora","ex":"Quanto ci metti da casa al lavoro?","exFr":"Tu mets combien de temps de chez toi au travail ?"},{"id":"v15","cat":"verbi","lv":"B1","it":"volerci","fr":"falloir (du temps) — ci vuole un'ora","ex":"Ci vogliono venti minuti a piedi.","exFr":"Il faut vingt minutes à pied."},{"id":"x1","cat":"espressioni","lv":"B1","it":"prendere in giro","fr":"se moquer de, faire marcher","ex":"Mi stai prendendo in giro?","exFr":"Tu te moques de moi ?"},{"id":"x2","cat":"espressioni","lv":"B1","it":"non c'entra niente","fr":"ça n'a rien à voir","ex":"Questo non c'entra niente con il progetto.","exFr":"Ça n'a rien à voir avec le projet."},{"id":"x3","cat":"espressioni","lv":"A2","it":"dare una mano","fr":"donner un coup de main","ex":"Mi dai una mano con il trasloco?","exFr":"Tu me donnes un coup de main pour le déménagement ?"},{"id":"x4","cat":"espressioni","lv":"B1","it":"in quattro e quattr'otto","fr":"en deux temps trois mouvements","ex":"Ha risolto tutto in quattro e quattr'otto.","exFr":"Il a tout réglé en deux temps trois mouvements."},{"id":"x5","cat":"espressioni","lv":"B1","it":"Acqua in bocca!","fr":"Motus et bouche cousue !","ex":"È una sorpresa: acqua in bocca!","exFr":"C'est une surprise : motus !"},{"id":"x6","cat":"espressioni","lv":"B1","it":"costare un occhio della testa","fr":"coûter les yeux de la tête","ex":"Quel ristorante costa un occhio della testa.","exFr":"Ce restaurant coûte les yeux de la tête."},{"id":"x7","cat":"espressioni","lv":"B1","it":"prendere due piccioni con una fava","fr":"faire d'une pierre deux coups","ex":"Così prendiamo due piccioni con una fava.","exFr":"Comme ça on fait d'une pierre deux coups."},{"id":"x8","cat":"espressioni","lv":"B1","it":"non mollare","fr":"ne rien lâcher, tenir bon","ex":"Dai, non mollare adesso!","exFr":"Allez, ne lâche rien maintenant !"},{"id":"x9","cat":"espressioni","lv":"B1","it":"Che figata!","fr":"Trop cool ! (familier)","ex":"Hai i biglietti per il Gran Premio? Che figata!","exFr":"Tu as les billets pour le Grand Prix ? Trop cool !"},{"id":"x10","cat":"espressioni","lv":"B1","it":"essere nei guai","fr":"avoir des ennuis","ex":"Se il capo lo scopre, siamo nei guai.","exFr":"Si le chef l'apprend, on a des ennuis."},{"id":"x11","cat":"espressioni","lv":"B1","it":"farsi in quattro","fr":"se plier en quatre","ex":"Si fa in quattro per aiutare tutti.","exFr":"Il se plie en quatre pour aider tout le monde."},{"id":"x12","cat":"espressioni","lv":"B1","it":"Roba da matti!","fr":"C'est du délire ! N'importe quoi !","ex":"Due ore di fila? Roba da matti!","exFr":"Deux heures de queue ? C'est du délire !"},{"id":"x13","cat":"espressioni","lv":"B1","it":"avere la testa fra le nuvole","fr":"avoir la tête dans les nuages","ex":"Oggi hai la testa fra le nuvole!","exFr":"Aujourd'hui tu as la tête dans les nuages !"},{"id":"x14","cat":"espressioni","lv":"B1","it":"essere al settimo cielo","fr":"être aux anges","ex":"Da quando l'ha saputo è al settimo cielo.","exFr":"Depuis qu'il l'a appris, il est aux anges."},{"id":"x15","cat":"espressioni","lv":"A2","it":"in bocca al lupo","fr":"bonne chance ! (réponse : crepi!)","ex":"In bocca al lupo per il colloquio di domani!","exFr":"Bonne chance pour l'entretien de demain !"},{"id":"x16","cat":"espressioni","lv":"A2","it":"figurati","fr":"je t'en prie, pas de souci (réponse à merci ou à une excuse) ; tu parles !","ex":"Grazie per il passaggio! — Figurati, ero di strada.","exFr":"Merci pour le trajet ! — Je t'en prie, c'était sur ma route."},{"id":"x17","cat":"espressioni","lv":"A2","it":"ci mancherebbe","fr":"je vous en prie, bien sûr ; il ne manquerait plus que ça","ex":"Posso usare il tuo computer? — Certo, ci mancherebbe!","exFr":"Je peux utiliser ton ordinateur ? — Bien sûr, je t'en prie !"},{"id":"x18","cat":"espressioni","lv":"A2","it":"boh","fr":"bof, j'en sais rien (avec haussement d'épaules)","ex":"A che ora arriva il treno? — Boh, non lo so.","exFr":"Le train arrive à quelle heure ? — J'en sais rien."},{"id":"x19","cat":"espressioni","lv":"A2","it":"meno male","fr":"heureusement, tant mieux","ex":"Meno male che ho preso l'ombrello, piove da due ore.","exFr":"Heureusement que j'ai pris le parapluie, il pleut depuis deux heures."},{"id":"x20","cat":"espressioni","lv":"A2","it":"Dai!","fr":"Allez ! Vas-y ! Arrête !","ex":"Dai, vieni a cena con noi, non lavorare sempre!","exFr":"Allez, viens dîner avec nous, ne travaille pas tout le temps !"},{"id":"x21","cat":"espressioni","lv":"B1","it":"Ma va'!","fr":"Mais non ! Arrête ! (incrédulité)","ex":"Hai vinto al Superenalotto? Ma va'!","exFr":"Tu as gagné au loto ? Mais non, arrête !"},{"id":"x22","cat":"espressioni","lv":"B1","it":"che palle","fr":"c'est chiant, quelle galère (familier, vulgaire)","ex":"Ancora sciopero dei mezzi, che palle!","exFr":"Encore une grève des transports, c'est chiant !"},{"id":"x23","cat":"espressioni","lv":"A2","it":"non vedo l'ora di","fr":"j'ai hâte de","ex":"Non vedo l'ora di andare in ferie ad agosto.","exFr":"J'ai hâte de partir en congés en août."},{"id":"x24","cat":"espressioni","lv":"A2","it":"lasciamo perdere","fr":"laissons tomber, laisse tomber","ex":"Il fornitore non risponde? Lasciamo perdere, ne cerco un altro.","exFr":"Le fournisseur ne répond pas ? Laissons tomber, j'en cherche un autre."},{"id":"x25","cat":"espressioni","lv":"A2","it":"a posto","fr":"en ordre, réglé (Tutto a posto? = Tout va bien ?)","ex":"Ho pagato il bollo, siamo a posto fino al prossimo anno.","exFr":"J'ai payé la vignette, on est en règle jusqu'à l'année prochaine."},{"id":"x26","cat":"espressioni","lv":"B1","it":"su due piedi","fr":"au pied levé, sur-le-champ","ex":"Non posso decidere su due piedi, devo parlarne con il capo.","exFr":"Je ne peux pas décider sur-le-champ, je dois en parler au chef."},{"id":"x27","cat":"espressioni","lv":"B1","it":"in gamba","fr":"doué, compétent, en forme (essere in gamba)","ex":"La nuova collega è proprio in gamba.","exFr":"La nouvelle collègue est vraiment douée."},{"id":"x28","cat":"espressioni","lv":"B1","it":"la figuraccia","fr":"la honte, le ridicule (fare una figuraccia = se ridiculiser)","ex":"Ho sbagliato nome al cliente, che figuraccia!","exFr":"Je me suis trompé de nom avec le client, quelle honte !"},{"id":"x29","cat":"espressioni","lv":"B1","it":"piantarla","fr":"arrêter (Piantala! = Arrête !) ; familier","ex":"Piantala di lamentarti e finisci il preventivo.","exFr":"Arrête de te plaindre et finis le devis."},{"id":"x30","cat":"espressioni","lv":"A2","it":"non ne posso più","fr":"je n'en peux plus","ex":"Non ne posso più di questo caldo, voglio la montagna.","exFr":"Je n'en peux plus de cette chaleur, je veux la montagne."},{"id":"x31","cat":"espressioni","lv":"B1","it":"farsi vivo","fr":"donner signe de vie, se manifester","ex":"Dovresti farti vivo ogni tanto con i tuoi genitori.","exFr":"Tu devrais donner signe de vie de temps en temps à tes parents."},{"id":"x32","cat":"espressioni","lv":"A2","it":"di fretta","fr":"pressé (essere di fretta) ; vite (in fretta)","ex":"Scusa, sono di fretta, ti chiamo stasera.","exFr":"Désolé, je suis pressé, je t'appelle ce soir."},{"id":"x33","cat":"espressioni","lv":"B1","it":"andare a ruba","fr":"se vendre comme des petits pains","ex":"I biglietti del derby sono andati a ruba in un'ora.","exFr":"Les billets du derby se sont vendus comme des petits pains en une heure."},{"id":"x34","cat":"espressioni","lv":"A2","it":"vale la pena","fr":"ça vaut la peine (valere la pena di)","ex":"Vale la pena salire a Superga per la vista.","exFr":"Ça vaut la peine de monter à Superga pour la vue."},{"id":"x35","cat":"espressioni","lv":"B1","it":"tirare avanti","fr":"tenir le coup, se débrouiller, faire aller","ex":"Con questo stipendio si tira avanti, ma niente di più.","exFr":"Avec ce salaire on s'en sort, mais rien de plus."}],"PHRASES":[{"id":"p1","cat"
