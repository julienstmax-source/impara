/* ───────── Tokens ───────── */
:root{
  --bg:#EEF0F3; --card:#FFFFFF; --ink:#171A21; --ink-2:#4B5160; --muted:#7A8090; --line:#E1E4EA; --line-2:#CFD4DD;
  --brand:#8E1B3C; --brand-2:#6E1230; --brand-soft:#F6E7EC; --on-brand:#FFFFFF;
  --gold:#D99A1E; --gold-soft:#FBF1DB; --ok:#2E8B57; --ok-soft:#E3F3EA; --info:#2456C2; --info-soft:#E4EBFA; --err:#D23C3C; --err-soft:#FBE4E4;
  --tab-bg:#FFFFFF; --focus:#8E1B3C; --tile-ok:#27744A; --tile-gold:#A8730C; --sim-bg:#D9DCE3; --sim-fg:#2B2F38; --sim-fg-2:#6B7180; --sim-card:#FFFFFF; --sim-line:#C9CDD6; --streak-fg:#7A5410;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif; --serif:'Newsreader',Georgia,"Times New Roman",serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#8A909E; --line:#2A2E38; --line-2:#3A3F4B;
  --brand:#B8325A; --brand-2:#8E1B3C; --brand-soft:#2E1A21; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --tile-gold:#B9800F; --sim-bg:#15171C; --sim-fg:#C2C6D0; --sim-fg-2:#7A8090; --sim-card:#1F2229; --sim-line:#2E323B; --streak-fg:#F2CC7A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121419; --card:#1B1E25; --ink:#F1F2F5; --ink-2:#C2C6D0; --muted:#8A909E; --line:#2A2E38; --line-2:#3A3F4B;
  --brand:#B8325A; --brand-2:#8E1B3C; --brand-soft:#2E1A21; --gold:#E2AA3A; --gold-soft:#2E2715; --ok:#3FA86D; --ok-soft:#17281E; --info:#5B86E8; --info-soft:#17213A; --err:#E25656; --err-soft:#331A1A;
  --tab-bg:#1B1E25; --focus:#E2AA3A; --tile-ok:#2E8B57; --tile-gold:#B9800F; --sim-bg:#15171C; --sim-fg:#C2C6D0; --sim-fg-2:#7A8090; --sim-card:#1F2229; --sim-line:#2E323B; --streak-fg:#F2CC7A; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{box-sizing:border-box}
#app,#view{height:100%;position:relative;overflow:hidden}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
:is(button,input,select,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.it{font-family:var(--serif);font-weight:500}

/* ───────── Shell ───────── */
.shell{height:100%;display:flex;position:relative;overflow:hidden;container:shell / inline-size}
.side{display:none}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;min-height:48px}
.bar .back{display:flex;align-items:center;gap:4px;color:var(--brand);font-weight:700;font-size:14px;padding:6px 2px}
.bar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--streak-fg);border-radius:999px;padding:5px 10px 5px 8px;font-size:13px;font-weight:700}
.streak svg.i{width:15px;height:15px;stroke:var(--gold);fill:var(--gold)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:var(--card);border:1px solid var(--line)}
.content{flex:1;padding:4px 14px calc(78px + var(--sab));max-width:760px;width:100%}

.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--tab-bg);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sab))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 3px;color:var(--muted);font-size:10.5px;font-weight:700;text-decoration:none;border-radius:10px;position:relative}
.tabs a.on{color:var(--brand)}
.tabs a svg.i{width:22px;height:22px}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brand);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:999px;font-weight:800}

@container shell (min-width:900px){
  .side{display:flex;flex-direction:column;width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;gap:4px;overflow-y:auto}
  .side .logo{font-weight:800;font-size:20px;letter-spacing:-.02em;padding:4px 10px 14px;color:var(--brand)}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px}
  .side a.on{background:var(--brand-soft);color:var(--brand)}
  .side .grow{flex:1}
  .tabs{display:none}
  .bar{padding-left:28px;max-width:820px}
  .content{padding:8px 28px 40px;max-width:820px}
}

/* ───────── Primitives ───────── */
.h2{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:10px 0 8px}
.h3{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.h3btn{display:grid;place-items:center;width:30px;height:28px;border-radius:8px;color:var(--muted);font-size:14px} .h3btn svg.i{width:16px;height:16px} .h3btn:disabled{opacity:.6}
.p{color:var(--ink-2);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-m);font-weight:700;font-size:15px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--tile-ok);border-color:var(--tile-ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.tile{border-radius:var(--r-s);padding:9px 10px 8px;color:#fff;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none}
.tile b{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.tile span{font-size:11px;font-weight:600;opacity:.92;line-height:1.15}
.tile.brand{background:var(--brand)} .tile.info{background:var(--info)} .tile.ok{background:var(--tile-ok)} .tile.gold{background:var(--tile-gold)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:13.5px;margin-bottom:12px}
.banner svg.i{color:var(--brand)}
.banner.warn{background:var(--gold-soft);border-color:transparent} .banner.warn svg.i{color:var(--gold)}
.banner.ok{background:var(--ok-soft);border-color:transparent} .banner.ok svg.i{color:var(--ok)}
.banner .t{flex:1;min-width:0;line-height:1.35} .banner .t small{display:block;color:var(--muted);font-size:12px}
.banner .act{color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}
.steps{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:54px;width:100%;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.row .ic.info{background:var(--info-soft);color:var(--info)} .row .ic.ok{background:var(--ok-soft);color:var(--ok)} .row .ic.gold{background:var(--gold-soft);color:var(--gold)} .row .ic.muted{background:var(--bg);color:var(--muted)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.row .end{color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .end svg.i{width:16px;height:16px;color:var(--line-2)}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.brand .fg{stroke:var(--brand)}

.item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%}
.item:first-child{border-top:0}
.item .k{width:8px;height:8px;border-radius:50%;margin-top:9px;flex:none;background:var(--info)}
.item .k.phrase{background:var(--brand)} .item .k.conj{background:var(--ok)}
.item .tx{flex:1;min-width:0}
.item .tx .w{display:block;font-size:17px;line-height:1.3}
.item .tx .tr{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.item .tx .tr i{color:var(--muted);font-style:italic}
.item .tx .hint{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item time{font-size:12px;color:var(--muted);font-weight:600;padding-top:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--ink-2);margin-top:4px}

.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{padding:12px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.field .inl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field .inl label{margin:0;color:var(--ink);font-size:15px;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}
.hours{display:flex;align-items:center;gap:8px}
.hours select{flex:1;min-height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);padding:0 10px;font-weight:600;-webkit-appearance:none;appearance:none}

/* ───────── Flashcard (l'élément signature) ───────── */
.scene{perspective:1400px;margin:8px 0 10px}
.fcard{display:block;width:100%;position:relative;height:300px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-l);padding:26px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 32px -18px rgba(23,26,33,.35)}
.face.back{background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;transform:rotateY(180deg);box-shadow:0 14px 36px -16px rgba(142,27,60,.6)}
.face .lv{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;color:var(--muted)}
.face.back .lv{color:rgba(255,255,255,.75)}
.face .word{font-family:var(--serif);font-size:clamp(28px,8vw,40px);line-height:1.12;font-weight:500;letter-spacing:-.01em}
.face.front .word{color:var(--brand)}
.face .ex{margin-top:14px;font-size:15px;line-height:1.5;color:var(--ink-2);font-family:var(--serif);font-style:italic}
.face.back .ex{color:rgba(255,255,255,.88)}
.face .fr{font-size:clamp(20px,5.6vw,26px);font-weight:700;line-height:1.25}
.face .tap{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted);font-weight:600}
.face.back .tap{color:rgba(255,255,255,.7)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}}
.under{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}

/* ───────── Quiz / exercices ───────── */
.q{font-family:var(--serif);font-size:clamp(22px,6vw,30px);line-height:1.25;margin:14px 0 14px;text-align:center}
.q.sans{font-family:var(--sans);font-weight:800;font-size:clamp(19px,5vw,24px);letter-spacing:-.01em}
.lead{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;padding:12px 14px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);font-size:16px;width:100%;display:flex;align-items:center;gap:10px}
.opt .n{width:24px;height:24px;border-radius:7px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{background:var(--err-soft);border-color:var(--err)} .opt.wrong .n{background:var(--err);color:#fff}
.opt:disabled{opacity:1}
.tin{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:var(--r-m);background:var(--card);font-family:var(--serif);font-size:22px;text-align:center}
.tin:focus{border-color:var(--brand)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)} .tin.wrong{border-color:var(--err);background:var(--err-soft)}
.fb{margin-top:12px;padding:10px 12px;border-radius:var(--r-m);font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line)}
.fb.good{border-color:var(--ok);background:var(--ok-soft)} .fb.bad{border-color:var(--err);background:var(--err-soft)}
.fb b{font-family:var(--serif);font-size:16px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.score{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink)}
.result{text-align:center;padding:26px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);margin-top:14px}
.result .big{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--brand);line-height:1}
.result .t{font-size:18px;font-weight:800;margin-top:10px} .result .s{color:var(--muted);font-size:13.5px;margin-top:4px}

/* ───────── Grammatica ───────── */
.lesson p{color:var(--ink-2);font-size:15px;line-height:1.55;margin:6px 0 12px}
.gtab{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:10px 0}
.gtab th{background:var(--bg);color:var(--muted);font-weight:700;text-align:left;padding:7px 10px;font-size:12px}
.gtab td{padding:7px 10px;border-top:1px solid var(--line)} .gtab td:first-child{color:var(--muted);font-weight:600}
.gtab td:not(:first-child){font-family:var(--serif);font-size:15px}
.gscroll{overflow-x:auto}
.gex{border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0}
.gex .it{font-size:16px} .gex small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hero{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;text-decoration:none;margin:6px 0 4px}
.hero .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.hero b{display:block;font-size:15.5px} .hero small{font-size:12.5px;opacity:.85}

/* ───────── Giochi ───────── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .gtile:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:0}
.grid2 .gtile:last-child:nth-child(odd)>span:last-child{flex:1} .grid2 .gtile:last-child:nth-child(odd) b{margin-top:0}
.gtile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit}
.gtile .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.gtile b{display:block;font-size:14.5px;margin-top:8px} .gtile small{color:var(--muted);font-size:12px;line-height:1.3}
.cwscroll{overflow-x:auto;padding:4px 0 6px}
.cw{display:grid;gap:3px;width:max-content;margin:0 auto}
.cell{position:relative;width:var(--cs);height:var(--cs)}
.cell input{width:100%;height:100%;border:1.5px solid var(--line-2);border-radius:6px;text-align:center;font:600 calc(var(--cs)*.5) var(--sans);text-transform:uppercase;background:var(--card);padding:0;caret-color:transparent}
.cell input.act{background:var(--gold-soft);border-color:var(--gold)}
.cell input:focus{outline:2px solid var(--brand);z-index:2;position:relative}
.cell input.right{background:var(--ok-soft);border-color:var(--ok)} .cell input.wrong{background:var(--err-soft);border-color:var(--err)}
.cell .n{position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.27);font-weight:800;color:var(--muted);z-index:3;pointer-events:none}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:520px){.clues{grid-template-columns:1fr}}
.clues h4{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.clue{display:block;width:100%;padding:6px 8px;border-radius:8px;font-size:13.5px;line-height:1.4}
.clue b{color:var(--brand);margin-right:4px} .clue.on{background:var(--gold-soft)}
.slots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:14px 0}
.slot{width:34px;height:44px;border-bottom:2px solid var(--line-2);font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.slot.ok{color:var(--ok);border-color:var(--ok)} .slot.ko{color:var(--err);border-color:var(--err)}
.letters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.lb{width:42px;height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);font-weight:700;font-size:18px;text-transform:uppercase;display:grid;place-items:center}
.lb:disabled{opacity:.25}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:50px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;text-align:center}
.pb.it{font-family:var(--serif);font-weight:500;font-size:16px}
.pb.sel{border-color:var(--gold);background:var(--gold-soft)} .pb.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .pb.err{background:var(--err-soft);border-color:var(--err)}
.toast{position:absolute;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px;line-height:1.5}
.empty svg.i{width:28px;height:28px;color:var(--line-2);margin-bottom:6px}
details.day summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:12px 2px 6px}
details.day summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>window.CONTENT = {"CATEGORIES":[{"id":"essenziali","label":"Parole utili","emoji":"💬","desc":"Les petits mots qui font les vraies phrases"},{"id":"quotidiano","label":"Vita quotidiana","emoji":"🏠","desc":"Maison, courses, démarches de tous les jours"},{"id":"lavoro","label":"Al lavoro","emoji":"💼","desc":"Contrats, salaire, réunions, vie de bureau"},{"id":"ristorante","label":"Al ristorante","emoji":"🍝","desc":"Commander, partager, apprécier comme un local"},{"id":"trasporti","label":"Strada & trasporti","emoji":"🚗","desc":"Voiture, train, ville : le vocabulaire pratique"},{"id":"tempo","label":"Tempo & date","emoji":"🕐","desc":"Situer dans le temps avec précision"},{"id":"verbi","label":"Verbi che contano","emoji":"⚡","desc":"Les verbes A2-B1 qui changent tout"},{"id":"espressioni","label":"Espressioni","emoji":"🎭","desc":"Idiomes et tournures de vrai Italien"},{"id":"libro","label":"Frasi del libro","emoji":"📕","desc":"Les phrases types des 12 unités de Vivi l'italiano"}],"WORDS":[{"id":"e1","cat":"essenziali","lv":"A2","it":"comunque","fr":"de toute façon, quoi qu'il en soit","ex":"Comunque, ci vediamo domani.","exFr":"De toute façon, on se voit demain."},{"id":"e2","cat":"essenziali","lv":"B1","it":"addirittura","fr":"carrément, même (renforce)","ex":"Ha addirittura pagato per tutti!","exFr":"Il a carrément payé pour tout le monde !"},{"id":"e3","cat":"essenziali","lv":"A2","it":"appena","fr":"à peine / dès que","ex":"Ti chiamo appena arrivo.","exFr":"Je t'appelle dès que j'arrive."},{"id":"e4","cat":"essenziali","lv":"B1","it":"mica","fr":"pas du tout, quand même pas (renforce la négation)","ex":"Non è mica facile!","exFr":"C'est pas facile du tout !"},{"id":"e5","cat":"essenziali","lv":"A2","it":"ormai","fr":"désormais / maintenant (c'est trop tard)","ex":"Ormai è troppo tardi per il treno.","exFr":"Maintenant c'est trop tard pour le train."},{"id":"e6","cat":"essenziali","lv":"A2","it":"quindi","fr":"donc","ex":"Piove, quindi resto a casa.","exFr":"Il pleut, donc je reste à la maison."},{"id":"e7","cat":"essenziali","lv":"B1","it":"anzi","fr":"au contraire / même, mieux encore","ex":"Non mi disturbi, anzi!","exFr":"Tu ne me déranges pas, au contraire !"},{"id":"e8","cat":"essenziali","lv":"A2","it":"invece","fr":"par contre, en revanche","ex":"Io lavoro, lui invece è in ferie.","exFr":"Moi je travaille, lui par contre est en congés."},{"id":"e9","cat":"essenziali","lv":"A2","it":"infatti","fr":"en effet, effectivement","ex":"— Sembra stanco. — Infatti non ha dormito.","exFr":"— Il a l'air fatigué. — En effet, il n'a pas dormi."},{"id":"e10","cat":"essenziali","lv":"A2","it":"per fortuna","fr":"heureusement","ex":"Per fortuna avevo l'ombrello.","exFr":"Heureusement, j'avais le parapluie."},{"id":"e11","cat":"essenziali","lv":"A2","it":"davvero","fr":"vraiment","ex":"È davvero un bel posto.","exFr":"C'est vraiment un bel endroit."},{"id":"e12","cat":"essenziali","lv":"B1","it":"quasi quasi","fr":"je serais bien tenté de… (hésitation)","ex":"Quasi quasi prendo un altro caffè.","exFr":"Je me prendrais bien un autre café."},{"id":"e13","cat":"essenziali","lv":"B1","it":"la roba","fr":"le truc, les affaires (familier)","ex":"Di chi è questa roba sul tavolo?","exFr":"À qui sont ces affaires sur la table ?"},{"id":"e14","cat":"essenziali","lv":"B1","it":"tra l'altro","fr":"d'ailleurs, entre autres","ex":"Tra l'altro, domani è festa.","exFr":"D'ailleurs, demain c'est férié."},{"id":"q1","cat":"quotidiano","lv":"B1","it":"il trasloco","fr":"le déménagement","ex":"Il trasloco è previsto per sabato.","exFr":"Le déménagement est prévu samedi."},{"id":"q2","cat":"quotidiano","lv":"A2","it":"la bolletta","fr":"la facture (eau, gaz, électricité)","ex":"È arrivata la bolletta della luce.","exFr":"La facture d'électricité est arrivée."},{"id":"q3","cat":"quotidiano","lv":"B1","it":"il condominio","fr":"la copropriété, l'immeuble","ex":"Domani c'è la riunione di condominio.","exFr":"Demain il y a la réunion de copropriété."},{"id":"q4","cat":"quotidiano","lv":"A2","it":"sbrigarsi","fr":"se dépêcher","ex":"Sbrigati, il tram arriva!","exFr":"Dépêche-toi, le tram arrive !"},{"id":"q5","cat":"quotidiano","lv":"B1","it":"le faccende di casa","fr":"les tâches ménagères","ex":"Il sabato faccio le faccende di casa.","exFr":"Le samedi je fais les tâches ménagères."},{"id":"q6","cat":"quotidiano","lv":"A2","it":"buttare la spazzatura","fr":"sortir / jeter les poubelles","ex":"Tocca a te buttare la spazzatura.","exFr":"C'est ton tour de sortir les poubelles."},{"id":"q7","cat":"quotidiano","lv":"A2","it":"la lavatrice","fr":"la machine à laver","ex":"La lavatrice si è rotta di nuovo.","exFr":"La machine à laver est encore en panne."},{"id":"q8","cat":"quotidiano","lv":"A2","it":"fare la fila","fr":"faire la queue","ex":"Ho fatto la fila per un'ora in posta.","exFr":"J'ai fait la queue une heure à la poste."},{"id":"q9","cat":"quotidiano","lv":"A2","it":"il bancomat","fr":"le distributeur / la carte bancaire","ex":"Posso pagare con il bancomat?","exFr":"Je peux payer par carte ?"},{"id":"q10","cat":"quotidiano","lv":"A2","it":"il resto","fr":"la monnaie (rendue)","ex":"Tenga il resto.","exFr":"Gardez la monnaie."},{"id":"q11","cat":"quotidiano","lv":"A2","it":"lo scontrino","fr":"le ticket de caisse","ex":"Vuole lo scontrino?","exFr":"Vous voulez le ticket ?"},{"id":"q12","cat":"quotidiano","lv":"A2","it":"i saldi","fr":"les soldes","ex":"A gennaio iniziano i saldi.","exFr":"En janvier commencent les soldes."},{"id":"q13","cat":"quotidiano","lv":"A2","it":"il quartiere","fr":"le quartier","ex":"Abito in un quartiere tranquillo.","exFr":"J'habite dans un quartier tranquille."},{"id":"q14","cat":"quotidiano","lv":"B1","it":"aggiustare","fr":"réparer","ex":"Devo far aggiustare la bici.","exFr":"Je dois faire réparer le vélo."},{"id":"l1","cat":"lavoro","lv":"B1","it":"assumere","fr":"embaucher","ex":"L'azienda vuole assumere due persone.","exFr":"L'entreprise veut embaucher deux personnes."},{"id":"l2","cat":"lavoro","lv":"B1","it":"licenziare","fr":"licencier","ex":"Hanno licenziato il direttore.","exFr":"Ils ont licencié le directeur."},{"id":"l3","cat":"lavoro","lv":"A2","it":"lo stipendio","fr":"le salaire","ex":"Lo stipendio arriva il 27 del mese.","exFr":"Le salaire arrive le 27 du mois."},{"id":"l4","cat":"lavoro","lv":"B1","it":"il contratto a tempo indeterminato","fr":"le CDI","ex":"Ho firmato un contratto a tempo indeterminato.","exFr":"J'ai signé un CDI."},{"id":"l5","cat":"lavoro","lv":"B1","it":"la trasferta","fr":"le déplacement professionnel","ex":"La settimana prossima sono in trasferta a Milano.","exFr":"La semaine prochaine je suis en déplacement à Milan."},{"id":"l6","cat":"lavoro","lv":"B1","it":"il fatturato","fr":"le chiffre d'affaires","ex":"Il fatturato è cresciuto del dieci per cento.","exFr":"Le chiffre d'affaires a augmenté de dix pour cent."},{"id":"l7","cat":"lavoro","lv":"A2","it":"consegnare","fr":"livrer, remettre","ex":"Devo consegnare il progetto entro venerdì.","exFr":"Je dois remettre le projet d'ici vendredi."},{"id":"l8","cat":"lavoro","lv":"B1","it":"rimandare","fr":"reporter, repousser","ex":"La riunione è stata rimandata a lunedì.","exFr":"La réunion a été reportée à lundi."},{"id":"l9","cat":"lavoro","lv":"B1","it":"il verbale","fr":"le compte rendu (de réunion)","ex":"Chi scrive il verbale della riunione?","exFr":"Qui rédige le compte rendu de la réunion ?"},{"id":"l10","cat":"lavoro","lv":"B1","it":"lo straordinario","fr":"les heures supplémentaires","ex":"Questo mese ho fatto molti straordinari.","exFr":"Ce mois-ci j'ai fait beaucoup d'heures sup."},{"id":"l11","cat":"lavoro","lv":"B1","it":"candidarsi","fr":"postuler","ex":"Mi sono candidato per quel posto.","exFr":"J'ai postulé pour ce poste."},{"id":"l12","cat":"lavoro","lv":"A2","it":"il colloquio","fr":"l'entretien (d'embauche)","ex":"Domani ho un colloquio di lavoro.","exFr":"Demain j'ai un entretien d'embauche."},{"id":"l13","cat":"lavoro","lv":"B1","it":"gestire","fr":"gérer","ex":"Gestisco tre progetti contemporaneamente.","exFr":"Je gère trois projets en même temps."},{"id":"l14","cat":"lavoro","lv":"B1","it":"il fornitore","fr":"le fournisseur","ex":"Il fornitore consegna giovedì.","exFr":"Le fournisseur livre jeudi."},{"id":"r1","cat":"ristorante","lv":"A2","it":"il locale","fr":"le bar / le resto (l'établissement)","ex":"Conosco un locale carino in centro.","exFr":"Je connais un endroit sympa en centre-ville."},{"id":"r2","cat":"ristorante","lv":"A2","it":"Offro io!","fr":"C'est moi qui invite !","ex":"Stasera offro io, niente discussioni.","exFr":"Ce soir c'est moi qui invite, pas de discussion."},{"id":"r3","cat":"ristorante","lv":"B1","it":"pagare alla romana","fr":"partager l'addition","ex":"Facciamo alla romana?","exFr":"On partage l'addition ?"},{"id":"r4","cat":"ristorante","lv":"A2","it":"la mancia","fr":"le pourboire","ex":"In Italia la mancia non è obbligatoria.","exFr":"En Italie le pourboire n'est pas obligatoire."},{"id":"r5","cat":"ristorante","lv":"A2","it":"alla griglia","fr":"grillé, au grill","ex":"Prendo il pesce alla griglia.","exFr":"Je prends le poisson grillé."},{"id":"r6","cat":"ristorante","lv":"A2","it":"il sugo","fr":"la sauce (pour les pâtes)","ex":"Il sugo di pomodoro è fatto in casa.","exFr":"La sauce tomate est faite maison."},{"id":"r7","cat":"ristorante","lv":"B1","it":"la cottura","fr":"la cuisson","ex":"Come vuole la cottura della carne?","exFr":"Quelle cuisson pour la viande ?"},{"id":"r8","cat":"ristorante","lv":"B1","it":"essere sazio","fr":"être rassasié, ne plus avoir faim","ex":"Basta così, sono sazio!","exFr":"Ça suffit, je n'ai plus faim !"},{"id":"r9","cat":"ristorante","lv":"B1","it":"surgelato","fr":"surgelé","ex":"Qui niente è surgelato, tutto fresco.","exFr":"Ici rien n'est surgelé, tout est frais."},{"id":"r10","cat":"ristorante","lv":"B1","it":"abbinare","fr":"associer, accorder (vin et plat)","ex":"Che vino abbiniamo al brasato?","exFr":"Quel vin accorde-t-on avec le brasato ?"},{"id":"r11","cat":"ristorante","lv":"A2","it":"il piatto del giorno","fr":"le plat du jour","ex":"Qual è il piatto del giorno?","exFr":"Quel est le plat du jour ?"},{"id":"r12","cat":"ristorante","lv":"A2","it":"fatto in casa","fr":"fait maison","ex":"La pasta è fatta in casa.","exFr":"Les pâtes sont faites maison."},{"id":"r13","cat":"ristorante","lv":"B1","it":"abbondante","fr":"copieux, généreux","ex":"Le porzioni sono molto abbondanti.","exFr":"Les portions sont très copieuses."},{"id":"t1","cat":"trasporti","lv":"B1","it":"il casello","fr":"le péage (autoroute)","ex":"Esci al casello di Torino Sud.","exFr":"Sors au péage de Turin Sud."},{"id":"t2","cat":"trasporti","lv":"A2","it":"la multa","fr":"l'amende, la contravention","ex":"Ho preso una multa per divieto di sosta.","exFr":"J'ai pris une amende pour stationnement interdit."},{"id":"t3","cat":"trasporti","lv":"B1","it":"il divieto di sosta","fr":"le stationnement interdit","ex":"Qui c'è divieto di sosta.","exFr":"Ici le stationnement est interdit."},{"id":"t4","cat":"trasporti","lv":"A2","it":"fare il pieno","fr":"faire le plein","ex":"Devo fare il pieno prima di partire.","exFr":"Je dois faire le plein avant de partir."},{"id":"t5","cat":"trasporti","lv":"A2","it":"la patente","fr":"le permis de conduire","ex":"Ho preso la patente a diciotto anni.","exFr":"J'ai eu le permis à dix-huit ans."},{"id":"t6","cat":"trasporti","lv":"B1","it":"il tragitto","fr":"le trajet","ex":"Il tragitto dura circa un'ora.","exFr":"Le trajet dure environ une heure."},{"id":"t7","cat":"trasporti","lv":"B1","it":"il pendolare","fr":"le navetteur (qui fait la navette)","ex":"Sono pendolare: casa-lavoro ogni giorno.","exFr":"Je fais la navette maison-travail tous les jours."},{"id":"t8","cat":"trasporti","lv":"B1","it":"la corsia","fr":"la voie, la file (route)","ex":"Resta sulla corsia di destra.","exFr":"Reste sur la voie de droite."},{"id":"t9","cat":"trasporti","lv":"B1","it":"sorpassare","fr":"doubler, dépasser","ex":     const picks = uniq(weighted(alts), correct.split(" / ").map(norm)).slice(0, 3).map((a) => a.v);
    return shuffle([{ id, label: correct }, ...picks.map((v, i) => ({ id: "~" + i, label: v }))]);
  }
  return { options, conjOptions, mutate };
})();

/* ═══════════════════════════════════════════
   5. Routeur (hash) — Retour fiable, liens internes interceptés
   ═══════════════════════════════════════════ */
const Router = {
  path: "/oggi", params: {}, depth: 0, pushing: false,
  parse() { const seg = (location.hash || "#/oggi").replace(/^#\/?/, "").split("/").filter(Boolean); this.path = "/" + (seg[0] || "oggi"); this.params = { a: seg[1], b: seg[2] }; if (!Views[this.path]) { this.path = "/oggi"; this.params = {}; } },
  go(p) { if (location.hash !== "#" + p) { this.pushing = true; location.hash = "#" + p; } else { G.key = ""; G.fresh(this.path, this.params); render({ top: true }); } },
  back(fallback) { if (!DEMO && this.depth > 0) history.back(); else this.go(fallback); },
};
window.addEventListener("hashchange", () => {
  if (Router.pushing) Router.depth++; else Router.depth = Math.max(0, Router.depth - 1);
  Router.pushing = false; Router.parse(); G.fresh(Router.path, Router.params); render({ top: true });
});

const UI = {
  tile: (cls, n, label, href) => `<a class="tile ${cls}" href="#${href}"><b>${n}</b><span>${label}</span></a>`,
  ring(pct, cls = "") { const r = 14, c = 2 * Math.PI * r; return `<svg class="ring ${cls}" viewBox="0 0 34 34"><circle class="bg" cx="17" cy="17" r="${r}"/><circle class="fg" cx="17" cy="17" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/></svg>`; },
  row({ href, a, data = "", ic, icCls = "", title, sub, end, chev = true }) {
    const tag = href ? `a href="#${href}"` : `button type="button" data-a="${a}" ${data}`;
    return `<${tag} class="row">${ic ? (ic.startsWith('<svg class="ring') ? ic : `<span class="ic ${icCls}">${ic}</span>`) : ""}<span class="tx"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</span><span class="end">${end || ""}${chev ? I.chev : ""}</span></${href ? "a" : "button"}>`;
  },
  flash({ flipped, lv, it, ex, fr, exFr, action }) {
    return `<div class="scene"><button type="button" class="fcard ${flipped ? "flip" : ""}" data-a="${action}" aria-pressed="${!!flipped}" aria-label="Carte : ${esc(it)}">
      <div class="face front"><span class="lv">${esc(lv)}</span><div class="word">${esc(it)}</div>${ex ? `<div class="ex">${esc(ex)}</div>` : ""}<span class="tap">Touche pour voir la traduction</span></div>
      <div class="face back"><span class="lv">Français</span><div class="fr">${esc(fr)}</div>${exFr ? `<div class="ex">${esc(exFr)}</div>` : ""}<span class="tap">Touche pour revenir</span></div>
    </button></div>`;
  },
  meta: (left, right) => `<div class="meta"><span>${left}</span><span class="score">${right}</span></div>`,
  prog: (pct) => `<div class="prog"><i style="width:${pct}%"></i></div>`,
  big: (n, of) => `${n}<span style="font-size:22px;color:var(--muted)">/${of}</span>`,
  result(big, title, sub, buttons) { return `<div class="result"><div class="big">${big}</div><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div><div class="btnrow">${buttons}</div>`; },
  // Liste de réponses : opts [{id,label}], état {picked, correct} après réponse
  opts(opts, action, state, serif = true) {
    return `<div class="opts">${opts.map((o, i) => { let c = "opt"; if (state) { if (o.id === state.correct) c += " right"; else if (o.id === state.picked) c += " wrong"; } return `<button class="${c}" data-a="${action}" data-id="${esc(o.id)}" ${state ? "disabled" : ""}><span class="n">${"ABCD"[i]}</span><span class="${serif ? "it" : ""}">${esc(o.label)}</span></button>`; }).join("")}</div>`;
  },
  tin: (value, state, placeholder = "Scrivi qui") => `<input id="inp" class="tin ${state ? (state.ok ? "right" : "wrong") : ""}" value="${esc(value)}" placeholder="${placeholder}" aria-label="Ta réponse en italien" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" ${state ? "readonly" : ""}>`,
  fb: (ok, html) => `<div class="fb ${ok ? "good" : "bad"}" role="status">${html}</div>`,
  exLine: (w) => w?.ex ? `<br><span class="it">${esc(w.ex)}</span> <span style="color:var(--muted)">— ${esc(w.exFr)}</span>` : "",
  next: (action, last) => `<button class="btn brand block" data-a="${action}" data-enter="1">${last ? "Résultat" : "Suivant"}</button>`,
  verify: (action, block = true) => `<button class="btn brand${block ? " block" : ""}" data-a="${action}" data-enter="1">Vérifier</button>`,
  fmtInterval: (m) => m < 60 ? `${m} min` : m % 60 === 0 ? `${m / 60} h` : `${Math.floor(m / 60)} h ${m % 60}`,
};

// Session d'exercices sur les éléments reçus (QCM proche / écriture, en alternance)
function startSession(scope) {
  const src = (scope === "week" ? Today.sent : Today.items()).map((s) => s.item).filter(Boolean);
  const uniq = [], seen = new Set(); src.forEach((i) => { if (!seen.has(i.id)) { seen.add(i.id); uniq.push(i); } });
  if (!uniq.length) { toast("Rien à réviser pour l'instant"); return; }
  const rounds = shuffle(uniq).slice(0, 12).map((it, idx) => {
    if (it.kind === "conj") {
      const opts = idx % 2 === 0 ? Distract.conjOptions(it.id, it.body) : []; it.body = String(it.body ?? "");
      return opts.length === 4
        ? { type: "mcq", lead: "Choisis la bonne forme", q: it.title, opts, a: it.id, display: it.body }
        : { type: "type", lead: `${it.extra} — écris la forme`, prompt: it.title, accepted: it.body.split(" / ").map(norm), display: it.body };
    }
    const w = BY_ID[it.id.replace(/^[wp]:/, "")] || { id: it.id, it: it.title, fr: it.body, ex: "", exFr: "", cat: it.kind === "phrase" ? "libro" : "" };
    if (idx % 2 === 0) return { type: "mcq", w, lead: "Comment dit-on en italien", q: w.fr, opts: Distract.options(w), a: w.id, display: w.it };
    return { type: "type", w, lead: "Écris en italien", prompt: w.fr, accepted: [...acceptedAnswers(w)], display: w.it };
  });
  G.st.session = { scope, rounds, idx: 0, score: 0, answered: null, input: "" }; render({ top: true });
}
Views.session = () => {
  const s = G.st.session, n = s.rounds.length;
  if (s.idx >= n) return UI.result(UI.big(s.score, n), s.score === n ? "Perfetto!" : s.score >= n * .6 ? "Molto bene" : "Si impara ripetendo", "Les bonnes réponses font avancer tes cartes.", `<button class="btn brand" data-a="session" data-scope="${s.scope}">Encore</button><button class="btn" data-a="session-close">Terminer</button>`);
  const r = s.rounds[s.idx], a = s.answered;
  const body = r.type === "mcq" ? `<div class="q sans">${esc(r.q)}</div>${UI.opts(r.opts, "s-mcq", a && { picked: a.pick, correct: r.a })}` : `<div class="q sans">${esc(r.prompt)}</div>${UI.tin(s.input, a)}`;
  const fb = a ? UI.fb(a.ok, `${a.ok ? "Esatto." : `Peccato — la réponse : <b>${esc(r.display)}</b>`}${UI.exLine(r.w)}`) : "";
  return `${UI.meta(`Esercizio ${s.idx + 1} / ${n}`, `${s.score} pt`)}${UI.prog(s.idx / n * 100)}<p class="lead">${esc(r.lead)}</p>${body}${fb}
    <div class="btnrow">${a ? UI.next("s-next", s.idx + 1 >= n) : r.type === "type" ? UI.verify("s-verify") : ""}</div>`;
};

  if (inp && !inp.readOnly) { if (typing !== null && !top) { inp.value = typing; inp.focus(); } else if (!touch) inp.focus(); }
  else if (!touch && hadFocus) app.querySelector("[data-enter]")?.focus();
  if (Router.path === "/giochi" && Router.params.a === "cruci" && G.st.c?.focus) { const el = app.querySelector(`.cell input[data-key="${G.st.c.focus}"]`); if (el && document.activeElement !== el) el.focus(); }
}

/* ═══════════════════════════════════════════
   10. Actions (délégation par data-a)
   ═══════════════════════════════════════════ */
const Actions = {
  back: (d) => Router.back(d.to),
  refresh: () => Today.refresh(true),
  async enable(d, el) { el.disabled = true; el.textContent = "Activation…"; try { await Push.enable(); toast("Notifications activées"); Today.refresh(true); } catch (e) { toast(e.message); } render(); },
  async test(d, el) { el.disabled = true; try { const r = await Api.call("/test", {}); const rep = r.report?.[0]; toast(rep?.sent ? "Notification envoyée" : rep?.error ? "Erreur : " + rep.error : "Envoyé"); setTimeout(() => Today.refresh(true), 1500); } catch (e) { toast("Erreur : " + e.message); } render(); },
  "set-int": (d) => { Store.s.settings.interval_min = +d.v; settingsChanged(); },
  "set-kind": (d) => { const ks = Store.s.settings.kinds, k = ks.includes(d.v) ? ks.filter((x) => x !== d.v) : [...ks, d.v]; if (!k.length) { toast("Garde au moins un type de contenu"); return; } Store.s.settings.kinds = k; settingsChanged(); },
  "set-enabled": () => { Store.s.settings.enabled = !Store.s.settings.enabled; settingsChanged(); },
  reveal: (d) => { G.st.open ??= {}; G.st.open[d.id] = !G.st.open[d.id]; render(); },
  session: (d) => startSession(d.scope),
  "session-close": () => { G.st.session = null; render({ top: true }); },
  "s-mcq": (d) => { const s = G.st.session; if (s.answered) return; sessionAnswer(d.id === s.rounds[s.idx].a, { pick: d.id }); },
  "s-verify": () => { const s = G.st.session, r = s.rounds[s.idx], v = inputValue(); if (!v.trim() || s.answered) return; s.input = v; sessionAnswer(r.accepted.includes(norm(v)), {}); },
  "s-next": () => { const s = G.st.session; s.idx++; s.answered = null; s.input = ""; render({ top: true }); },
  flip: () => { G.st.flipped = !G.st.flipped; render(); },
  grade: (d) => { const cat = Router.params.a; Store.grade(d.id, d.k === "1"); Store.s.pos[cat] = (Store.s.pos[cat] || 0) + 1; Store.save(); G.st.flipped = false; render(); },
  rflip: () => { G.st.flipped = !G.st.flipped; render(); },
  rgrade: (d) => { const q = G.st.queue, cur = q.shift(); Store.grade(cur, d.k === "1"); if (d.k !== "1") q.push(cur); G.st.flipped = false; G.st.done = true; render(); },
  "l-read": () => { G.st.phase = "read"; render({ top: true }); },
  "l-quiz": () => { Object.assign(G.st, { phase: "quiz", q: 0, score: 0, answered: null }); render({ top: true }); },
  "l-ans": (d) => { const L = G.st, l = LESSONS.find((x) => x.id === Router.params.a); if (L.answered !== null) return; L.answered = +d.id; if (L.answered === l.quiz[L.q].a) L.score++; render(); },
  "l-next": () => { const L = G.st, l = LESSONS.find((x) => x.id === Router.params.a); if (L.q + 1 >= l.quiz.length) { Store.s.grammar[l.id] = Math.max(Store.s.grammar[l.id] || 0, L.score); Store.save(); L.phase = "done"; } else { L.q++; L.answered = null; } render({ top: true }); },
  "c-start": (d) => { startConiuga(d.t); render({ top: true }); },
  "c-menu": () => { G.st.conj = null; render({ top: true }); },
  "c-check": () => { const C = G.st.conj, v = inputValue(); if (!v.trim() || C.result) return; C.input = v; const ok = C.rounds[C.idx].accepted.includes(norm(v)); C.result = { ok }; if (ok) C.score++; render(); },
  "c-next": () => { const C = G.st.conj; if (C.idx + 1 >= C.rounds.length) { Store.s.conjBest[C.tense] = Math.max(Store.s.conjBest[C.tense] || 0, C.score); Store.save(); C.finished = true; } else { C.idx++; C.input = ""; C.result = null; } render({ top: true }); },
  "g-again": () => { G.st = {}; render({ top: true }); },
  "sc-ans": (d) => { const S = G.st.s; if (S.ans) return; const q = S.qs[S.idx], ok = d.id === q.w.id; S.ans = { id: d.id, ok }; if (ok) S.score++; Store.grade(q.w.id, ok); render(); },
  "sc-next": () => { const S = G.st.s; if (S.idx + 1 >= 10) { S.fin = true; Store.s.stats.bestQuiz = Math.max(Store.s.stats.bestQuiz || 0, S.score); Store.save(); } else { S.idx++; S.ans = null; } render({ top: true }); },
  "wr-hint": () => { G.st.w.input = inputValue(); G.st.w.hint = true; render(); },
  "wr-check": () => { const S = G.st.w, v = inputValue(); if (!v.trim() || S.res) return; S.input = v; const ok = acceptedAnswers(S.qs[S.idx]).has(norm(v)); S.res = { ok }; if (ok) S.score++; Store.grade(S.qs[S.idx].id, ok); render(); },
  "wr-next": () => { const S = G.st.w; if (S.idx + 1 >= 8) S.fin = true; else { S.idx++; S.input = ""; S.res = null; S.hint = false; } render({ top: true }); },
  "cw-clue": (d) => { const C = G.st.c; C.active = { id: d.id, dir: d.dir }; const ks = cellsOf(Cw.active()); Cw.paint(); Cw.focus(ks.find((k) => !(C.cells[k] || "").length) || ks[0]); },
  "cw-verify": () => { const C = G.st.c; C.checked = true; Cw.entries().forEach((p) => { if (!C.graded.has(p.id) && cellsOf(p).every((k) => stripAccents((C.cells[k] || "").toUpperCase()) === C.cw.solution[k])) { C.graded.add(p.id); Store.grade(p.id, true); } }); render(); },
  "cw-reveal": () => { const C = G.st.c; Object.keys(C.cw.solution).forEach((k) => { C.cells[k] = C.cw.solution[k]; }); Cw.entries().forEach((p) => C.graded.add(p.id)); C.revealed = true; C.checked = false; render(); },
  "cw-new": () => { G.st.c = null; render({ top: true }); },
  "an-pick": (d) => { const A = G.st.a, i = +d.i; if (A.status === "ok" || A.status === "rev" || A.letters[i].used) return; A.letters[i].used = true; A.picked.push(i); A.status = null; if (A.picked.length === A.w.word.length) { const g = A.picked.map((x) => A.letters[x].ch).join(""); if (g === A.w.word) { A.status = "ok"; A.score++; Store.grade(A.w.id, true); } else A.status = "ko"; } render(); },
  "an-undo": () => { const A = G.st.a; if (!A.picked.length || A.status === "ok") return; A.letters[A.picked.pop()].used = false; A.status = null; render(); },
  "an-clear": () => { const A = G.st.a; if (A.status === "ok") return; A.letters.forEach((l) => l.used = false); A.picked = []; A.status = null; render(); },
  "an-reveal": () => { const A = G.st.a; Store.grade(A.w.id, false); A.status = "rev"; render(); },
  "an-next": () => { const A = G.st.a; A.used.add(A.w.id); if (A.count >= 8) A.fin = true; else { A.count++; anaRound(A); } render({ top: true }); },
  "ab-l": (d) => { if (G.st.b.err) return; G.st.b.selL = d.id; render(); abbinaCheck(); },
  "ab-r": (d) => { if (G.st.b.err) return; G.st.b.selR = d.id; render(); abbinaCheck(); },
  "ab-new": () => { G.st.b = abbinaRound(G.st.b); render({ top: true }); },
};
function sessionAnswer(ok, extra) { const s = G.st.session, r = s.rounds[s.idx]; s.answered = { ok, ...extra }; if (ok) s.score++; if (r.w) Store.grade(r.w.id, ok); render(); }
function abbinaCheck() { const B = G.st.b; if (!B.selL || !B.selR) return; B.tries++; if (B.selL === B.selR) { B.matched.add(B.selL); Store.grade(B.selL, true); B.selL = B.selR = null; render(); } else { B.err = { l: B.selL, r: B.selR }; render(); setTimeout(() => { if (G.st.b !== B) return; B.err = null; B.selL = B.selR = null; render(); }, 550); } }

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (el) { const fn = Actions[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); } return; }
  const a = e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); Router.go(a.getAttribute("href").slice(1)); }
});
app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.target.id === "inp" || e.target === document.body)) { e.preventDefault(); app.querySelector("[data-enter]")?.click(); }
  if (e.target.matches(".cell input") && e.key === "Backspace") { const key = e.target.dataset.key, C = G.st.c; if ((C.cells[key] || "").length) return; e.preventDefault(); const p = Cw.entryFor(key); if (!p) return; const ks = cellsOf(p), i = ks.indexOf(key); if (i > 0) { C.cells[ks[i - 1]] = ""; Cw.paint(); Cw.focus(ks[i - 1]); } }
});
app.addEventListener("input", (e) => { if (e.target.matches(".cell input")) Cw.input(e.target.dataset.key, e.target.value); });
app.addEventListener("change", (e) => {
  if (e.target.id === "sh" || e.target.id === "eh") { const s = Store.s.settings; s.start_hour = +document.getElementById("sh").value; s.end_hour = +document.getElementById("eh").value; if (s.end_hour <= s.start_hour) { s.end_hour = Math.min(24, s.start_hour + 1); toast("La fin doit être après le début"); } settingsChanged(); }
});
app.addEventListener("toggle", (e) => { if (e.target.matches("details.day")) { G.st.days ??= {}; G.st.days[e.target.dataset.k] = e.target.open; } }, true);
app.addEventListener("focusin", (e) => { if (e.target.matches(".cell input")) { const key = e.target.dataset.key, act = Cw.active(); if (act && cellsOf(act).includes(key)) return; const p = Cw.entryFor(key); if (p) { G.st.c.active = { id: p.id, dir: p.dir }; Cw.paint(); } } });
app.addEventListener("dblclick", (e) => { if (e.target.matches(".cell input")) { const key = e.target.dataset.key, here = Cw.entries().filter((p) => cellsOf(p).includes(key)); const a = G.st.c.active; if (here.length > 1 && a) { const o = here.find((p) => !(p.id === a.id && p.dir === a.dir)); if (o) { G.st.c.active = { id: o.id, dir: o.dir }; Cw.paint(); } } } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === document.body) { e.preventDefault(); app.querySelector("[data-enter]")?.click(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Router.path === "/oggi" && !G.st.session) Today.refresh(); });

/* ═══════════════════════════════════════════
   11. Démarrage
   ═══════════════════════════════════════════ */
Store.load();
if (DEMO) window.ImparaReset = () => { try { localStorage.removeItem(KEY); } catch (e) {} Store.load(); Demo.sent = null; Today.sent = []; Today.at = 0; G.key = ""; G.st = {}; Router.go("/oggi"); render({ top: true }); Push.me(); };
if (location.hash === "#oggi" || !location.hash) location.replace("#/oggi");
Router.parse(); G.fresh(Router.path, Router.params);
Push.init();
render();
Push.me();
</script>
