 loro","la loro","i loro","le loro"]]}],"exs":[{"it":"Mia sorella vive a Parigi, i miei genitori a Bordeaux.","fr":"Ma sœur vit à Paris, mes parents à Bordeaux."}],"quiz":[{"q":"___ macchina è rossa. (à moi)","opts":["La mia","Mia","Il mio"],"a":0,"why":"Objet → article obligatoire : la mia macchina."},{"q":"___ fratello vive a Lione.","opts":["Il mio","Mio","I miei"],"a":1,"why":"Famille au singulier → pas d'article : mio fratello."},{"q":"I ___ colleghi sono in ferie.","opts":["mio","miei","mie"],"a":1,"why":"Masc. pluriel → i miei."},{"q":"___ casa è in centro. (à eux)","opts":["Loro","La loro","Le loro"],"a":1,"why":"Loro prend toujours l'article : la loro casa."}]},{"id":"g7","track":"ripasso","title":"I verbi riflessivi","ref":"Vivi l'italiano · Unità 9","intro":"Le pronom se place avant le verbe : mi sveglio, ti alzi, si veste… Au passato prossimo, toujours avec essere : mi sono svegliato / svegliata.","tables":[{"h":["","svegliarsi","alzarsi"],"r":[["io","mi sveglio","mi alzo"],["tu","ti svegli","ti alzi"],["lui / lei","si sveglia","si alza"],["noi","ci svegliamo","ci alziamo"],["voi","vi svegliate","vi alzate"],["loro","si svegliano","si alzano"]]}],"exs":[{"it":"Mi sveglio alle sette e mi preparo in fretta.","fr":"Je me réveille à sept heures et je me prépare vite."}],"quiz":[{"q":"(io) ___ alle sette. (svegliarsi)","opts":["mi sveglio","si sveglio","sveglio"],"a":0,"why":"io → mi : mi sveglio."},{"q":"A che ora ___ ? (tu, alzarsi)","opts":["si alzi","ti alzi","ti alza"],"a":1,"why":"tu → ti + -i : ti alzi."},{"q":"(noi) ___ presto la sera. (addormentarsi)","opts":["ci addormentiamo","vi addormentiamo","si addormentiamo"],"a":0,"why":"noi → ci : ci addormentiamo."},{"q":"Ieri (io, fém.) ___ tardi. (svegliarsi, passé)","opts":["ho svegliato","mi sono svegliata","mi ho svegliata"],"a":1,"why":"Réfléchi au passé → essere : mi sono svegliata."}]},{"id":"g8","track":"ripasso","title":"Il passato prossimo","ref":"Vivi l'italiano · Unità 10","intro":"Présent de AVERE ou ESSERE + participe passé (-ato, -uto, -ito). ESSERE pour : mouvement (andare, venire, arrivare, partire, uscire, tornare), permanence (stare, rimanere), changement (nascere, diventare) et les réfléchis. Avec essere, le participe s'accorde : Maria è arrivata.","tables":[{"h":["avec AVERE","avec ESSERE"],"r":[["ho parlato","sono andato/a"],["hai preso","sei venuto/a"],["ha visto","è arrivato/a"],["abbiamo mangiato","siamo usciti/e"]]},{"h":["participes irréguliers"],"r":[["fare → fatto · dire → detto · prendere → preso"],["vedere → visto · leggere → letto · scrivere → scritto"],["aprire → aperto · bere → bevuto · rimanere → rimasto"],["essere → stato · venire → venuto · mettere → messo"]]}],"exs":[{"it":"Ieri sono andato al mercato e ho comprato del pesce.","fr":"Hier je suis allé au marché et j'ai acheté du poisson."}],"quiz":[{"q":"Ieri (io) ___ al cinema. (andare)","opts":["ho andato","sono andato","sono andando"],"a":1,"why":"Mouvement → essere : sono andato/a."},{"q":"(noi) ___ una pizza buonissima. (mangiare)","opts":["abbiamo mangiato","siamo mangiati","avete mangiato"],"a":0,"why":"Verbe transitif → avere : abbiamo mangiato."},{"q":"Maria ___ in ritardo. (arrivare)","opts":["ha arrivato","è arrivato","è arrivata"],"a":2,"why":"Essere → accord au féminin : è arrivata."},{"q":"(tu) ___ quel film? (vedere)","opts":["hai visto","hai veduto","sei visto"],"a":0,"why":"Participe irrégulier : visto → hai visto."}]},{"id":"g9","track":"ripasso","title":"I pronomi diretti","ref":"Vivi l'italiano · Unità 12","intro":"Lo, la, li, le remplacent le complément direct et se placent avant le verbe : Compri il pane? Sì, lo compro. Au passato prossimo, le participe s'accorde avec le pronom : Hai visto Maria? Sì, l'ho vista.","tables":[{"h":["","singulier","pluriel"],"r":[["masculin","lo (l')","li"],["féminin","la (l')","le"]]}],"exs":[{"it":"Le chiavi? Le ho lasciate in ufficio.","fr":"Les clés ? Je les ai laissées au bureau."}],"quiz":[{"q":"Compri il pane? Sì, ___ compro.","opts":["lo","la","li"],"a":0,"why":"il pane (masc. sing.) → lo."},{"q":"Hai visto Maria? Sì, ___ ho vista.","opts":["lo","l'","le"],"a":1,"why":"la + ho → l'ho vista (accord)."},{"q":"Inviti i colleghi? Sì, ___ invito.","opts":["li","le","gli"],"a":0,"why":"i colleghi (masc. plur.) → li."},{"q":"Hai comprato le mele? Sì, ___ ho comprate.","opts":["li","le","la"],"a":1,"why":"le mele → le… comprate (accord)."}]},{"id":"g10","track":"ripasso","title":"Le preposizioni","ref":"Vivi l'italiano · Unità 6-8","intro":"Simples (a, in, da, di, su, per, con) et articulées : a + il = al, in + la = nella, su + il = sul, da + la = dalla, di + il = del… Repères : a Torino (ville), in Italia (pays), dal medico (chez), alle otto (heure).","tables":[{"h":["+","il","lo","la","i","gli","le"],"r":[["a","al","allo","alla","ai","agli","alle"],["in","nel","nello","nella","nei","negli","nelle"],["di","del","dello","della","dei","degli","delle"],["da","dal","dallo","dalla","dai","dagli","dalle"],["su","sul","sullo","sulla","sui","sugli","sulle"]]}],"exs":[{"it":"Vado dal medico alle nove, poi torno in ufficio.","fr":"Je vais chez le médecin à neuf heures, puis je retourne au bureau."}],"quiz":[{"q":"Vado ___ Francia per il weekend.","opts":["a","in","da"],"a":1,"why":"Pays → in : in Francia."},{"q":"Il documento è ___ tavolo.","opts":["sul","nel","al"],"a":0,"why":"su + il = sul (sur le)."},{"q":"Domani vado ___ dentista.","opts":["al","dal","nel"],"a":1,"why":"Chez quelqu'un → da : dal dentista."},{"q":"La riunione è ___ dieci.","opts":["alle","a","nelle"],"a":0,"why":"Heure → alle dieci."}]},{"id":"g11","track":"avanti","title":"L'imperfetto","ref":"Nouveau · A2","intro":"Le temps de la description et de l'habitude au passé : « quand j'étais petit… », « il faisait beau… ». Formation très régulière : radical + -avo / -evo / -ivo. Seul essere est vraiment irrégulier.","tables":[{"h":["","parlare","avere","essere","fare"],"r":[["io","parlavo","avevo","ero","facevo"],["tu","parlavi","avevi","eri","facevi"],["lui / lei","parlava","aveva","era","faceva"],["noi","parlavamo","avevamo","eravamo","facevamo"],["voi","parlavate","avevate","eravate","facevate"],["loro","parlavano","avevano","erano","facevano"]]}],"exs":[{"it":"Da bambino abitavo vicino a Bordeaux.","fr":"Enfant, j'habitais près de Bordeaux."}],"quiz":[{"q":"Da bambino ___ a calcio ogni giorno. (giocare)","opts":["giocavo","ho giocato","giocherò"],"a":0,"why":"Habitude passée → imperfetto : giocavo."},{"q":"Ieri ___ molto freddo. (fare)","opts":["faceva","ha fatto","farà"],"a":0,"why":"Description (météo) → faceva freddo."},{"q":"(noi) ___ al mare ogni estate. (andare)","opts":["siamo andati","andavamo","andremo"],"a":1,"why":"« ogni estate » = habitude → andavamo."},{"q":"Mentre (io) ___, ha squillato il telefono. (dormire)","opts":["ho dormito","dormivo","dormirò"],"a":1,"why":"Action en cours interrompue → dormivo."}]},{"id":"g12","track":"avanti","title":"Passato prossimo vs imperfetto","ref":"Nouveau · A2-B1","intro":"LE grand duo du récit. Passato prossimo = action ponctuelle, terminée, qui fait avancer l'histoire. Imperfetto = décor, description, habitude, action en cours. « Mentre guardavo la TV (décor), è arrivato Luca (événement). »","tables":[{"h":["Imperfetto","Passato prossimo"],"r":[["habitude : andavo sempre…","fait unique : ieri sono andato…"],["description : era stanco, pioveva","événement : ha telefonato, è uscito"],["action en cours : mentre dormivo…","action qui interrompt : …ha bussato"]]}],"exs":[{"it":"Pioveva, così ho preso l'ombrello.","fr":"Il pleuvait, alors j'ai pris le parapluie."}],"quiz":[{"q":"Mentre ___ la TV, è arrivato Luca. (guardare)","opts":["guardavo","ho guardato","guardo"],"a":0,"why":"Action en cours (décor) → imperfetto."},{"q":"Ieri (io) ___ una macchina nuova. (comprare)","opts":["compravo","ho comprato","comprerei"],"a":1,"why":"Fait unique et terminé → passato prossimo."},{"q":"Quando ero piccolo, ___ a Lione. (abitare)","opts":["ho abitato","abitavo","abito"],"a":1,"why":"Situation durable dans le passé → imperfetto."},{"q":"All'improvviso il telefono ___. (squillare)","opts":["squillava","ha squillato","squilla"],"a":1,"why":"« all'improvviso » = événement ponctuel → passato prossimo."}]},{"id":"g13","track":"avanti","title":"Il futuro semplice","ref":"Nouveau · A2-B1","intro":"Projets et prévisions : -erò, -erai, -erà… Les verbes en -are passent aussi à -erò (parlerò). Irréguliers fréquents : sarò (essere), avrò, andrò, farò, verrò, vorrò, potrò, dovrò.","tables":[{"h":["","parlare","essere","andare","venire"],"r":[["io","parlerò","sarò","andrò","verrò"],["tu","parlerai","sarai","andrai","verrai"],["lui / lei","parlerà","sarà","andrà","verrà"],["noi","parleremo","saremo","andremo","verremo"],["voi","parlerete","sarete","andrete","verrete"],["loro","parleranno","saranno","andranno","verranno"]]}],"exs":[{"it":"L'anno prossimo parlerò italiano molto meglio.","fr":"L'année prochaine je parlerai bien mieux italien."}],"quiz":[{"q":"Domani ___ il cliente. (io, chiamare)","opts":["chiamerò","chiamarò","chiamo"],"a":0,"why":"-are → -erò : chiamerò."},{"q":"L'estate prossima ___ in Sicilia. (noi, andare)","opts":["andiamo","andremo","anderemo"],"a":1,"why":"Irrégulier : andrò → andremo."},{"q":"Secondo me ___ in ritardo. (loro, essere)","opts":["saranno","seranno","sono"],"a":0,"why":"essere → sarò : saranno."},{"q":"___ alla festa sabato? (tu, venire)","opts":["Venirai","Verrai","Vieni"],"a":1,"why":"venire → verrò : verrai."}]},{"id":"g14","track":"avanti","title":"Il condizionale presente","ref":"Nouveau · A2-B1","intro":"Le temps de la politesse et du souhait : vorrei (je voudrais), potresti (tu pourrais), mi piacerebbe (j'aimerais). Formation comme le futur mais en -ei : parlerei, sarei, avrei.","tables":[{"h":["","parlare","volere","potere","essere"],"r":[["io","parlerei","vorrei","potrei","sarei"],["tu","parleresti","vorresti","potresti","saresti"],["lui / lei","parlerebbe","vorrebbe","potrebbe","sarebbe"],["noi","parleremmo","vorremmo","potremmo","saremmo"],["voi","parlereste","vorreste","potreste","sareste"],["loro","parlerebbero","vorrebbero","potrebbero","sarebbero"]]}],"exs":[{"it":"Vorrei un tavolo per due, se possibile.","fr":"Je voudrais une table pour deux, si possible."}],"quiz":[{"q":"___ un caffè, per favore. (io, volere)","opts":["Voglio","Vorrei","Vorrò"],"a":1,"why":"Politesse → conditionnel : vorrei."},{"q":"___ aiutarmi con questo file? (tu, potere)","opts":["Puoi","Potresti","Potrai"],"a":1,"why":"Demande polie → potresti."},{"q":"Mi ___ visitare la Sicilia.","opts":["piacerebbe","piacerà","piace"],"a":0,"why":"Souhait → mi piacerebbe (j'aimerais)."},{"q":"Al posto tuo, ___ di più. (io, dormire)","opts":["dormo","dormirei","dormivo"],"a":1,"why":"Conseil hypothétique → dormirei."}]},{"id":"g15","track":"avanti","title":"L'imperativo","ref":"Nouveau · A2-B1","intro":"Donner un ordre ou un conseil. Avec « tu » : parla!, prendi!, dormi! — attention, la négation utilise l'infinitif : non fare!, non parlare! Forme de politesse (Lei) : parli!, prenda!, senta!","tables":[{"h":["","tu","Lei (politesse)","voi"],"r":[["parlare","parla!","parli!","parlate!"],["prendere","prendi!","prenda!","prendete!"],["sentire","senti!","senta!","sentite!"],["fare","fai! / fa'!","faccia!","fate!"],["négation (tu)","non parlare!","non parli!","non parlate!"]]}],"exs":[{"it":"Scusi, senta! Mi porta il conto?","fr":"Excusez-moi ! Vous m'apportez l'addition ?"}],"quiz":[{"q":"___ la finestra, per favore! (tu, aprire)","opts":["Apri","Apra","Aprire"],"a":0,"why":"Impératif tu des verbes -ire → apri!"},{"q":"Non ___ tardi stasera! (tu, fare)","opts":["fai","fare","fa"],"a":1,"why":"Négation avec tu → non + infinitif : non fare!"},{"q":"___ pure, signora! (Lei, entrare)","opts":["Entra","Entri","Entrate"],"a":1,"why":"Politesse (Lei) des verbes -are → -i : entri!"},{"q":"Ragazzi, ___ attenzione! (voi, fare)","opts":["fate","fanno","facciate"],"a":0,"why":"voi = présent : fate attenzione!"}]},{"id":"g16","track":"avanti","title":"I pronomi indiretti","ref":"Nouveau · A2-B1","intro":"Mi, ti, gli (à lui), le (à elle), ci, vi, gli (à eux). Indispensables avec piacere : mi piace la pizza, le piacciono i film. « Gli ho detto » = je lui ai dit (à lui), « le ho scritto » = je lui ai écrit (à elle).","tables":[{"h":["à qui ?","pronom","exemple"],"r":[["à moi","mi","mi piace"],["à toi","ti","ti scrivo"],["à lui","gli","gli telefono"],["à elle","le","le rispondo"],["à nous","ci","ci sembra"],["à vous","vi","vi mando"],["à eux / elles","gli","gli parlo"]]}],"exs":[{"it":"Ho visto Marco e gli ho dato le chiavi.","fr":"J'ai vu Marco et je lui ai donné les clés."}],"quiz":[{"q":"___ piace la pizza. (à moi)","opts":["Mi","Ti","Ci"],"a":0,"why":"à moi → mi piace."},{"q":"Ho chiamato Marco: ___ ho detto tutto.","opts":["lo","gli","le"],"a":1,"why":"dire À quelqu'un → indirect : gli (à lui)."},{"q":"E a Maria? ___ scrivo domani.","opts":["La","Gli","Le"],"a":2,"why":"à elle → le : le scrivo."},{"q":"___ piacciono i film francesi? (à toi)","opts":["Ti","Mi","Vi"],"a":0,"why":"à toi → ti piacciono."}]},{"id":"g17","track":"avanti","title":"Stare + gerundio","ref":"Nouveau · A2-B1","intro":"L'équivalent de « être en train de » : sto lavorando, stai mangiando. Gérondif : -are → -ando, -ere / -ire → -endo. Irréguliers : facendo (fare), bevendo (bere), dicendo (dire).","tables":[{"h":["","stare","+ gerundio"],"r":[["io","sto","parlando"],["tu","stai","prendendo"],["lui / lei","sta","dormendo"],["noi","stiamo","facendo"],["voi","state","bevendo"],["loro","stanno","dicendo"]]}],"exs":[{"it":"Non posso parlare, sto guidando.","fr":"Je ne peux pas parler, je suis en train de conduire."}],"quiz":[{"q":"Non posso rispondere, ___ . (guidare)","opts":["sto guidando","guido","guiderò"],"a":0,"why":"En train de → sto guidando."},{"q":"Cosa ___ ? (tu, fare)","opts":["stai facendo","stai fando","fai facendo"],"a":0,"why":"Gérondif irrégulier : facendo."},{"q":"I bambini ___ . (dormire)","opts":["stanno dormando","stanno dormendo","sono dormendo"],"a":1,"why":"-ire → -endo, avec stare : stanno dormendo."},{"q":"(noi) ___ la partita. (guardare)","opts":["stiamo guardando","state guardando","stiamo guardendo"],"a":0,"why":"noi stiamo + guardando."}]},{"id":"g18","track":"avanti","title":"Ci e ne","ref":"Nouveau · B1","intro":"Les deux petites particules qui font B1. CI = « y » (lieu, ou pensarci) : Vai a Milano? Sì, ci vado. NE = « en » (quantité, ou parlarne) : Quante mele? Ne prendo tre.","tables":[{"h":["particule","remplace","exemple"],"r":[["ci","un lieu (y)","Ci vado domani."],["ci","a + qqch","Ci penso io!"],["ne","une quantité (en)","Ne voglio due."],["ne","di + qqch","Ne parliamo dopo."]]}],"exs":[{"it":"Il Gran Premio? Non vedo l'ora, ci andrò a settembre!","fr":"Le Grand Prix ? J'ai hâte, j'y irai en septembre !"}],"quiz":[{"q":"Vai spesso a Milano? Sì, ___ vado ogni mese.","opts":["ci","ne","lo"],"a":0,"why":"y aller → ci vado."},{"q":"Quante mele vuoi? ___ voglio tre.","opts":["Ci","Ne","Le"],"a":1,"why":"en vouloir trois → ne voglio tre."},{"q":"Pensi ancora al lavoro? Sì, ___ penso troppo.","opts":["ci","ne","lo"],"a":0,"why":"pensare A → ci penso."},{"q":"Hai del pane? Sì, ___ ho un po'.","opts":["ci","lo","ne"],"a":2,"why":"di + quantité → ne ho un po'."}]},{"id":"g19","track":"avanti","title":"Comparativi e superlativi","ref":"Nouveau · A2-B1","intro":"Più / meno… di (plus / moins que), (tanto)… quanto ou come (autant que). Irréguliers : migliore (meilleur), peggiore (pire). Superlatif absolu en -issimo : buonissimo, bellissima, stanchissimo.","tables":[{"h":["comparaison","italien"],"r":[["plus… que","più grande di Milano"],["moins… que","meno caro del ristorante"],["autant que","alto quanto / come me"],["meilleur / pire","migliore / peggiore"],["très + adj.","buonissimo, bellissima"]]}],"exs":[{"it":"Questo caffè è migliore di quello del bar.","fr":"Ce café est meilleur que celui du bar."}],"quiz":[{"q":"Torino è ___ grande ___ Milano.","opts":["meno… di","meno… che","più… quanto"],"a":0,"why":"Comparaison avec un nom → meno… di."},{"q":"Questo tiramisù è ___! (très bon)","opts":["molto buonissimo","buonissimo","più buonissimo"],"a":1,"why":"-issimo suffit, jamais « molto buonissimo »."},{"q":"Il caffè qui è ___ di quello in ufficio. (meilleur)","opts":["più buono meglio","migliore","il più"],"a":1,"why":"Meilleur → migliore."},{"q":"Luca è alto ___ me.","opts":["di","quanto","che"],"a":1,"why":"Égalité → quanto (ou come)."}]},{"id":"g20","track":"avanti","title":"I pronomi combinati","ref":"Nouveau · B1","intro":"Quand indirect + direct se rencontrent : mi + lo → me lo, ti + la → te la, gli/le + lo → glielo. « Mi presti il libro? Te lo presto domani. » Le participe s'accorde avec le pronom direct : gliele ho date.","tables":[{"h":["","+ lo","+ la","+ li","+ le"],"r":[["mi","me lo","me la","me li","me le"],["ti","te lo","te la","te li","te le"],["gli / le","glielo","gliela","glieli","gliele"],["ci","ce lo","ce la","ce li","ce le"],["vi","ve lo","ve la","ve li","ve le"]]}],"exs":[{"it":"Il preventivo? Glielo mando entro stasera.","fr":"Le devis ? Je le lui envoie d'ici ce soir."}],"quiz":[{"q":"Mi presti il libro? Sì, ___ presto.","opts":["te lo","ti lo","me lo"],"a":0,"why":"ti + lo → te lo presto."},{"q":"Hai dato le chiavi a Marco? Sì, ___ ho date.","opts":["glielo","gliele","le le"],"a":1,"why":"gli + le → gliele (accord : date)."},{"q":"Ci porti i documenti? ___ porto domani.","opts":["Ve li","Ce li","Ve le"],"a":1,"why":"ci + li → ce li porto."},{"q":"Puoi mandarmi la mail? Sì, ___ mando subito.","opts":["te la","te lo","me la"],"a":0,"why":"mi + la → te la (de ton point de vue à toi)."}]},{"id":"g21","track":"b1","title":"Il congiuntivo presente: le forme","ref":"Verso il B1","intro":"Le subjonctif présent s'emploie après les verbes d'opinion, de volonté et de sentiment (penso che, voglio che, spero che). Formes : -are → -i, -i, -i, -iamo, -iate, -ino ; -ere/-ire → -a, -a, -a, -iamo, -iate, -ano. Les trois personnes du singulier sont identiques : on précise souvent le pronom (che io parli, che tu parli).","tables":[{"h":["","parlare","prendere","finire","essere","avere"],"r":[["che io","parli","prenda","finisca","sia","abbia"],["che tu","parli","prenda","finisca","sia","abbia"],["che lui/lei","parli","prenda","finisca","sia","abbia"],["che noi","parliamo","prendiamo","finiamo","siamo","abbiamo"],["che voi","parliate","prendiate","finiate","siate","abbiate"],["che loro","parlino","prendano","finiscano","siano","abbiano"]]},{"h":["irréguliers","io / tu / lui","noi","voi","loro"],"r":[["andare","vada","andiamo","andiate","vadano"],["fare","faccia","facciamo","facciate","facciano"],["venire","venga","veniamo","veniate","vengano"],["potere","possa","possiamo","possiate","possano"],["volere","voglia","vogliamo","vogliate","vogliano"],["dovere","debba","dobbiamo","dobbiate","debbano"]]}],"exs":[{"it":"Penso che il fornitore abbia ragione.","fr":"Je pense que le fournisseur a raison."},{"it":"Spero che tu venga alla partita sabato.","fr":"J'espère que tu viens au match samedi."}],"quiz":[{"q":"Credo che Marco ___ in ferie questa settimana. (essere)","opts":["è","sia","sarà"],"a":1,"why":"Après credo che → subjonctif : sia."},{"q":"Voglio che voi ___ il preventivo entro venerdì. (finire)","opts":["finite","finiate","finiscano"],"a":1,"why":"voi → -iate : finiate (verbe en -isc-, mais noi/voi sans -isc-)."},{"q":"Non penso che loro ___ domani. (venire)","opts":["vengono","vengano","verranno"],"a":1,"why":"venire au subjonctif : venga / vengano."},{"q":"È importante che tu ___ puntuale. (essere)","opts":["sei","sia","sarai"],"a":1,"why":"È importante che + subjonctif : sia."}]},{"id":"g22","track":"b1","title":"Il congiuntivo: quando si usa","ref":"Verso il B1","intro":"Le subjonctif apparaît après : les opinions et doutes (penso, credo, mi sembra, dubito che), la volonté (voglio, preferisco che), les sentiments (sono contento, mi dispiace che), les tournures impersonnelles (è meglio / importante / possibile che, bisogna che) et certaines conjonctions (benché, sebbene, prima che, a meno che, affinché, senza che). Pas de subjonctif après « so che », « è vero che », « secondo me ». Si le sujet est le même, on emploie l'infinitif : penso di partire.","tables":[{"h":["déclencheur","exemple","traduction"],"r":[["penso / credo che","Penso che sia tardi.","Je pense qu'il est tard."],["voglio che","Voglio che tu resti.","Je veux que tu restes."],["è meglio che","È meglio che partiate presto.","Il vaut mieux que vous partiez tôt."],["benché / sebbene","Esco benché piova.","Je sors bien qu'il pleuve."],["prima che","Chiamami prima che sia tardi.","Appelle-moi avant qu'il soit tard."],["même sujet → infinitif","Penso di avere ragione.","Je pense avoir raison."]]}],"exs":[{"it":"Mi dispiace che tu non possa venire a cena.","fr":"Je suis désolé que tu ne puisses pas venir dîner."},{"it":"So che la riunione è alle dieci.","fr":"Je sais que la réunion est à dix heures."}],"quiz":[{"q":"So che Luca ___ a Milano. (lavorare)","opts":["lavori","lavora","lavorasse"],"a":1,"why":"Après so che (certitude) → indicatif : lavora."},{"q":"È possibile che il treno ___ in ritardo. (essere)","opts":["è","sia","sarà"],"a":1,"why":"È possibile che + subjonctif : sia."},{"q":"Penso ___ partire domani mattina.","opts":["che","di","a"],"a":1,"why":"Même sujet → penso di + infinitif."},{"q":"Resto in ufficio ___ il cliente non chiami.","opts":["perché","finché","siccome"],"a":1,"why":"finché non + subjonctif : jusqu'à ce que le client appelle."}]},{"id":"g23","track":"b1","title":"Il congiuntivo passato","ref":"Verso il B1","intro":"Pour une action passée après un déclencheur du subjonctif : avere/essere au subjonctif présent + participe passé. Penso che abbia già mangiato. Credo che siano partiti ieri. L'accord suit les règles du passato prossimo (essere → accord avec le sujet).","tables":[{"h":["","avere + participe","essere + participe"],"r":[["che io","abbia parlato","sia andato/a"],["che tu","abbia parlato","sia andato/a"],["che lui/lei","abbia parlato","sia andato/a"],["che noi","abbiamo parlato","siamo andati/e"],["che voi","abbiate parlato","siate andati/e"],["che loro","abbiano parlato","siano andati/e"]]}],"exs":[{"it":"Spero che abbiate ricevuto la mia mail.","fr":"J'espère que vous avez reçu mon mail."},{"it":"Mi sembra che Giulia sia già uscita.","fr":"Il me semble que Giulia est déjà sortie."}],"quiz":[{"q":"Credo che il corriere ___ già ___. (passare)","opts":["è / passato","sia / passato","abbia / passato"],"a":1,"why":"passare (ici intransitif) → essere : sia passato."},{"q":"Penso che loro ___ la partita. (vincere)","opts":["abbiano vinto","hanno vinto","siano vinti"],"a":0,"why":"vincere → avere : abbiano vinto."},{"q":"Non so se Anna ___ a Torino. (tornare)","opts":["è tornata","sia tornata","abbia tornato"],"a":1,"why":"non so se + subjonctif passé ; tornare → essere : sia tornata."},{"q":"Sono contento che tu ___ il lavoro. (trovare)","opts":["abbia trovato","sia trovato","trovi"],"a":0,"why":"Sentiment + action passée → abbia trovato."}]},{"id":"g24","track":"b1","title":"Il congiuntivo imperfetto","ref":"Verso il B1","intro":"Après un verbe au passé ou au conditionnel, et dans les hypothèses irréelles : pensavo che fosse, vorrei che tu venissi, se avessi tempo. Formes : radical + -assi/-essi/-issi, -assi, -asse, -assimo, -aste, -assero. Irréguliers : essere → fossi, fossi, fosse, fossimo, foste, fossero ; fare → facessi ; dire → dicessi ; bere → bevessi ; stare → stessi ; dare → dessi.","tables":[{"h":["","parlare","prendere","dormire","essere","avere"],"r":[["che io","parlassi","prendessi","dormissi","fossi","avessi"],["che tu","parlassi","prendessi","dormissi","fossi","avessi"],["che lui/lei","parlasse","prendesse","dormisse","fosse","avesse"],["che noi","parlassimo","prendessimo","dormissimo","fossimo","avessimo"],["che voi","parlaste","prendeste","dormiste","foste","aveste"],["che loro","parlassero","prendessero","dormissero","fossero","avessero"]]}],"exs":[{"it":"Pensavo che la riunione fosse alle nove.","fr":"Je pensais que la réunion était à neuf heures."},{"it":"Vorrei che tu mi dessi una mano col trasloco.","fr":"Je voudrais que tu me donnes un coup de main pour le déménagement."}],"quiz":[{"q":"Credevo che Paolo ___ ancora in ufficio. (essere)","opts":["sia","fosse","era"],"a":1,"why":"Verbe principal au passé (credevo) → subjonctif imparfait : fosse."},{"q":"Vorrei che voi ___ prima. (arrivare)","opts":["arriviate","arrivaste","arrivereste"],"a":1,"why":"Vorrei che + subjonctif imparfait : arrivaste."},{"q":"Non sapevo che tu ___ così bene l'italiano. (parlare)","opts":["parli","parlassi","parlavi"],"a":1,"why":"non sapevo che → parlassi."},{"q":"Sarebbe meglio che lui ___ con il capo. (parlare)","opts":["parli","parlasse","parlerebbe"],"a":1,"why":"Conditionnel + che → subjonctif imparfait : parlasse."}]},{"id":"g25","track":"b1","title":"Il periodo ipotetico","ref":"Verso il B1","intro":"Trois types d'hypothèse. 1) Réalité : se + présent/futur → présent/futur/impératif : Se piove, resto a casa. 2) Possibilité : se + subjonctif imparfait → conditionnel présent : Se avessi tempo, verrei. 3) Irréel du passé : se + subjonctif plus-que-parfait → conditionnel passé : Se avessi saputo, sarei venuto. Jamais « se + conditionnel » comme en français familier.","tables":[{"h":["type","se…","alors…"],"r":[["réel","Se hai fame,","mangia qualcosa."],["réel (futur)","Se domani fa bello,","andremo in collina."],["possible","Se avessi la macchina,","ti accompagnerei."],["possible","Se fossi in te,","accetterei l'offerta."],["irréel passé","Se avessi preso il treno prima,","sarei arrivato in orario."]]}],"exs":[{"it":"Se vinciamo stasera, andiamo primi in classifica.","fr":"Si on gagne ce soir, on passe premiers au classement."},{"it":"Se potessi, cambierei lavoro domani.","fr":"Si je pouvais, je changerais de travail demain."}],"quiz":[{"q":"Se ___ più tempo, farei sport. (avere)","opts":["avrei","avessi","ho"],"a":1,"why":"Hypothèse possible : se + subjonctif imparfait → avessi."},{"q":"Se domani non piove, ___ al parco.","opts":["andremmo","andiamo","andassimo"],"a":1,"why":"Hypothèse réelle : présent/futur → andiamo."},{"q":"Se fossi in te, non ___ quella macchina.","opts":["compro","comprerei","comprassi"],"a":1,"why":"se fossi… → conditionnel présent : comprerei."},{"q":"Se avessi saputo dello sciopero, ___ prima.","opts":["sarei partito","partivo","fossi partito"],"a":0,"why":"Irréel du passé → conditionnel passé : sarei partito."}]},{"id":"g26","track":"b1","title":"Il condizionale passato","ref":"Verso il B1","intro":"Conditionnel passé = avrei/sarei + participe : avrei voluto, sarei andato. Trois usages : le regret ou l'irréel (Avrei voluto venire), la politesse sur un fait passé (Avrebbe dovuto chiamare prima), et surtout le futur dans le passé : Ha detto che sarebbe arrivato alle otto (il a dit qu'il arriverait). En italien, « il a dit qu'il viendrait » se traduit par le conditionnel passé, pas le présent.","tables":[{"h":["","volere","andare"],"r":[["io","avrei voluto","sarei andato/a"],["tu","avresti voluto","saresti andato/a"],["lui/lei","avrebbe voluto","sarebbe andato/a"],["noi","avremmo voluto","saremmo andati/e"],["voi","avreste voluto","sareste andati/e"],["loro","avrebbero voluto","sarebbero andati/e"]]}],"exs":[{"it":"Il fornitore ha detto che avrebbe mandato il preventivo oggi.","fr":"Le fournisseur a dit qu'il enverrait le devis aujourd'hui."},{"it":"Avrei preferito un tavolo fuori, ma pioveva.","fr":"J'aurais préféré une table dehors, mais il pleuvait."}],"quiz":[{"q":"Ha promesso che ___ puntuale. (essere)","opts":["sarebbe stato","sarebbe","era"],"a":0,"why":"Futur dans le passé → conditionnel passé : sarebbe stato."},{"q":"___ venire, ma avevo la febbre. (volere, io)","opts":["Vorrei","Avrei voluto","Volessi"],"a":1,"why":"Regret sur le passé : avrei voluto."},{"q":"Pensavo che ___ più semplice. (essere)","opts":["sarebbe stato","sia","è"],"a":0,"why":"Pensavo che + futur dans le passé : sarebbe stato (ou fosse)."},{"q":"Mi hanno detto che ___ domani. (chiamare, loro)","opts":["avrebbero chiamato","chiamerebbero","chiameranno"],"a":0,"why":"Ha detto che + conditionnel passé : avrebbero chiamato."}]},{"id":"g27","track":"b1","title":"Il trapassato prossimo","ref":"Verso il B1","intro":"Le plus-que-parfait : avevo/ero + participe. Il exprime une action antérieure à une autre action passée : Quando sono arrivato, la riunione era già cominciata. Il se combine avec le passato prossimo ou l'imperfetto, souvent avec già, ancora, appena, prima.","tables":[{"h":["","finire","partire"],"r":[["io","avevo finito","ero partito/a"],["tu","avevi finito","eri partito/a"],["lui/lei","aveva finito","era partito/a"],["noi","avevamo finito","eravamo partiti/e"],["voi","avevate finito","eravate partiti/e"],["loro","avevano finito","erano partiti/e"]]}],"exs":[{"it":"Quando ha chiamato, avevo già spedito l'ordine.","fr":"Quand il a appelé, j'avais déjà envoyé la commande."},{"it":"Non ero mai stato a Superga prima di sabato.","fr":"Je n'étais jamais allé à Superga avant samedi."}],"quiz":[{"q":"Quando siamo arrivati, il film ___ già ___. (cominciare)","opts":["era / cominciato","aveva / cominciato","è / cominciato"],"a":0,"why":"cominciare (intransitif) → essere : era già cominciato."},{"q":"Ieri ho rivisto il collega che ___ a Parigi. (conoscere)","opts":["ho conosciuto","avevo conosciuto","conoscevo"],"a":1,"why":"Action antérieure au passé → trapassato : avevo conosciuto."},{"q":"Non ___ mai ___ la bagna cauda prima di venire a Torino. (mangiare, io)","opts":["avevo / mangiato","ero / mangiato","ho / mangiato"],"a":0,"why":"mangiare → avere : avevo mangiato."},{"q":"Appena ___ di cenare, ci hanno chiamato. (finire, noi)","opts":["abbiamo finito","avevamo finito","finivamo"],"a":1,"why":"appena + trapassato : avevamo finito."}]},{"id":"g28","track":"b1","title":"Il passato remoto: riconoscerlo","ref":"Verso il B1","intro":"Le passé simple se lit dans les romans, les journaux, l'histoire et s'entend dans le Sud. À Turin on l'utilise peu à l'oral, mais il faut le reconnaître. Réguliers : parlai, parlasti, parlò, parlammo, parlaste, parlarono ; credei/credetti, credesti, credé/credette ; dormii, dormisti, dormì. Irréguliers fréquents : fu (essere), ebbe (avere), fece (fare), disse (dire), andò, venne, vide, prese, scrisse, nacque, morì.","tables":[{"h":["infinitif","lui/lei","loro"],"r":[["essere","fu","furono"],["avere","ebbe","ebbero"],["fare","fece","fecero"],["dire","disse","dissero"],["venire","venne","vennero"],["vedere","vide","videro"],["prendere","prese","presero"],["nascere","nacque","nacquero"]]}],"exs":[{"it":"La Fiat nacque a Torino nel 1899.","fr":"Fiat naquit à Turin en 1899."},{"it":"Il Toro vinse lo scudetto nel 1976.","fr":"Le Torino remporta le titre en 1976."}],"quiz":[{"q":"« Garibaldi ___ a Nizza nel 1807. » Quel verbe ?","opts":["nacque = nascere","nacque = conoscere","nacque = andare"],"a":0,"why":"nacque est le passé simple de nascere."},{"q":"« Dante ___ la Commedia in esilio. »","opts":["scrisse","ha scritto","scriveva"],"a":0,"why":"Dans un texte historique : passé simple scrisse."},{"q":"« Lui ___ e non tornò più. » — fu / ebbe / andò : lequel signifie « partit » ?","opts":["fu","ebbe","andò"],"a":2,"why":"andò = passé simple de andare."},{"q":"À l'oral, à Turin, pour « hier j'ai vu Marco » on dit :","opts":["Ieri vidi Marco.","Ieri ho visto Marco.","Ieri vedevo Marco."],"a":1,"why":"Au Nord, le passé composé domine à l'oral."}]},{"id":"g29","track":"b1","title":"Il futuro anteriore e il futuro di probabilità","ref":"Verso il B1","intro":"Futur antérieur : avrò/sarò + participe. 1) Action future antérieure à une autre : Quando avrò finito, ti chiamo. 2) Supposition sur le passé : Avrà perso il treno (il a dû rater le train). Le futur simple sert aussi à supposer au présent : Sarà in riunione (il doit être en réunion). Che ore sono? — Saranno le dieci.","tables":[{"h":["usage","exemple","traduction"],"r":[["antériorité","Quando avrai letto la mail, rispondimi.","Quand tu auras lu le mail, réponds-moi."],["antériorité","Appena saremo arrivati, vi scriviamo.","Dès que nous serons arrivés, on vous écrit."],["probabilité passée","Non risponde: avrà dimenticato il telefono.","Il ne répond pas : il a dû oublier son téléphone."],["probabilité présente","Dov'è Marco? — Sarà al bar.","Où est Marco ? — Il doit être au bar."]]}],"exs":[{"it":"Quando avrò firmato il contratto, festeggiamo.","fr":"Quand j'aurai signé le contrat, on fête ça."},{"it":"Il tram è in ritardo: ci sarà stato un incidente.","fr":"Le tram est en retard : il a dû y avoir un accident."}],"quiz":[{"q":"Quando ___ di lavorare, andiamo a bere qualcosa. (finire, tu)","opts":["finirai","avrai finito","hai finito"],"a":1,"why":"Antériorité dans le futur → futur antérieur : avrai finito."},{"q":"Luca non è venuto: ___ la febbre. (avere)","opts":["avrà avuto","ha avuto","aveva"],"a":0,"why":"Supposition sur le passé → avrà avuto."},{"q":"Che ore sono? — ___ le otto e mezza.","opts":["Sono","Saranno","Sarebbero"],"a":1,"why":"Approximation → futur : saranno."},{"q":"Appena ___ , ti mando le foto. (tornare, io)","opts":["torno","sarò tornato","tornerei"],"a":1,"why":"appena + futur antérieur : sarò tornato (torno est aussi courant à l'oral)."}]},{"id":"g30","track":"b1","title":"L'imperativo con i pronomi","ref":"Verso il B1","intro":"Avec tu, noi, voi, le pronom se colle derrière le verbe : dimmi, fallo, prendilo, alzati, scrivetemi. Avec les formes brèves da', di', fa', sta', va' la consonne du pronom double : dammi, dillo, fammi, stacci, vacci (sauf gli : dagli). Avec Lei, le pronom précède : mi dica, lo prenda, si accomodi. Négation : non farlo ou non lo fare (tu) ; non lo faccia (Lei).","tables":[{"h":["","tu","Lei","voi"],"r":[["dire + mi","dimmi","mi dica","ditemi"],["fare + lo","fallo","lo faccia","fatelo"],["dare + mi","dammi","mi dia","datemi"],["prendere + la","prendila","la prenda","prendetela"],["alzarsi","alzati","si alzi","alzatevi"],["négation","non farlo / non lo fare","non lo faccia","non fatelo"]]}],"exs":[{"it":"Scusi, mi dica pure: cosa desidera?","fr":"Allez-y, dites-moi : que désirez-vous ?"},{"it":"Dammi una mano con queste scatole, per favore.","fr":"Donne-moi un coup de main avec ces cartons, s'il te plaît."}],"quiz":[{"q":"(tu) ___ la verità! (dire + mi)","opts":["Dimmi","Mi di'","Dicimi"],"a":0,"why":"di' + mi → dimmi (consonne doublée)."},{"q":"(Lei) Prego, ___! (accomodarsi)","opts":["accomodati","si accomodi","accomodatevi"],"a":1,"why":"Forme de politesse : pronom avant le verbe → si accomodi."},{"q":"(voi) ___ il modulo entro domani. (compilare + lo)","opts":["compilatelo","lo compilate","compilalo"],"a":0,"why":"voi → verbe + pronom : compilatelo."},{"q":"(tu) Non ___, è una sorpresa! (dire + lo)","opts":["dirlo","dillo","lo dici"],"a":0,"why":"Négation avec tu → non + infinitif + pronom : non dirlo."}]},{"id":"g31","track":"b1","title":"I pronomi relativi: che, cui, il quale, chi","ref":"Verso il B1","intro":"che = qui / que (sujet ou complément direct, invariable) : il collega che lavora con me ; la mail che ho scritto. cui = après une préposition : la persona a cui ho scritto, il motivo per cui, la città in cui vivo. il/la quale, i/le quali = forme plus formelle, variable. chi = celui qui / ceux qui (sans antécédent) : chi dorme non piglia pesci. quello che / ciò che = ce que.","tables":[{"h":["pronom","exemple","traduction"],"r":[["che (sujet)","Il tram che passa qui va in centro.","Le tram qui passe ici va au centre."],["che (objet)","Il film che abbiamo visto era lungo.","Le film que nous avons vu était long."],["prep + cui","La ditta per cui lavoro è a Mirafiori.","L'entreprise pour laquelle je travaille est à Mirafiori."],["il cui","Un collega il cui figlio gioca a calcio.","Un collègue dont le fils joue au foot."],["chi","Chi arriva tardi non trova posto.","Celui qui arrive tard ne trouve pas de place."],["quello che","Non capisco quello che dici.","Je ne comprends pas ce que tu dis."]]}],"exs":[{"it":"Il meccanico a cui ho portato la macchina è bravissimo.","fr":"Le mécanicien à qui j'ai apporté la voiture est excellent."},{"it":"Chi vuole venire allo stadio alzi la mano.","fr":"Que ceux qui veulent venir au stade lèvent la main."}],"quiz":[{"q":"La collega ___ ti ho parlato è francese.","opts":["che","di cui","cui"],"a":1,"why":"parlare di → la collega di cui ti ho parlato."},{"q":"Il ristorante ___ abbiamo cenato era caro.","opts":["che","in cui","cui"],"a":1,"why":"Complément de lieu → in cui (ou dove)."},{"q":"___ ha finito può andare a casa.","opts":["Che","Chi","Cui"],"a":1,"why":"Sans antécédent, « celui qui » → chi."},{"q":"Ecco il preventivo ___ hai chiesto.","opts":["che","cui","il quale"],"a":0,"why":"Complément direct → che."}]},{"id":"g32","track":"b1","title":"Il « si » impersonale e passivante","ref":"Verso il B1","intro":"si + verbe à la 3e personne = on. Si mangia bene in questa piola (on mange bien). Avec un complément au pluriel, le verbe s'accorde : si vendono case, si parlano due lingue. Au passé avec essere : si è mangiato bene, si è andati (l'adjectif/participe au pluriel : si è stanchi). Avec un verbe réfléchi : ci si alza presto.","tables":[{"h":["forme","exemple","traduction"],"r":[["si + singulier","Qui si parla italiano.","Ici on parle italien."],["si + pluriel","Si cercano operai specializzati.","On recherche des ouvriers qualifiés."],["passé","Ieri si è lavorato fino a tardi.","Hier on a travaillé tard."],["adjectif","Quando si è stanchi, si sbaglia.","Quand on est fatigué, on se trompe."],["réfléchi","In Italia ci si saluta con due baci.","En Italie on se salue avec deux bises."]]}],"exs":[{"it":"Da qui si vede tutta Torino.","fr":"D'ici on voit tout Turin."},{"it":"In mensa si mangia alle dodici e mezza.","fr":"À la cantine on mange à midi et demi."}],"quiz":[{"q":"In questo negozio ___ scarpe italiane. (vendere)","opts":["si vende","si vendono","vendono si"],"a":1,"why":"Complément au pluriel → si vendono."},{"q":"A Torino ___ bene. (vivere)","opts":["si vive","si vivono","vive si"],"a":0,"why":"Pas de complément → singulier : si vive."},{"q":"La domenica ___ tardi. (alzarsi, impersonnel)","opts":["si si alza","ci si alza","si alza"],"a":1,"why":"Verbe réfléchi impersonnel → ci si alza."},{"q":"Al matrimonio ___ tantissimo. (ballare, passé)","opts":["si è ballato","si ha ballato","si sono ballati"],"a":0,"why":"Impersonnel au passé → essere : si è ballato."}]},{"id":"g33","track":"b1","title":"Il discorso indiretto","ref":"Verso il B1","intro":"Rapporter des paroles : dice che + même temps ; ha detto che + recul des temps : présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel passé, impératif → di + infinitif. Les questions : ha chiesto se… / dove… / quando…. Les repères changent : oggi → quel giorno, domani → il giorno dopo, qui → lì.","tables":[{"h":["direct","indirect (ha detto che…)"],"r":[["« Sono stanco. »","Ha detto che era stanco."],["« Ho finito il lavoro. »","Ha detto che aveva finito il lavoro."],["« Verrò domani. »","Ha detto che sarebbe venuto il giorno dopo."],["« Chiamami! »","Mi ha detto di chiamarlo."],["« Hai fame? »","Mi ha chiesto se avevo fame."],["« Dove abiti? »","Mi ha chiesto dove abitavo."]]}],"exs":[{"it":"Il capo ha detto che la riunione era rimandata.","fr":"Le chef a dit que la réunion était reportée."},{"it":"Mi ha chiesto di mandargli il verbale.","fr":"Il m'a demandé de lui envoyer le compte rendu."}],"quiz":[{"q":"« Arrivo alle nove. » → Ha detto che ___ alle nove.","opts":["arriva","arrivava","arriverà"],"a":1,"why":"Présent → imparfait : arrivava."},{"q":"« Ho perso le chiavi. » → Ha detto che ___ le chiavi.","opts":["ha perso","aveva perso","perdeva"],"a":1,"why":"Passé composé → plus-que-parfait : aveva perso."},{"q":"« Aspettami! » → Mi ha detto ___.","opts":["che aspettarlo","di aspettarlo","aspettalo"],"a":1,"why":"Impératif → di + infinitif : di aspettarlo."},{"q":"« Vieni alla festa? » → Mi ha chiesto ___ alla festa.","opts":["se venivo","che venivo","se vengo"],"a":0,"why":"Question fermée → se + imparfait : se venivo."}]},{"id":"g34","track":"b1","title":"I verbi pronominali: farcela, andarsene, volerci…","ref":"Verso il B1","intro":"Des verbes très courants qui intègrent un ou deux pronoms. farcela = y arriver (ce la faccio, ce la fai…) ; andarsene = s'en aller (me ne vado, te ne vai, se ne va) ; volerci = falloir (ci vuole un'ora, ci vogliono due ore) ; metterci = mettre du temps (ci metto dieci minuti) ; cavarsela = se débrouiller (me la cavo) ; prendersela = se vexer (se la prende) ; fregarsene = s'en ficher (familier). Au passé : ce l'ho fatta, me ne sono andato, ci sono volute due ore.","tables":[{"h":["verbe","io","lui/lei","passé (io)"],"r":[["farcela","ce la faccio","ce la fa","ce l'ho fatta"],["andarsene","me ne vado","se ne va","me ne sono andato/a"],["volerci","—","ci vuole / ci vogliono","ci è voluto / ci sono voluti"],["metterci","ci metto","ci mette","ci ho messo"],["cavarsela","me la cavo","se la cava","me la sono cavata"],["prendersela","me la prendo","se la prende","me la sono presa"]]}],"exs":[{"it":"Da Mirafiori al centro ci vogliono venti minuti di tram.","fr":"De Mirafiori au centre il faut vingt minutes de tram."},{"it":"Non ce la faccio più, me ne vado a casa.","fr":"Je n'en peux plus, je rentre chez moi."}],"quiz":[{"q":"Per arrivare a Milano ___ un'ora di treno.","opts":["ci vuole","ci vogliono","ci mette"],"a":0,"why":"un'ora (singulier) → ci vuole."},{"q":"Con l'italiano ormai ___ abbastanza bene. (cavarsela, io)","opts":["mi cavo","me la cavo","me ne cavo"],"a":1,"why":"cavarsela → me la cavo."},{"q":"È tardi, noi ___. (andarsene)","opts":["ce ne andiamo","ci andiamo","ce la andiamo"],"a":0,"why":"andarsene → ce ne andiamo."},{"q":"Alla fine ___! (farcela, io, passé)","opts":["ce l'ho fatto","ce l'ho fatta","ce la ho fatta"],"a":1,"why":"Au passé le participe s'accorde avec la : ce l'ho fatta."}]},{"id":"g35","track":"b1","title":"I connettivi: siccome, mentre, benché, perciò…","ref":"Verso il B1","intro":"Les connecteurs structurent le discours. Cause : perché (après), siccome / dato che / visto che (en tête de phrase). Conséquence : quindi, perciò, allora. Opposition : ma, però, invece, mentre, anche se (+ indicatif), benché / sebbene / nonostante (+ subjonctif). Temps : mentre, appena, finché, prima di + infinitif, dopo aver + participe. But : per + infinitif, affinché / perché + subjonctif.","tables":[{"h":["connecteur","exemple","traduction"],"r":[["siccome","Siccome pioveva, ho preso il tram.","Comme il pleuvait, j'ai pris le tram."],["perciò","Era tardi, perciò siamo tornati.","Il était tard, donc nous sommes rentrés."],["mentre","Mentre cucinavo, è arrivato Luca.","Pendant que je cuisinais, Luca est arrivé."],["anche se","Esco anche se sono stanco.","Je sors même si je suis fatigué."],["benché","Benché sia caro, lo compro.","Bien que ce soit cher, je l'achète."],["dopo aver","Dopo aver mangiato, ho dormito.","Après avoir mangé, j'ai dormi."]]}],"exs":[{"it":"Visto che il fornitore non risponde, chiamiamo un altro.","fr":"Vu que le fournisseur ne répond pas, appelons-en un autre."},{"it":"Prima di firmare, leggi bene il contratto.","fr":"Avant de signer, lis bien le contrat."}],"quiz":[{"q":"___ era sciopero, sono andato in bici.","opts":["Perché","Siccome","Perciò"],"a":1,"why":"Cause en tête de phrase → siccome."},{"q":"Vengo alla partita ___ piova.","opts":["anche se","benché","mentre"],"a":1,"why":"piova est un subjonctif → benché."},{"q":"___ aver finito il turno, è andato in palestra.","opts":["Prima di","Dopo","Mentre"],"a":1,"why":"dopo + aver + participe."},{"q":"Non avevo fame, ___ non ho ordinato il primo.","opts":["siccome","perciò","benché"],"a":1,"why":"Conséquence → perciò."}]},{"id":"g36","track":"b1","title":"Gli avverbi: formazione e posizione","ref":"Verso il B1","intro":"Adverbes en -mente : du féminin de l'adjectif : lento → lentamente, veloce → velocemente ; les adjectifs en -le/-re perdent le e : facile → facilmente, regolare → regolarmente. Position au passé composé : già, ancora, mai, sempre, appena se placent entre l'auxiliaire et le participe : ho già mangiato, non è ancora arrivato, non ho mai visto. Attention : « molto » adverbe est invariable (sono molto stanchi), « molti » adjectif s'accorde.","tables":[{"h":["adjectif","adverbe","exemple"],"r":[["sicuro","sicuramente","Sicuramente arriva in ritardo."],["probabile","probabilmente","Probabilmente è in riunione."],["gentile","gentilmente","Mi ha risposto gentilmente."],["particolare","particolarmente","Un cliente particolarmente esigente."],["già / ancora","—","Hai già mangiato? — Non ancora."],["mai","—","Non sono mai stato a Napoli."]]}],"exs":[{"it":"Purtroppo il treno è appena partito.","fr":"Malheureusement le train vient de partir."},{"it":"Ho già mandato il preventivo al cliente.","fr":"J'ai déjà envoyé le devis au client."}],"quiz":[{"q":"L'adverbe de « facile » est :","opts":["facilemente","facilmente","facilamente"],"a":1,"why":"Les adjectifs en -le perdent le e : facilmente."},{"q":"Non ___ visto questo film. (mai)","opts":["ho mai","mai ho","ho visto mai"],"a":0,"why":"mai entre auxiliaire et participe : non ho mai visto."},{"q":"I colleghi sono ___ stanchi oggi.","opts":["molti","molto","molte"],"a":1,"why":"Devant un adjectif, molto est adverbe, invariable."},{"q":"Il corriere è ___ passato, cinque minuti fa.","opts":["appena","già","ancora"],"a":0,"why":"« vient de » → è appena passato."}]},{"id":"g37","track":"b1","title":"Il gerundio e il participio: altri usi","ref":"Verso il B1","intro":"Gérondif simple = en + participe présent : Mangiando, si impara (en mangeant). Gérondif passé : avendo finito, essendo arrivato (ayant…). pur + gérondif = tout en / bien que : pur essendo stanco, lavora. Le participe passé seul peut remplacer une subordonnée : Finita la riunione, siamo usciti (une fois la réunion finie). stare per + infinitif = être sur le point de.","tables":[{"h":["forme","exemple","traduction"],"r":[["gérondif (moyen)","Si impara sbagliando.","On apprend en se trompant."],["gérondif (temps)","Tornando a casa ho visto Anna.","En rentrant j'ai vu Anna."],["pur + gérondif","Pur avendo fretta, mi ha aiutato.","Bien qu'il fût pressé, il m'a aidé."],["gérondif passé","Avendo perso il tram, ho preso un taxi.","Ayant raté le tram, j'ai pris un taxi."],["participe absolu","Firmato il contratto, abbiamo brindato.","Le contrat signé, nous avons trinqué."],["stare per","Sto per uscire.","Je suis sur le point de sortir."]]}],"exs":[{"it":"Pur non parlando bene, mi faccio capire.","fr":"Même si je ne parle pas bien, je me fais comprendre."},{"it":"Finito il turno, andiamo a bere una birra.","fr":"Une fois le service fini, on va boire une bière."}],"quiz":[{"q":"___ in tram, leggo le notizie. (andare)","opts":["Andando","Andato","Andare"],"a":0,"why":"Gérondif simultané : andando."},{"q":"___ la partita, i tifosi hanno festeggiato.","opts":["Vincendo","Vinta","Vincere"],"a":1,"why":"Participe absolu accordé avec partita : vinta."},{"q":"Pur ___ poco tempo, risponde sempre. (avere)","opts":["avendo","avuto","ha"],"a":0,"why":"pur + gérondif : pur avendo."},{"q":"Il treno ___ partire: corri!","opts":["sta per","sta","è per"],"a":0,"why":"stare per + infinitif : sta per partire."}]},{"id":"g38","track":"b1","title":"Le preposizioni difficili","ref":"Verso il B1","intro":"Quelques points qui piègent les francophones. Lieu : in + pays/régions/rues (in Italia, in via Roma), a + villes (a Torino), da + personne ou fonction (vado dal medico, sono da Marco). Temps : da = depuis (vivo qui da un anno), per = pendant (ho lavorato per due ore), tra/fra = dans (parto tra un'ora), in = en (in due giorni). Verbes : pensare a, cercare di, provare a, riuscire a, smettere di, finire di, cominciare a, avere bisogno di, dipendere da.","tables":[{"h":["italien","français","piège"],"r":[["Vado dal dentista.","Je vais chez le dentiste.","chez → da"],["Abito a Torino, in Piemonte.","J'habite à Turin, dans le Piémont.","a ville, in région"],["Lavoro qui da aprile.","Je travaille ici depuis avril.","depuis → da"],["Torno tra dieci minuti.","Je reviens dans dix minutes.","dans (futur) → tra/fra"],["Cerco di arrivare presto.","J'essaie d'arriver tôt.","cercare di"],["Penso a te.","Je pense à toi.","pensare a"]]}],"exs":[{"it":"Vivo a Torino da un anno e mezzo.","fr":"Je vis à Turin depuis un an et demi."},{"it":"Smetto di lavorare alle sei e vado dal meccanico.","fr":"J'arrête de travailler à six heures et je vais chez le mécanicien."}],"quiz":[{"q":"Stasera ceniamo ___ Luca.","opts":["a","da","in"],"a":1,"why":"chez quelqu'un → da Luca."},{"q":"Abito ___ Italia ___ due anni.","opts":["in / da","a / per","in / fra"],"a":0,"why":"in + pays ; depuis → da."},{"q":"Il treno parte ___ venti minuti.","opts":["in","tra","da"],"a":1,"why":"« dans vingt minutes » (futur) → tra."},{"q":"Ho ___ di un caffè.","opts":["bisogno","bisogno a","voglia a"],"a":0,"why":"avere bisogno di."}]},{"id":"g39","track":"b1","title":"L'italiano formale: mail e telefono","ref":"Verso il B1","intro":"Avec un client ou un fournisseur : Lei (3e personne, pronoms La / Le : La ringrazio, Le scrivo). Ouverture : Gentile Signor Rossi / Gentile Dott.ssa Bianchi / Buongiorno. Corps : Le scrivo in merito a…, in riferimento alla Sua mail del…, in allegato trova…, Le chiedo gentilmente di…, mi permetto di sollecitare…. Clôture : resto a disposizione per qualsiasi chiarimento, in attesa di un Suo riscontro, cordiali saluti / distinti saluti. Au téléphone : Pronto, sono Julien di EASE. Potrei parlare con…? Le passo il collega. La richiamo io.","tables":[{"h":["moment","formule","traduction"],"r":[["ouverture","Gentile Ingegner Russo,","Monsieur Russo (ingénieur),"],["objet","Le scrivo in merito al preventivo n. 42.","Je vous écris au sujet du devis n° 42."],["pièce jointe","In allegato trova l'offerta aggiornata.","Vous trouverez ci-joint l'offre mise à jour."],["demande","Le chiederei di confermare entro venerdì.","Je vous demanderais de confirmer d'ici vendredi."],["relance","Mi permetto di sollecitare un riscontro.","Je me permets de relancer pour un retour."],["clôture","Cordiali saluti, Julien","Cordialement, Julien"]]}],"exs":[{"it":"Resto a disposizione per qualsiasi chiarimento.","fr":"Je reste à votre disposition pour tout éclaircissement."},{"it":"Pronto, buongiorno, sono Julien di EASE: potrei parlare con il signor Conti?","fr":"Allô, bonjour, c'est Julien d'EASE : pourrais-je parler à monsieur Conti ?"}],"quiz":[{"q":"Formule de politesse (Lei) pour « je vous remercie » :","opts":["Ti ringrazio","La ringrazio","Vi ringrazio"],"a":1,"why":"Lei → pronom direct La : La ringrazio."},{"q":"« Je vous écris » (à un client) :","opts":["Le scrivo","La scrivo","Ti scrivo"],"a":0,"why":"scrivere a qualcuno → pronom indirect Le."},{"q":"Pour clore un mail formel :","opts":["Ciao!","Cordiali saluti","A presto, baci"],"a":1,"why":"Cordiali saluti (ou distinti saluti)."},{"q":"« Ci-joint » se dit :","opts":["in allegato","in attaccato","con allegare"],"a":0,"why":"in allegato."}]},{"id":"g40","track":"b1","title":"Plurali irregolari e nomi particolari","ref":"Verso il B1","intro":"Noms en -co/-go : amico → amici, medico → medici, mais fuoco → fuochi, albergo → alberghi, collega → colleghi. Noms en -cia/-gia : camicia → camicie, spiaggia → spiagge. Masculins en -a : il problema → i problemi, il programma → i programmi. Pluriels féminins irréguliers : l'uovo → le uova, il braccio → le braccia, il dito → le dita, il paio → le paia. Invariables : la città, il caffè, la foto, l'auto, la crisi, il bar. La mano est féminin : le mani.","tables":[{"h":["singulier","pluriel","remarque"],"r":[["il collega / la collega","i colleghi / le colleghe","-ga → -ghe, -ga (m.) → -ghi"]       { id: "dolce", name: "Dolce", title: dolceCard.it, sub: dolceCard.fr, card: dolceCard.id, action: "menu-dolce" },
    ] };
    Store.s.menu = menu; Store.save(); return menu;
  },
  done(id) { const m = Store.s.menu; if (!m || m.day !== dayKey() || m.done[id]) return; m.done[id] = true; Store.save(); if (Object.keys(m.done).length === 5) toast("Menù del giorno terminé. Complimenti!"); },
  course(id) { const m = Store.s.menu; return m?.day === dayKey() ? m.courses.find((c) => c.id === id) : null; },
};

/* ═══════════════════════════════════════════
   9. Sessions d'exercices (reçus du jour, apprentissage, contrôle)
   ═══════════════════════════════════════════ */
const Sess = {
  rounds(cards, { n = 12, typeEvery = 2, conjItems = [] } = {}) {
    const src = shuffle(cards).slice(0, n);
    const rs = src.map((w, idx) => idx % typeEvery === 1
      ? { type: "type", w, lead: "Écris en italien", prompt: w.fr, accepted: [...acceptedAnswers(w)], display: w.it }
      : { type: "mcq", w, lead: "Comment dit-on en italien", q: w.fr, opts: Distract.options(w), a: w.id, display: w.it });
    conjItems.forEach((it, i) => { const opts = i % 2 === 0 ? Distract.conjOptions(it.id, it.body) : []; rs.push(opts.length === 4 ? { type: "mcq", lead: "Choisis la bonne forme", q: it.title, opts, a: it.id, display: it.body, conj: it.id } : { type: "type", lead: `${it.extra} — écris la forme`, prompt: it.title, accepted: String(it.body || "").split(" / ").map(norm), display: it.body, conj: it.id }); });
    return shuffle(rs).slice(0, n);
  },
  open(sess) { G.sess = { idx: 0, score: 0, answered: null, input: "", ...sess }; Router.go("/sessione"); },
  today(scope) {
    const src = (scope === "week" ? Today.sent : Today.items()).map((s) => s.item).filter(Boolean);
    const uniq = [], seen = new Set(); src.forEach((i) => { if (!seen.has(i.id)) { seen.add(i.id); uniq.push(i); } });
    if (!uniq.length) { toast("Rien à réviser pour l'instant"); return; }
    const cards = uniq.filter((i) => i.kind !== "conj").map((i) => BY_ID[i.id.replace(/^[wp]:/, "")] || { id: i.id, it: i.title, fr: i.body, ex: "", exFr: "", cat: i.kind === "phrase" ? "dialoghi" : "" });
    const conj = uniq.filter((i) => i.kind === "conj");
    this.open({ kind: "today", scope, title: scope === "week" ? "Esercizi della settimana" : "Esercizi di oggi", back: "/oggi", phase: "quiz", rounds: this.rounds(cards, { n: 12, conjItems: conj }) });
  },
  learn({ ids, title, back, onDone }) {
    const cards = ids.map((id) => BY_ID[id]).filter(Boolean);
    if (!cards.length) { toast("Rien de nouveau ici"); return; }
    this.open({ kind: "learn", title, back, onDone, phase: "cards", cards: cards.map((c) => c.id), ci: 0, flipped: false, rounds: this.rounds(cards, { n: Math.min(8, cards.length), typeEvery: 3 }) });
  },
  check({ ids, n, title, back, onDone }) {
    const cards = ids.map((id) => BY_ID[id]).filter(Boolean);
    if (cards.length < 4) { toast("Fais d'abord les étapes précédentes"); return; }
    this.open({ kind: "check", title, back, onDone, phase: "quiz", pass: 0.8, pool: cards.map((c) => c.id), n, rounds: this.rounds(cards, { n: Math.min(n, cards.length), typeEvery: 4 }) });
  },
  finish() {
    const s = G.sess; if (!s || s.finished) return; s.finished = true;
    const n = s.rounds.length, ok = n ? s.score / n >= (s.pass || 0) : true;
    s.passed = ok;
    if (s.onDone?.type === "step" && ok) { const p = PERCORSI.find((x) => x.id === s.onDone.path), st = p?.steps.find((x) => x.id === s.onDone.step); if (p && st) Percorsi.markDone(p, st); }
    if (s.onDone?.type === "menu") Menu.done(s.onDone.course);
  },
};

  "an-pick": (d) => { const A = G.st.a, i = +d.i; if (A.status === "ok" || A.status === "rev" || A.letters[i].used) return; A.letters[i].used = true; A.picked.push(i); A.status = null; if (A.picked.length === A.w.word.length) { const g = A.picked.map((x) => A.letters[x].ch).join(""); if (g === A.w.word) { A.status = "ok"; A.score++; Store.grade(A.w.id, true); } else A.status = "ko"; } render(); },
  "an-undo": () => { const A = G.st.a; if (!A.picked.length || A.status === "ok") return; A.letters[A.picked.pop()].used = false; A.status = null; render(); },
  "an-clear": () => { const A = G.st.a; if (A.status === "ok") return; A.letters.forEach((l) => l.used = false); A.picked = []; A.status = null; render(); },
  "an-reveal": () => { const A = G.st.a; Store.grade(A.w.id, false, "ortografia"); A.status = "rev"; render(); },
  "an-next": () => { const A = G.st.a; A.used.add(A.w.id); if (A.count >= 8) { A.fin = true; finishGame(); } else { A.count++; anaRound(A); } render({ top: true }); },
  "ab-l": (d) => { if (G.st.b.err) return; G.st.b.selL = d.id; render(); abbinaCheck(); },
  "ab-r": (d) => { if (G.st.b.err) return; G.st.b.selR = d.id; render(); abbinaCheck(); },
  "ab-new": () => { G.st.b = abbinaRound(G.st.b); render({ top: true }); },
};
function sessionAnswer(ok, extra, errType) { const s = G.sess, r = s.rounds[s.idx]; s.answered = { ok, ...extra }; if (ok) s.score++; if (r.w && BY_ID[r.w.id]) Store.grade(r.w.id, ok, errType); else { Store.activity({ answers: 1, correct: ok ? 1 : 0 }); if (!ok && errType) { Store.s.stats.errors[errType] = (Store.s.stats.errors[errType] || 0) + 1; Store.markState("stats"); } Store.save(); } render(); }
function abbinaCheck() { const B = G.st.b; if (!B.selL || !B.selR) return; B.tries++; if (B.selL === B.selR) { B.matched.add(B.selL); Store.grade(B.selL, true); B.selL = B.selR = null; if (B.matched.size === 6) finishGame(); render(); } else { B.err = { l: B.selL, r: B.selR }; render(); setTimeout(() => { if (G.st.b !== B) return; B.err = null; B.selL = B.selR = null; render(); }, 550); } }

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (el) { const fn = Actions[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); } return; }
  const a = e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); Router.go(a.getAttribute("href").slice(1)); }
});
app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && ["inp", "email", "code"].includes(e.target.id)) { e.preventDefault(); app.querySelector("[data-enter]")?.click(); }
  if (e.target.matches(".cell input") && e.key === "Backspace") { const key = e.target.dataset.key, C = G.st.c; if ((C.cells[key] || "").length) return; e.preventDefault(); const p = Cw.entryFor(key); if (!p) return; const ks = cellsOf(p), i = ks.indexOf(key); if (i > 0) { C.cells[ks[i - 1]] = ""; Cw.paint(); Cw.focus(ks[i - 1]); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === document.body) { e.preventDefault(); app.querySelector("[data-enter]")?.click(); } });
app.addEventListener("input", (e) => { if (e.target.matches(".cell input")) Cw.input(e.target.dataset.key, e.target.value); });
app.addEventListener("change", (e) => {
  if (e.target.id === "sh" || e.target.id === "eh") { const s = Store.s.settings; s.start_hour = +document.getElementById("sh").value; s.end_hour = +document.getElementById("eh").value; if (s.end_hour <= s.start_hour) { s.end_hour = Math.min(24, s.start_hour + 1); toast("La fin doit être après le début"); } settingsChanged(); }
});
app.addEventListener("toggle", (e) => { if (e.target.matches("details.day")) { G.st.days ??= {}; G.st.days[e.target.dataset.k] = e.target.open; } }, true);
app.addEventListener("focusin", (e) => { if (e.target.matches(".cell input")) { const key = e.target.dataset.key, act = Cw.active(); if (act && cellsOf(act).includes(key)) return; const p = Cw.entryFor(key); if (p) { G.st.c.active = { id: p.id, dir: p.dir }; Cw.paint(); } } });
app.addEventListener("dblclick", (e) => { if (e.target.matches(".cell input")) { const key = e.target.dataset.key, here = Cw.entries().filter((p) => cellsOf(p).includes(key)); const a = G.st.c.active; if (here.length > 1 && a) { const o = here.find((p) => !(p.id === a.id && p.dir === a.dir)); if (o) { G.st.c.active = { id: o.id, dir: o.dir }; Cw.paint(); } } } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (Router.path === "/oggi") Today.refresh(); } else { clearTimeout(Sync.t); Sync.push(); } });

/* ═══════════════════════════════════════════
   13. Démarrage
   ═══════════════════════════════════════════ */
Store.load(); Auth.load();
const fromLink = Auth.fromUrl();
if (DEMO) window.ImparaReset = () => { try { localStorage.removeItem(KEY); localStorage.removeItem(AUTH_KEY); } catch (e) {} Store.load(); Auth.load(); Demo.sent = null; Today.sent = []; Today.at = 0; G.key = ""; G.st = {}; G.sess = null; Router.go("/oggi"); render({ top: true }); Push.me(); };
if (location.hash === "#oggi" || !location.hash) location.replace("#/oggi");
Router.parse(); G.fresh(Router.path, Router.params);
Push.init();
render();
Push.me();
if (Auth.user) Sync.full().then(() => { if (fromLink) toast("Connecté"); });
</script>
